                    <div style={{ fontSize:11, color:"#5b8fa8", fontWeight:700, textTransform:"uppercase", marginBottom:8 }}>Meter Details</div>
                    <div style={{ display:"grid", gridTemplateColumns:"auto 1fr", gap:"4px 14px", fontSize:13 }}>
                      <span style={{ color:"#5b8fa8" }}>Meter No</span><b style={{ fontFamily:"monospace", color:"#0077b6" }}>{u?.meterNo}</b>
                      <span style={{ color:"#5b8fa8" }}>Prev Reading</span><span>{preview.prevReading} m³</span>
                      <span style={{ color:"#5b8fa8" }}>Curr Reading</span><span>{preview.currReading} m³</span>
                      <span style={{ color:"#5b8fa8" }}>Units Used</span><b style={{ color:"#0077b6" }}>{preview.units} m³</b>
                    </div>
                  </div>
                </div>

                {/* Line items */}
                <div style={{ padding:"0 22px 8px" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                    <thead><tr style={{ borderBottom:"2px solid #e8f4fd" }}>
                      <th style={{ padding:"10px 0", textAlign:"left", color:"#5b8fa8", fontWeight:700, fontSize:11, textTransform:"uppercase" }}>Description</th>
                      <th style={{ padding:"10px 0", textAlign:"right", color:"#5b8fa8", fontWeight:700, fontSize:11, textTransform:"uppercase" }}>Amount</th>
                    </tr></thead>
                    <tbody>
                      <tr style={{ borderBottom:"1px solid #f0f7ff" }}>
                        <td style={{ padding:"10px 0", color:"#0a2540" }}>Water Consumption — {preview.units} m³ × KES {tariff.flatRate}/m³</td>
                        <td style={{ padding:"10px 0", textAlign:"right", fontWeight:600 }}>{fmtKES(preview.waterCharge||preview.amount||0)}</td>
                      </tr>
                      {(preview.standingCharge>0) && <tr style={{ borderBottom:"1px solid #f0f7ff" }}>
                        <td style={{ padding:"10px 0", color:"#0a2540" }}>Monthly Standing Charge</td>
                        <td style={{ padding:"10px 0", textAlign:"right", fontWeight:600 }}>{fmtKES(preview.standingCharge)}</td>
                      </tr>}
                      {(preview.prevBalance>0) && <tr style={{ borderBottom:"1px solid #f0f7ff" }}>
                        <td style={{ padding:"10px 0", color:"#dc2626" }}>Previous Outstanding Balance (Carried Forward)</td>
                        <td style={{ padding:"10px 0", textAlign:"right", fontWeight:600, color:"#dc2626" }}>{fmtKES(preview.prevBalance)}</td>
                      </tr>}
                      {(preview.penaltyAmount>0) && <tr style={{ borderBottom:"1px solid #f0f7ff" }}>
                        <td style={{ padding:"10px 0", color:"#dc2626" }}>Late Payment Penalty</td>
                        <td style={{ padding:"10px 0", textAlign:"right", fontWeight:600, color:"#dc2626" }}>{fmtKES(preview.penaltyAmount)}</td>
                      </tr>}
                      {(preview.vatAmount>0) && <tr style={{ borderBottom:"1px solid #f0f7ff" }}>
                        <td style={{ padding:"10px 0", color:"#0a2540" }}>VAT ({tariff.vatRate}%)</td>
                        <td style={{ padding:"10px 0", textAlign:"right", fontWeight:600 }}>{fmtKES(preview.vatAmount)}</td>
                      </tr>}
                    </tbody>
                    <tfoot>
                      <tr style={{ background:"#f8fbff" }}>
                        <td style={{ padding:"14px 0", fontWeight:800, fontSize:16, color:"#0a2540" }}>TOTAL DUE</td>
                        <td style={{ padding:"14px 0", textAlign:"right", fontWeight:800, fontSize:20, color:"#0077b6" }}>{fmtKES(total)}</td>
                      </tr>
                      <tr>
                        <td style={{ padding:"6px 0", color:"#059669", fontWeight:600 }}>Amount Paid</td>
                        <td style={{ padding:"6px 0", textAlign:"right", fontWeight:700, color:"#059669" }}>{fmtKES(paid)}</td>
                      </tr>
                      <tr style={{ borderTop:"2px solid #e8f4fd" }}>
                        <td style={{ padding:"10px 0", fontWeight:800, color:bal>0?"#dc2626":"#059669" }}>BALANCE {bal>0?"OUTSTANDING":"— FULLY PAID ✓"}</td>
                        <td style={{ padding:"10px 0", textAlign:"right", fontWeight:800, fontSize:18, color:bal>0?"#dc2626":"#059669" }}>{bal>0?fmtKES(bal):"KES 0"}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>

                {/* Progress bar */}
                <div style={{ padding:"10px 22px 18px" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:5 }}>
                    <span style={{ color:"#5b8fa8" }}>Payment progress</span>
                    <b style={{ color:pct>=100?"#059669":"#0077b6" }}>{pct}%</b>
                  </div>
                  <div style={{ background:"#e8f4fd", borderRadius:8, height:8 }}>
                    <div style={{ background:pct>=100?"#059669":"linear-gradient(90deg,#0077b6,#00b4d8)", borderRadius:8, height:8, width:`${pct}%` }}/>
                  </div>
                  <div style={{ marginTop:10, fontSize:12, color:"#5b8fa8" }}>
                    Pay via M-Pesa Paybill <b style={{ color:"#0a2540" }}>XXXXXX</b> · Account No: <b style={{ fontFamily:"monospace", color:"#0077b6" }}>{u?.meterNo}</b>
                  </div>
                </div>

                <div style={{ background:preview.status==="paid"?"#d1fae5":preview.status==="overdue"?"#fee2e2":"#fef3c7", padding:"12px 22px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <span style={{ fontWeight:700, color:preview.status==="paid"?"#065f46":preview.status==="overdue"?"#991b1b":"#92400e" }}>
                    {preview.status==="paid"?"✓ FULLY PAID":preview.status==="overdue"?"⚠ OVERDUE":"⏳ PAYMENT PENDING"}
                  </span>
                  <Badge status={preview.status}/>
                </div>
              </div>
              <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:16 }}>
                <button onClick={()=>setPreview(null)} style={sSecond}>Close</button>
                <button style={sPrimary}><Icon name="download" size={14} color="#fff"/> Download PDF</button>
              </div>
            </Modal>
          );
        })()}
      </>
    );
  };

  // ════════════════════════════════════════════════════════════════════════
  //  TAB D — PENALTIES
  // ════════════════════════════════════════════════════════════════════════
  const PenaltiesTab = () => {
    const overdue = bills.filter(b=>b.status==="overdue");

    const applyPenalty = (bill) => {
      const pen = calcPenaltyAmount(bill, tariff);
      if (!pen) return showToast("No penalty applicable yet (within grace period)","error");
      const current = bill.penaltyAmount || 0;
      const newTotal = (bill.totalAmount||bill.amount||0) + pen;
      setBills(bills.map(b=>b.id===bill.id ? {...b, penaltyAmount:(current+pen), totalAmount:newTotal, status:"overdue"} : b));
      showToast(`Penalty of ${fmtKES(pen)} applied!`);
    };

    const applyAllPenalties = () => {
      let count = 0;
      const updated = bills.map(b=>{
        if (b.status!=="overdue") return b;
        const pen = calcPenaltyAmount(b, tariff);
        if (!pen) return b;
        count++;
        return { ...b, penaltyAmount:(b.penaltyAmount||0)+pen, totalAmount:(b.totalAmount||b.amount||0)+pen };
      });
      setBills(updated);
      showToast(`Penalties applied to ${count} bill(s)`);
    };

    return (
      <div>
        {/* Config banner */}
        <div style={{ background:"linear-gradient(135deg,#7f1d1d,#dc2626)", borderRadius:16, padding:"18px 22px", marginBottom:20, color:"#fff", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:12 }}>
          <div>
            <div style={{ fontWeight:800, fontSize:16 }}>Penalty Configuration</div>
            <div style={{ opacity:0.8, fontSize:13, marginTop:3 }}>
              {tariff.penaltyEnabled
                ? `${tariff.penaltyValue}${tariff.penaltyMode==="percent"?"%":` KES`} after ${tariff.penaltyGrace}-day grace period`
                : "Penalties are currently DISABLED"}
            </div>
          </div>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
            {overdue.length>0 && tariff.penaltyEnabled && (
              <button onClick={applyAllPenalties} style={{ background:"rgba(255,255,255,0.2)", color:"#fff", border:"1.5px solid rgba(255,255,255,0.4)", borderRadius:10, padding:"9px 18px", fontWeight:700, fontSize:13, cursor:"pointer" }}>
                Apply to All ({overdue.length})
              </button>
            )}
            <button onClick={()=>setTab("tariff")} style={{ background:"#fff", color:"#dc2626", border:"none", borderRadius:10, padding:"9px 18px", fontWeight:700, fontSize:13, cursor:"pointer" }}>
              Configure →
            </button>
          </div>
        </div>

        {overdue.length===0 ? (
          <div style={{ ...sCard, textAlign:"center", padding:52 }}>
            <Icon name="check" size={44} color="#059669"/>
            <div style={{ fontWeight:700, color:"#059669", fontSize:17, marginTop:14 }}>No overdue bills!</div>
            <div style={{ color:"#94a8b8", fontSize:13, marginTop:6 }}>All customers are up to date with their payments.</div>
          </div>
        ) : (
          <div style={{ ...sCard, overflow:"hidden", padding:0 }}>
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                <thead><tr style={{ background:"#fff5f5" }}>
                  {["Customer","Invoice","Period","Bill Amount","Existing Penalty","Days Late","Suggested Penalty","Action"].map(h=>(
                    <th key={h} style={{ ...thSt, color:"#dc2626" }}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {overdue.map(b=>{
                    const u = users.find(x=>x.id===b.userId);
                    const daysLate = Math.max(0, Math.floor((new Date()-new Date(b.dueDate))/86400000));
                    const suggested = calcPenaltyAmount(b, tariff);
                    const total = b.totalAmount||b.amount||0;
                    return (
                      <tr key={b.id} style={{ borderBottom:"1px solid #fef2f2" }}>
                        <td style={tdSt}><div style={{ fontWeight:700, color:"#0a2540" }}>{u?.name}</div><div style={{ fontSize:11, color:"#94a8b8" }}>{u?.phone}</div></td>
                        <td style={tdSt}><span style={{ fontFamily:"monospace", color:"#dc2626", fontWeight:700 }}>{b.invoiceNo||"—"}</span></td>
                        <td style={tdSt}><b>{MONTHS[b.month-1]} {b.year}</b></td>
                        <td style={tdSt}><b style={{ color:"#0a2540" }}>{fmtKES(total)}</b></td>
                        <td style={tdSt}>{b.penaltyAmount>0?<span style={{ color:"#dc2626", fontWeight:700 }}>{fmtKES(b.penaltyAmount)}</span>:"—"}</td>
                        <td style={tdSt}>
                          <span style={{ background:"#fee2e2", color:"#dc2626", borderRadius:6, padding:"2px 8px", fontWeight:700 }}>{daysLate}d</span>
                        </td>
                        <td style={tdSt}>
                          {suggested>0
                            ? <span style={{ color:"#dc2626", fontWeight:700 }}>{fmtKES(suggested)}</span>
                            : <span style={{ color:"#94a8b8", fontSize:12 }}>Within grace ({tariff.penaltyGrace}d)</span>
                          }
                        </td>
                        <td style={tdSt}>
                          {suggested>0 && tariff.penaltyEnabled && (
                            <button onClick={()=>applyPenalty(b)} style={{ ...sDanger, padding:"6px 12px", fontSize:12 }}>
                              Apply {fmtKES(suggested)}
                            </button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </div>
    );
  };

  // ── RENDER ────────────────────────────────────────────────────────────────
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20, flexWrap:"wrap", gap:12 }}>
        <div>
          <h2 style={{ fontFamily:"'Playfair Display',serif", color:"#0a2540", fontSize:22, fontWeight:800, margin:0 }}>Billing Engine</h2>
          <p style={{ color:"#6b8fa8", fontSize:13, margin:"4px 0 0" }}>Auto-calculate bills · Manage tariffs · Apply penalties · View invoices</p>
        </div>
        <div style={{ display:"flex", gap:10 }}>
          <button onClick={()=>setTab("generate")} style={sPrimary}><Icon name="zap" size={15} color="#fff"/> Generate Bills</button>
        </div>
      </div>

      <TabBar/>
      {tab==="generate"  && <GenerateTab/>}
      {tab==="tariff"    && <TariffTab/>}
      {tab==="invoices"  && <InvoicesTab/>}
      {tab==="penalties" && <PenaltiesTab/>}
    </div>
  );
};


// ════════════════════════════════════════════════════════════════════════════
//  MODULE D — PAYMENT MANAGEMENT  (Admin only)
// ════════════════════════════════════════════════════════════════════════════
const PaymentModule = ({ store, showToast }) => {
  const { users, bills, setBills, payments, setPayments } = store;
  const [tab, setTab] = useState("record");

  // ── shared local styles ──────────────────────────────────────────────────
  const sCard  = { background:"#fff", borderRadius:18, padding:22, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" };
  const sLabel = { display:"block", fontSize:11, fontWeight:700, color:"#5b8fa8", marginBottom:5, textTransform:"uppercase", letterSpacing:"0.08em" };
  const sInput = { width:"100%", padding:"10px 14px", border:"1.5px solid #dde8f0", borderRadius:10, fontSize:14, color:"#0a2540", background:"#f8fbff", outline:"none", boxSizing:"border-box" };
  const sPrimary  = { background:"linear-gradient(135deg,#0077b6,#00b4d8)", color:"#fff", border:"none", borderRadius:10, padding:"10px 20px", fontWeight:700, fontSize:13, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:7 };
  const sSuccess  = { background:"linear-gradient(135deg,#059669,#34d399)", color:"#fff", border:"none", borderRadius:10, padding:"10px 20px", fontWeight:700, fontSize:13, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:7 };
  const sDanger   = { background:"linear-gradient(135deg,#dc2626,#f87171)", color:"#fff", border:"none", borderRadius:10, padding:"8px 14px",  fontWeight:700, fontSize:12, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:6 };
  const sSecond   = { background:"#f0f7ff", color:"#0077b6", border:"1.5px solid #dde8f0", borderRadius:10, padding:"10px 20px", fontWeight:700, fontSize:13, cursor:"pointer" };
  const sIconBtn  = (bg="#f0f7ff") => ({ background:bg, border:"none", borderRadius:8, width:32, height:32, cursor:"pointer", display:"inline-flex", alignItems:"center", justifyContent:"center" });
  const thSt = { padding:"11px 14px", textAlign:"left", color:"#5b8fa8", fontWeight:700, fontSize:11, textTransform:"uppercase", letterSpacing:"0.05em", borderBottom:"1px solid #e8f4fd", whiteSpace:"nowrap" };
  const tdSt = { padding:"11px 14px", color:"#374151", verticalAlign:"middle" };

  const METHODS = ["M-Pesa","Bank Transfer","Cash","Cheque","PesaLink","Card"];
  const METHOD_COLORS = { "M-Pesa":"#059669","Bank Transfer":"#0077b6","Cash":"#f59e0b","Cheque":"#7c3aed","PesaLink":"#0891b2","Card":"#db2777" };

  // ── helpers ──────────────────────────────────────────────────────────────
  const billPaid      = bid  => payments.filter(p=>p.billId===bid).reduce((s,p)=>s+p.amount,0);
  const billTotal     = b    => b.totalAmount || b.amount || 0;
  const billBalance   = b    => Math.max(0, billTotal(b) - billPaid(b.id));
  const customerDebt  = uid  => bills.filter(b=>b.userId===uid&&b.status!=="paid").reduce((s,b)=>s+billBalance(b),0);
  const totalCollected = payments.reduce((s,p)=>s+p.amount,0);
  const totalBilled    = bills.reduce((s,b)=>s+billTotal(b),0);
  const totalOutstanding = totalBilled - totalCollected;

  // ── FInput helper ────────────────────────────────────────────────────────
  const FInput = ({ label, hint, ...p }) => (
    <div style={{ marginBottom:14 }}>
      {label && <label style={sLabel}>{label}</label>}
      {p.as==="select"
        ? <select {...p} as={undefined} style={{ ...sInput, ...p.style }}>{p.children}</select>
        : p.as==="textarea"
        ? <textarea {...p} as={undefined} rows={3} style={{ ...sInput, resize:"vertical", ...p.style }}/>
        : <input {...p} style={{ ...sInput, ...p.style }}/>}
      {hint && <div style={{ fontSize:11, color:"#94a8b8", marginTop:3 }}>{hint}</div>}
    </div>
  );

  // ── Tab bar ───────────────────────────────────────────────────────────────
  const TabBar = () => (
    <div style={{ display:"flex", gap:4, background:"#f0f7ff", borderRadius:12, padding:4, marginBottom:22, flexWrap:"wrap" }}>
      {[
        { id:"record",     emoji:"💳", label:"Record Payment"     },
        { id:"ledger",     emoji:"📒", label:"Payment Ledger"     },
        { id:"statements", emoji:"📋", label:"Customer Statements"},
        { id:"summary",    emoji:"📊", label:"Revenue Summary"    },
      ].map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)}
          style={{ padding:"8px 16px", borderRadius:9, border:"none", cursor:"pointer", fontWeight:700, fontSize:13, transition:"all .2s",
            background:tab===t.id?"#0077b6":"transparent", color:tab===t.id?"#fff":"#5b8fa8" }}>
          {t.emoji} {t.label}
        </button>
      ))}
    </div>
  );

  // ════════════════════════════════════════════════════════════════════════
  //  TAB A — RECORD PAYMENT
  // ════════════════════════════════════════════════════════════════════════
  const RecordTab = () => {
    const [selUser,   setSelUser]   = useState("");
    const [selBill,   setSelBill]   = useState("");
    const [amount,    setAmount]    = useState("");
    const [method,    setMethod]    = useState("M-Pesa");
    const [ref,       setRef]       = useState("");
    const [note,      setNote]      = useState("");
    const [receipt,   setReceipt]   = useState(null);

    const unpaidBills = bills.filter(b=>b.userId===selUser&&b.status!=="paid")
                             .sort((a,b)=>a.year!==b.year?a.year-b.year:a.month-b.month);
    const chosenBill  = bills.find(b=>b.id===selBill);
    const alreadyPaid = chosenBill ? billPaid(chosenBill.id) : 0;
    const remaining   = chosenBill ? billBalance(chosenBill) : 0;
    const amtNum      = Number(amount)||0;
    const isOverpay   = amtNum > remaining && remaining > 0;
    const isValid     = selBill && amtNum > 0 && amtNum <= remaining;

    const handleUserChange = uid => {
      setSelUser(uid); setSelBill(""); setAmount(""); setReceipt(null);
      const first = bills.find(b=>b.userId===uid&&b.status!=="paid");
      if (first) { setSelBill(first.id); setAmount(String(billBalance(first))); }
    };

    const handleBillChange = bid => {
      setSelBill(bid); setReceipt(null);
      const b = bills.find(x=>x.id===bid);
      if (b) setAmount(String(billBalance(b)));
    };

    const submitPayment = () => {
      if (!isValid) return showToast("Check amount — must be > 0 and ≤ remaining balance","error");
      const autoRef = ref.trim() || `${method.replace(/\s/g,"").toUpperCase().slice(0,3)}${Date.now().toString().slice(-7)}`;
      const np = { id:uid(), userId:selUser, billId:selBill, amount:amtNum, date:today(), method, ref:autoRef, note };
      const newPayments = [...payments, np];
      setPayments(newPayments);
      // Auto-update bill status
      const paidSoFar = newPayments.filter(p=>p.billId===selBill).reduce((s,p)=>s+p.amount,0);
      const bTotal    = billTotal(chosenBill);
      if (paidSoFar >= bTotal) {
        setBills(bills.map(b=>b.id===selBill ? {...b, status:"paid"} : b));
      }
      setReceipt({ ...np, bill:chosenBill, user:users.find(u=>u.id===selUser) });
      showToast(`Payment of ${fmtKES(amtNum)} recorded!`);
      setAmount(""); setRef(""); setNote("");
    };

    return (
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))", gap:18 }}>

        {/* ── Payment Form Card ── */}
        <div style={sCard}>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:20 }}>
            <div style={{ background:"linear-gradient(135deg,#059669,#34d399)", borderRadius:12, width:44, height:44, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <Icon name="pay" size={22} color="#fff"/>
            </div>
            <div>
              <div style={{ fontWeight:800, color:"#0a2540", fontSize:16 }}>Record Payment</div>
              <div style={{ fontSize:12, color:"#6b8fa8" }}>Post a payment against a customer's bill</div>
            </div>
          </div>

          {/* Step 1 — Customer */}
          <div style={{ background:"#f8fbff", borderRadius:12, padding:14, marginBottom:14 }}>
            <div style={{ fontSize:11, fontWeight:700, color:"#0077b6", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:10 }}>Step 1 — Select Customer</div>
            <FInput label="" as="select" value={selUser} onChange={e=>handleUserChange(e.target.value)} style={{ marginBottom:0 }}>
              <option value="">— Choose customer —</option>
              {users.map(u=>{
                const debt = customerDebt(u.id);
                return <option key={u.id} value={u.id}>{u.name} ({u.meterNo}){debt>0?` — Owes ${fmtKES(debt)}`:""}</option>;
              })}
            </FInput>
          </div>

          {/* Step 2 — Bill */}
          {selUser && (
            <div style={{ background:"#f8fbff", borderRadius:12, padding:14, marginBottom:14 }}>
              <div style={{ fontSize:11, fontWeight:700, color:"#0077b6", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:10 }}>Step 2 — Select Invoice</div>
              {unpaidBills.length===0
                ? <div style={{ color:"#059669", fontWeight:600, fontSize:13 }}>✓ This customer has no outstanding bills.</div>
                : <FInput label="" as="select" value={selBill} onChange={e=>handleBillChange(e.target.value)} style={{ marginBottom:0 }}>
                    <option value="">— Choose invoice —</option>
                    {unpaidBills.map(b=>(
                      <option key={b.id} value={b.id}>
                        {b.invoiceNo||b.id} · {MONTHS[b.month-1]} {b.year} · Due {fmtKES(billBalance(b))} ({b.status})
                      </option>
                    ))}
                  </FInput>
              }
            </div>
          )}

          {/* Step 3 — Bill summary */}
          {chosenBill && (
            <div style={{ background:"linear-gradient(135deg,#0a2540,#0d3a60)", borderRadius:12, padding:14, marginBottom:14, color:"#fff" }}>
              <div style={{ fontSize:11, fontWeight:700, color:"rgba(255,255,255,0.5)", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:10 }}>Invoice Summary</div>
              {[
                ["Invoice No",     chosenBill.invoiceNo||"—"],
                ["Period",         `${MONTHS[chosenBill.month-1]} ${chosenBill.year}`],
                ["Total Bill",     fmtKES(billTotal(chosenBill))],
                ["Already Paid",   fmtKES(alreadyPaid)],
              ].map(([k,v])=>(
                <div key={k} style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:6 }}>
                  <span style={{ opacity:0.6 }}>{k}</span><b>{v}</b>
                </div>
              ))}
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:16, fontWeight:800, paddingTop:10, borderTop:"1px solid rgba(255,255,255,0.15)", marginTop:4 }}>
                <span>Balance Due</span><span style={{ color:"#f87171" }}>{fmtKES(remaining)}</span>
              </div>
              {/* Mini progress */}
              <div style={{ marginTop:12 }}>
                <div style={{ background:"rgba(255,255,255,0.15)", borderRadius:6, height:6 }}>
                  <div style={{ background:"#34d399", borderRadius:6, height:6, width:`${Math.min(100,Math.round(alreadyPaid/billTotal(chosenBill)*100))}%` }}/>
                </div>
                <div style={{ fontSize:11, color:"rgba(255,255,255,0.4)", marginTop:4 }}>{Math.min(100,Math.round(alreadyPaid/billTotal(chosenBill)*100))}% paid</div>
              </div>
            </div>
          )}

          {/* Step 4 — Payment details */}
          {selBill && remaining > 0 && (
            <>
              <div style={{ fontSize:11, fontWeight:700, color:"#0077b6", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:12 }}>Step 3 — Payment Details</div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                <div style={{ gridColumn:"1/-1" }}>
                  <FInput label="Amount (KES)" type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder={`Max ${remaining}`}/>
                  {isOverpay && <div style={{ background:"#fee2e2", borderRadius:8, padding:"8px 12px", fontSize:12, color:"#dc2626", fontWeight:600, marginTop:-8, marginBottom:10 }}>⚠ Amount exceeds remaining balance of {fmtKES(remaining)}</div>}
                </div>
                <FInput label="Payment Method" as="select" value={method} onChange={e=>setMethod(e.target.value)}>
                  {METHODS.map(m=><option key={m}>{m}</option>)}
                </FInput>
                <FInput label="Transaction Reference" value={ref} onChange={e=>setRef(e.target.value)} placeholder="Auto-generated if blank"/>
              </div>
              <FInput label="Notes (optional)" as="textarea" value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. Paid at office, partial payment…"/>
              <button onClick={submitPayment} disabled={!isValid}
                style={{ ...sSuccess, width:"100%", justifyContent:"center", opacity:isValid?1:0.5 }}>
                <Icon name="check" size={16} color="#fff"/> Confirm Payment of {amount?fmtKES(amtNum):"—"}
              </button>
            </>
          )}
        </div>

        {/* ── Receipt Card ── */}
        <div>
          {receipt ? (
            <div style={{ ...sCard, border:"2px solid #d1fae5" }}>
              {/* Receipt header */}
              <div style={{ background:"linear-gradient(135deg,#065f46,#059669)", borderRadius:12, padding:18, marginBottom:16, color:"#fff", textAlign:"center" }}>
                <div style={{ fontSize:32, marginBottom:4 }}>✅</div>
                <div style={{ fontWeight:800, fontSize:18, fontFamily:"'Playfair Display',serif" }}>Payment Confirmed</div>
                <div style={{ opacity:0.8, fontSize:13, marginTop:4 }}>H2O Water Limited</div>
              </div>
              {/* Receipt body */}
              <div style={{ fontSize:13 }}>
                {[
                  ["Receipt No",  receipt.ref],
                  ["Date",        receipt.date],
                  ["Customer",    receipt.user?.name],
                  ["Meter No",    receipt.user?.meterNo],
                  ["Invoice",     receipt.bill?.invoiceNo||"—"],
                  ["Period",      `${MONTHS[receipt.bill?.month-1]} ${receipt.bill?.year}`],
                  ["Method",      receipt.method],
                  ["Amount Paid", fmtKES(receipt.amount)],
                ].map(([k,v])=>(
                  <div key={k} style={{ display:"flex", justifyContent:"space-between", padding:"8px 0", borderBottom:"1px solid #f0f7ff" }}>
                    <span style={{ color:"#5b8fa8" }}>{k}</span>
                    <b style={{ color: k==="Amount Paid"?"#059669":"#0a2540", fontFamily: k==="Receipt No"||k==="Meter No"?"monospace":"inherit" }}>{v}</b>
                  </div>
                ))}
              </div>
              {/* Balance after */}
              {(() => {
                const newPaid = payments.filter(p=>p.billId===receipt.billId).reduce((s,p)=>s+p.amount,0);
                const newBal  = Math.max(0, billTotal(receipt.bill) - newPaid);
                return (
                  <div style={{ background: newBal===0?"#d1fae5":"#fef3c7", borderRadius:10, padding:12, marginTop:12, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                    <span style={{ fontWeight:700, color: newBal===0?"#065f46":"#92400e" }}>
                      {newBal===0?"✓ Bill Fully Settled!":"Remaining Balance"}
                    </span>
                    <b style={{ color: newBal===0?"#059669":"#f59e0b", fontSize:16 }}>{newBal===0?"KES 0":fmtKES(newBal)}</b>
                  </div>
                );
              })()}
              <div style={{ display:"flex", gap:10, marginTop:14 }}>
                <button style={{ ...sPrimary, flex:1, justifyContent:"center", fontSize:12 }}><Icon name="download" size={14} color="#fff"/> Print Receipt</button>
                <button onClick={()=>setReceipt(null)} style={{ ...sSecond, fontSize:12 }}>New</button>
              </div>
            </div>
          ) : (
            <div style={{ ...sCard, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", minHeight:300, textAlign:"center", border:"2px dashed #dde8f0" }}>
              <div style={{ fontSize:48, marginBottom:12 }}>🧾</div>
              <div style={{ fontWeight:700, color:"#0a2540", fontSize:16, marginBottom:6 }}>Receipt will appear here</div>
              <div style={{ color:"#94a8b8", fontSize:13 }}>Complete the form on the left to record a payment and generate a receipt.</div>
            </div>
          )}

          {/* ── Outstanding balances quick list ── */}
          <div style={{ ...sCard, marginTop:16 }}>
            <div style={{ fontWeight:800, color:"#0a2540", fontSize:15, marginBottom:14 }}>Outstanding Balances</div>
            {users.map(u=>{
              const debt = customerDebt(u.id);
              if (!debt) return null;
              return (
                <div key={u.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"9px 0", borderBottom:"1px solid #f0f7ff" }}>
                  <div>
                    <div style={{ fontWeight:700, color:"#0a2540", fontSize:13 }}>{u.name}</div>
                    <div style={{ fontSize:11, color:"#94a8b8" }}>{u.meterNo} · {u.area}</div>
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontWeight:800, color:"#dc2626", fontSize:14 }}>{fmtKES(debt)}</div>
                    <button onClick={()=>{ handleUserChange(u.id); setTab("record"); }}
                      style={{ fontSize:11, color:"#0077b6", background:"none", border:"none", cursor:"pointer", fontWeight:600 }}>Receive →</button>
                  </div>
                </div>
              );
            })}
            {users.every(u=>!customerDebt(u.id)) && (
              <div style={{ textAlign:"center", padding:20, color:"#059669", fontWeight:700 }}>✓ All accounts are settled!</div>
            )}
          </div>
        </div>
      </div>
    );
  };

  // ════════════════════════════════════════════════════════════════════════
  //  TAB B — PAYMENT LEDGER
  // ════════════════════════════════════════════════════════════════════════
  const LedgerTab = () => {
    const [srch,      setSrch]      = useState("");
    const [filterMth, setFilterMth] = useState("all");
    const [sortDir,   setSortDir]   = useState("desc");
    const [delTarget, setDelTarget] = useState(null);

    const shown = [...payments]
      .filter(p=>{
        const u = users.find(x=>x.id===p.userId);
        const b = bills.find(x=>x.id===p.billId);
        const q = srch.toLowerCase();
        const matchQ = !q || u?.name.toLowerCase().includes(q) || u?.meterNo.toLowerCase().includes(q) || p.ref.toLowerCase().includes(q) || b?.invoiceNo?.toLowerCase().includes(q);
        const matchM = filterMth==="all" || p.method===filterMth;
        return matchQ && matchM;
      })
      .sort((a,b)=> sortDir==="desc" ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));

    const handleDelete = (pid) => {
      const p   = payments.find(x=>x.id===pid);
      const remaining = payments.filter(x=>x.id!==pid);
      // Recalculate bill status
      const paidAfter = remaining.filter(x=>x.billId===p.billId).reduce((s,x)=>s+x.amount,0);
      const b         = bills.find(x=>x.id===p.billId);
      if (b && paidAfter < billTotal(b)) {
        setBills(bills.map(x=>x.id===p.billId ? {...x, status: paidAfter===0?"unpaid":"unpaid"} : x));
      }
      setPayments(remaining);
      showToast("Payment entry removed.");
      setDelTarget(null);
    };

    return (
      <>
        {/* Filter bar */}
        <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap", alignItems:"center" }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, background:"#fff", border:"1.5px solid #dde8f0", borderRadius:10, padding:"8px 14px", flex:1, minWidth:200 }}>
            <Icon name="search" size={15} color="#94a8b8"/>
            <input value={srch} onChange={e=>setSrch(e.target.value)} placeholder="Search customer, ref, invoice…"
              style={{ border:"none", outline:"none", fontSize:13, color:"#0a2540", background:"transparent", width:"100%" }}/>
          </div>
          <select value={filterMth} onChange={e=>setFilterMth(e.target.value)}
            style={{ padding:"9px 14px", border:"1.5px solid #dde8f0", borderRadius:10, fontSize:13, background:"#fff", color:"#0a2540", cursor:"pointer" }}>
            <option value="all">All Methods</option>
            {METHODS.map(m=><option key={m} value={m}>{m}</option>)}
          </select>
          <button onClick={()=>setSortDir(d=>d==="desc"?"asc":"desc")}
            style={{ ...sSecond, padding:"9px 14px", fontSize:12, display:"flex", alignItems:"center", gap:6 }}>
            <Icon name="trend" size={14} color="#0077b6"/> {sortDir==="desc"?"Newest First":"Oldest First"}
          </button>
        </div>

        {/* Stats strip */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))", gap:12, marginBottom:16 }}>
          {[
            { label:"Total Payments",  value:payments.length,       color:"#0077b6" },
            { label:"Total Collected", value:fmtKES(totalCollected), color:"#059669" },
            { label:"Outstanding",     value:fmtKES(Math.max(0,totalOutstanding)), color:"#dc2626" },
            { label:"M-Pesa",          value:payments.filter(p=>p.method==="M-Pesa").length+" txns", color:"#059669" },
          ].map(s=>(
            <div key={s.label} style={{ background:"#fff", borderRadius:14, padding:"14px 16px", boxShadow:"0 2px 12px rgba(10,37,64,0.06)", border:"1px solid #e8f4fd" }}>
              <div style={{ fontSize:11, color:"#94a8b8", fontWeight:700, marginBottom:4 }}>{s.label}</div>
              <div style={{ fontWeight:800, color:s.color, fontSize:18 }}>{s.value}</div>
            </div>
          ))}
        </div>

        {/* Table */}
        <div style={{ ...sCard, overflow:"hidden", padding:0 }}>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
              <thead>
                <tr style={{ background:"#f8fbff" }}>
                  {["Date","Customer","Invoice","Method","Reference","Amount","Notes","Action"].map(h=>(
                    <th key={h} style={thSt}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {shown.length===0 && <tr><td colSpan={8} style={{ textAlign:"center", padding:40, color:"#94a8b8" }}>No payments found.</td></tr>}
                {shown.map((p,i)=>{
                  const u = users.find(x=>x.id===p.userId);
                  const b = bills.find(x=>x.id===p.billId);
                  const mc = METHOD_COLORS[p.method]||"#6b7280";
                  return (
                    <tr key={p.id} style={{ borderBottom:"1px solid #f0f7ff", background:i%2===0?"#fff":"#fafcff" }}>
                      <td style={tdSt}><b style={{ color:"#0a2540" }}>{p.date}</b></td>
                      <td style={tdSt}>
                        <div style={{ fontWeight:700 }}>{u?.name}</div>
                        <div style={{ fontSize:11, color:"#94a8b8", fontFamily:"monospace" }}>{u?.meterNo}</div>
                      </td>
                      <td style={tdSt}>
                        <span style={{ fontFamily:"monospace", color:"#0077b6", fontWeight:600, fontSize:12 }}>{b?.invoiceNo||"—"}</span>
                        {b&&<div style={{ fontSize:11, color:"#94a8b8" }}>{MONTHS[b.month-1]} {b.year}</div>}
                      </td>
                      <td style={tdSt}>
                        <span style={{ background:`${mc}18`, color:mc, borderRadius:8, padding:"3px 10px", fontWeight:700, fontSize:12 }}>{p.method}</span>
                      </td>
                      <td style={tdSt}><span style={{ fontFamily:"monospace", color:"#059669", fontWeight:600, fontSize:12 }}>{p.ref}</span></td>
                      <td style={tdSt}><b style={{ color:"#059669", fontSize:15 }}>{fmtKES(p.amount)}</b></td>
                      <td style={tdSt}><span style={{ color:"#94a8b8", fontSize:12 }}>{p.note||"—"}</span></td>
                      <td style={tdSt}>
                        <button onClick={()=>setDelTarget(p)} style={sIconBtn("#fee2e2")} title="Remove">
                          <Icon name="trash" size={13} color="#dc2626"/>
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>

        {/* Delete confirm modal */}
        {delTarget && (
          <Modal title="Remove Payment Entry" onClose={()=>setDelTarget(null)}>
            <div style={{ background:"#fff5f5", borderRadius:12, padding:16, marginBottom:16, fontSize:13 }}>
              <div style={{ fontWeight:700, color:"#991b1b", marginBottom:8 }}>⚠ This will remove the payment record and may revert the bill status.</div>
              {[
                ["Ref",     delTarget.ref],
                ["Amount",  fmtKES(delTarget.amount)],
                ["Method",  delTarget.method],
                ["Date",    delTarget.date],
              ].map(([k,v])=>(
                <div key={k} style={{ display:"flex", justifyContent:"space-between", padding:"5px 0", borderBottom:"1px solid #fee2e2" }}>
                  <span style={{ color:"#5b8fa8" }}>{k}</span><b>{v}</b>
                </div>
              ))}
            </div>
            <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
              <button onClick={()=>setDelTarget(null)} style={sSecond}>Cancel</button>
              <button onClick={()=>handleDelete(delTarget.id)} style={sDanger}><Icon name="trash" size={14} color="#fff"/> Confirm Remove</button>
            </div>
          </Modal>
        )}
      </>
    );
  };

  // ════════════════════════════════════════════════════════════════════════
  //  TAB C — CUSTOMER STATEMENTS
  // ════════════════════════════════════════════════════════════════════════
  const StatementsTab = () => {
    const [selUser, setSelUser] = useState(users[0]?.id||"");
    const u = users.find(x=>x.id===selUser);

    const userBills    = bills.filter(b=>b.userId===selUser).sort((a,b)=>a.year!==b.year?a.year-b.year:a.month-b.month);
    const userPayments = payments.filter(p=>p.userId===selUser).sort((a,b)=>a.date.localeCompare(b.date));

    // Build chronological ledger rows
    const rows = [];
    userBills.forEach(b=>{
      rows.push({ type:"bill", date:b.dueDate, desc:`Invoice ${b.invoiceNo||b.id} — ${MONTHS[b.month-1]} ${b.year}`, debit:billTotal(b), credit:0, ref:b.invoiceNo||"", status:b.status });
      userPayments.filter(p=>p.billId===b.id).forEach(p=>{
        rows.push({ type:"payment", date:p.date, desc:`Payment · ${p.method} · ${p.ref}`, debit:0, credit:p.amount, ref:p.ref, status:"paid" });
      });
    });
    rows.sort((a,b)=>a.date.localeCompare(b.date));

    // Running balance
    let running = 0;
    const ledger = rows.map(r=>{ running += r.debit - r.credit; return { ...r, balance:running }; });

    const totalDebit  = ledger.filter(r=>r.type==="bill").reduce((s,r)=>s+r.debit,0);
    const totalCredit = ledger.filter(r=>r.type==="payment").reduce((s,r)=>s+r.credit,0);
    const finalBal    = totalDebit - totalCredit;

    return (
      <div>
        {/* Customer picker */}
        <div style={{ display:"flex", gap:10, marginBottom:20, flexWrap:"wrap", alignItems:"center" }}>
          <div style={{ flex:1, maxWidth:360 }}>
            <FInput label="Select Customer" as="select" value={selUser} onChange={e=>setSelUser(e.target.value)}>
              {users.map(u=><option key={u.id} value={u.id}>{u.name} — {u.meterNo}</option>)}
            </FInput>
          </div>
          <button style={{ ...sPrimary, alignSelf:"flex-end", marginBottom:14 }}><Icon name="download" size={14} color="#fff"/> Export Statement</button>
        </div>

        {u && (
          <>
            {/* Statement header card */}
            <div style={{ ...sCard, background:"linear-gradient(135deg,#0a2540,#0d3a60)", color:"#fff", marginBottom:18 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:16 }}>
                <div>
                  <div style={{ fontSize:11, opacity:0.5, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:6 }}>Account Statement</div>
                  <div style={{ fontWeight:800, fontSize:22, fontFamily:"'Playfair Display',serif" }}>{u.name}</div>
                  <div style={{ opacity:0.7, fontSize:13, marginTop:4 }}>{u.address}</div>
                  <div style={{ opacity:0.7, fontSize:13 }}>{u.phone} · {u.email}</div>
                </div>
                <div style={{ textAlign:"right" }}>
                  <div style={{ fontFamily:"monospace", fontWeight:800, fontSize:18, color:"#00b4d8" }}>{u.meterNo}</div>
                  <div style={{ opacity:0.6, fontSize:12, marginTop:4 }}>{u.area}</div>
                  <div style={{ opacity:0.6, fontSize:12 }}>Statement Date: {today()}</div>
                </div>
              </div>
              {/* Summary strip */}
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginTop:18, paddingTop:16, borderTop:"1px solid rgba(255,255,255,0.12)" }}>
                {[
                  { label:"Total Billed",   value:fmtKES(totalDebit),  color:"#f87171" },
                  { label:"Total Paid",     value:fmtKES(totalCredit), color:"#34d399" },
                  { label:"Balance Due",    value:fmtKES(Math.max(0,finalBal)), color:finalBal>0?"#fb923c":"#34d399" },
                ].map(s=>(
                  <div key={s.label} style={{ textAlign:"center" }}>
                    <div style={{ fontSize:11, opacity:0.5, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:4 }}>{s.label}</div>
                    <div style={{ fontWeight:800, fontSize:18, color:s.color }}>{s.value}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Ledger table */}
            <div style={{ ...sCard, overflow:"hidden", padding:0 }}>
              <div style={{ overflowX:"auto" }}>
                <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                  <thead>
                    <tr style={{ background:"#f8fbff" }}>
                      {["Date","Description","Reference","Debit (Charged)","Credit (Paid)","Running Balance","Status"].map(h=>(
                        <th key={h} style={thSt}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {ledger.length===0 && <tr><td colSpan={7} style={{ textAlign:"center", padding:40, color:"#94a8b8" }}>No transactions yet.</td></tr>}
                    {ledger.map((r,i)=>(
                      <tr key={i} style={{ borderBottom:"1px solid #f0f7ff", background:r.type==="bill"?"#fff":"#f0fdf4" }}>
                        <td style={tdSt}>{r.date}</td>
                        <td style={tdSt}>
                          <div style={{ fontWeight: r.type==="bill"?700:400, color: r.type==="bill"?"#0a2540":"#059669" }}>{r.desc}</div>
                        </td>
                        <td style={tdSt}><span style={{ fontFamily:"monospace", fontSize:12, color:"#6b7280" }}>{r.ref||"—"}</span></td>
                        <td style={tdSt}>
                          {r.debit>0 ? <b style={{ color:"#dc2626" }}>{fmtKES(r.debit)}</b> : <span style={{ color:"#d1fae5" }}>—</span>}
                        </td>
                        <td style={tdSt}>
                          {r.credit>0 ? <b style={{ color:"#059669" }}>{fmtKES(r.credit)}</b> : <span style={{ color:"#f3f4f6" }}>—</span>}
                        </td>
                        <td style={tdSt}>
                          <b style={{ color:r.balance>0?"#dc2626":"#059669" }}>{r.balance>0?fmtKES(r.balance):"KES 0 ✓"}</b>
                        </td>
                        <td style={tdSt}>{r.type==="payment"?<Badge status="paid"/>:<Badge status={r.status}/>}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr style={{ background:"#f8fbff", borderTop:"2px solid #e8f4fd" }}>
                      <td colSpan={3} style={{ padding:"12px 14px", fontWeight:800, color:"#0a2540", fontSize:14 }}>TOTALS</td>
                      <td style={{ padding:"12px 14px", fontWeight:800, color:"#dc2626", fontSize:15 }}>{fmtKES(totalDebit)}</td>
                      <td style={{ padding:"12px 14px", fontWeight:800, color:"#059669", fontSize:15 }}>{fmtKES(totalCredit)}</td>
                      <td style={{ padding:"12px 14px", fontWeight:800, color:finalBal>0?"#dc2626":"#059669", fontSize:15 }}>{finalBal>0?fmtKES(finalBal):"✓ Clear"}</td>
                      <td/>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          </>
        )}
      </div>
    );
  };

  // ════════════════════════════════════════════════════════════════════════
  //  TAB D — REVENUE SUMMARY
  // ════════════════════════════════════════════════════════════════════════
  const SummaryTab = () => {
    // Monthly collections
    const monthlyData = MONTHS.map((m,i)=>({
      lbl: m,
      collected: payments.filter(p=>{ const d=new Date(p.date); return d.getMonth()===i&&d.getFullYear()===2025; }).reduce((s,p)=>s+p.amount,0),
      billed:    bills.filter(b=>b.month===i+1&&b.year===2025).reduce((s,b)=>s+billTotal(b),0),
    }));
    const maxVal = Math.max(...monthlyData.map(d=>Math.max(d.collected,d.billed)),1);

    // By method
    const byMethod = METHODS.map(m=>({
      method:m,
      count:  payments.filter(p=>p.method===m).length,
      total:  payments.filter(p=>p.method===m).reduce((s,p)=>s+p.amount,0),
    })).filter(m=>m.count>0).sort((a,b)=>b.total-a.total);

    // Top customers by payment
    const topCustomers = users.map(u=>({
      user:u,
      paid: payments.filter(p=>p.userId===u.id).reduce((s,p)=>s+p.amount,0),
      debt: customerDebt(u.id),
    })).sort((a,b)=>b.paid-a.paid).slice(0,5);

    return (
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))", gap:18 }}>

        {/* ── Monthly bar chart ── */}
        <div style={{ ...sCard, gridColumn:"1/-1" }}>
          <div style={{ fontWeight:800, color:"#0a2540", fontSize:16, marginBottom:4 }}>Monthly Revenue — 2025</div>
          <div style={{ fontSize:13, color:"#6b8fa8", marginBottom:20 }}>Bills issued vs payments collected per month</div>
          <div style={{ display:"flex", alignItems:"flex-end", gap:6, height:120, paddingBottom:24, position:"relative" }}>
            {monthlyData.map((d,i)=>(
              <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:2, position:"relative" }}>
                {/* Billed bar (lighter, behind) */}
                <div style={{ position:"absolute", bottom:20, width:"100%", display:"flex", gap:2, alignItems:"flex-end", justifyContent:"center", height:96 }}>
                  <div style={{ width:"40%", background:"#dbeafe", borderRadius:"4px 4px 0 0", height:`${(d.billed/maxVal)*90}px`, minHeight:d.billed?4:0, opacity:0.8 }} title={`Billed: ${fmtKES(d.billed)}`}/>
                  <div style={{ width:"40%", background:"#0077b6", borderRadius:"4px 4px 0 0", height:`${(d.collected/maxVal)*90}px`, minHeight:d.collected?4:0 }} title={`Collected: ${fmtKES(d.collected)}`}/>
                </div>
                <span style={{ position:"absolute", bottom:0, fontSize:9, color:"#94a8b8", fontWeight:700, whiteSpace:"nowrap" }}>{d.lbl}</span>
              </div>
            ))}
          </div>
          <div style={{ display:"flex", gap:20, justifyContent:"center", marginTop:8 }}>
            <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:"#5b8fa8" }}><div style={{ width:12, height:12, background:"#dbeafe", borderRadius:3 }}/> Billed</div>
            <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:"#5b8fa8" }}><div style={{ width:12, height:12, background:"#0077b6", borderRadius:3 }}/> Collected</div>
          </div>
        </div>

        {/* ── By payment method ── */}
        <div style={sCard}>
          <div style={{ fontWeight:800, color:"#0a2540", fontSize:15, marginBottom:16 }}>Collections by Method</div>
          {byMethod.length===0 && <div style={{ color:"#94a8b8", textAlign:"center", padding:20 }}>No payments recorded yet.</div>}
          {byMethod.map(m=>{
            const pct = Math.round((m.total/totalCollected)*100)||0;
            const mc  = METHOD_COLORS[m.method]||"#6b7280";
            return (
              <div key={m.method} style={{ marginBottom:14 }}>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:5 }}>
                  <span style={{ fontWeight:700, color:"#0a2540" }}>{m.method}</span>
                  <span style={{ color:mc, fontWeight:800 }}>{fmtKES(m.total)}</span>
                </div>
                <div style={{ background:"#e8f4fd", borderRadius:8, height:8 }}>
                  <div style={{ background:mc, borderRadius:8, height:8, width:`${pct}%`, transition:"width .5s" }}/>
                </div>
                <div style={{ fontSize:11, color:"#94a8b8", marginTop:3 }}>{m.count} transaction{m.count!==1?"s":""} · {pct}% of total</div>
              </div>
            );
          })}
        </div>

        {/* ── Top customers ── */}
        <div style={sCard}>
          <div style={{ fontWeight:800, color:"#0a2540", fontSize:15, marginBottom:16 }}>Top Payers</div>
          {topCustomers.map((tc,i)=>(
            <div key={tc.user.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderBottom:"1px solid #f0f7ff" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <div style={{ width:28, height:28, background:`linear-gradient(135deg,#0077b6,#00b4d8)`, borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:12 }}>
                  {i+1}
                </div>
                <div>
                  <div style={{ fontWeight:700, color:"#0a2540", fontSize:13 }}>{tc.user.name}</div>
                  <div style={{ fontSize:11, color:"#94a8b8" }}>{tc.user.meterNo}</div>
                </div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div style={{ fontWeight:800, color:"#059669", fontSize:14 }}>{fmtKES(tc.paid)}</div>
                {tc.debt>0&&<div style={{ fontSize:11, color:"#dc2626", fontWeight:600 }}>{fmtKES(tc.debt)} owed</div>}
              </div>
            </div>
          ))}
        </div>

        {/* ── Collection rate ── */}
        <div style={sCard}>
          <div style={{ fontWeight:800, color:"#0a2540", fontSize:15, marginBottom:16 }}>Collection Rate</div>
          {(() => {
            const rate = totalBilled>0 ? Math.round((totalCollected/totalBilled)*100) : 0;
            const color = rate>=90?"#059669":rate>=70?"#f59e0b":"#dc2626";
            return (
              <>
                <div style={{ textAlign:"center", marginBottom:16 }}>
                  <div style={{ fontSize:56, fontWeight:800, color, lineHeight:1 }}>{rate}%</div>
                  <div style={{ fontSize:13, color:"#6b8fa8", marginTop:4 }}>of billed amount collected</div>
                </div>
                <div style={{ background:"#e8f4fd", borderRadius:10, height:14, marginBottom:12 }}>
                  <div style={{ background: rate>=90?"#059669":rate>=70?"#f59e0b":"#dc2626", borderRadius:10, height:14, width:`${rate}%`, transition:"width .8s" }}/>
                </div>
                {[
                  { label:"Total Billed",    value:fmtKES(totalBilled),    color:"#0a2540" },
                  { label:"Total Collected", value:fmtKES(totalCollected), color:"#059669" },
                  { label:"Uncollected",     value:fmtKES(Math.max(0,totalOutstanding)), color:"#dc2626" },
                ].map(s=>(
                  <div key={s.label} style={{ display:"flex", justifyContent:"space-between", padding:"7px 0", borderBottom:"1px solid #f0f7ff", fontSize:13 }}>
                    <span style={{ color:"#6b8fa8" }}>{s.label}</span>
                    <b style={{ color:s.color }}>{s.value}</b>
                  </div>
                ))}
              </>
            );
          })()}
        </div>
      </div>
    );
  };

  // ── RENDER ────────────────────────────────────────────────────────────────
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20, flexWrap:"wrap", gap:12 }}>
        <div>
          <h2 style={{ fontFamily:"'Playfair Display',serif", color:"#0a2540", fontSize:22, fontWeight:800, margin:0 }}>Payment Management</h2>
          <p style={{ color:"#6b8fa8", fontSize:13, margin:"4px 0 0" }}>Record payments · Ledger · Customer statements · Revenue analytics</p>
        </div>
        <button onClick={()=>setTab("record")} style={sSuccess}><Icon name="pay" size={15} color="#fff"/> Record Payment</button>
      </div>
      <TabBar/>
      {tab==="record"     && <RecordTab/>}
      {tab==="ledger"     && <LedgerTab/>}
      {tab==="statements" && <StatementsTab/>}
      {tab==="summary"    && <SummaryTab/>}
    </div>
  );
};

// ════════════════════════════════════════════════════════════════════════════
//  MODULE E — REPORTS & ANALYTICS  (Admin only)
// ════════════════════════════════════════════════════════════════════════════
const ReportsModule = ({ store }) => {
  const { users, bills, payments, meters } = store;
  const [tab, setTab] = useState("overview");

  // ── local styles ──────────────────────────────────────────────────────────
  const sCard  = { background:"#fff", borderRadius:18, padding:22, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" };
  const thSt   = { padding:"11px 14px", textAlign:"left", color:"#5b8fa8", fontWeight:700, fontSize:11, textTransform:"uppercase", letterSpacing:"0.05em", borderBottom:"1px solid #e8f4fd", whiteSpace:"nowrap" };
  const tdSt   = { padding:"11px 14px", color:"#374151", verticalAlign:"middle" };

  // ── computed values ───────────────────────────────────────────────────────
  const billAmt    = b => b.totalAmount || b.amount || 0;
  const billPaid   = bid => payments.filter(p => p.billId === bid).reduce((s,p) => s+p.amount, 0);
  const billBal    = b => Math.max(0, billAmt(b) - billPaid(b.id));

  const totalBilled      = bills.reduce((s,b) => s+billAmt(b), 0);
  const totalCollected   = payments.reduce((s,p) => s+p.amount, 0);
  const totalOutstanding = Math.max(0, totalBilled - totalCollected);
  const collectionRate   = totalBilled > 0 ? Math.round((totalCollected/totalBilled)*100) : 0;
  const totalUnits       = bills.reduce((s,b) => s+b.units, 0);
  const avgUnitsPerCust  = users.length ? Math.round(totalUnits/users.length) : 0;
  const overdueCount     = bills.filter(b => b.status==="overdue").length;
  const paidCount        = bills.filter(b => b.status==="paid").length;
  const unpaidCount      = bills.filter(b => b.status==="unpaid").length;

  // Monthly data (last 6 months of seed data)
  const monthlyData = [1,2,3,4,5].map(m => {
    const mBills    = bills.filter(b => b.month===m && b.year===2025);
    const mPayments = payments.filter(p => { const b=bills.find(x=>x.id===p.billId); return b&&b.month===m&&b.year===2025; });
    return {
      label  : MONTHS[m-1],
      billed : mBills.reduce((s,b)=>s+billAmt(b),0),
      collected: mPayments.reduce((s,p)=>s+p.amount,0),
      units  : mBills.reduce((s,b)=>s+b.units,0),
      bills  : mBills.length,
    };
  });

  // Per-customer leaderboard
  const custStats = users.map(u => {
    const uBills    = bills.filter(b=>b.userId===u.id);
    const uPayments = payments.filter(p=>p.userId===u.id);
    const billed    = uBills.reduce((s,b)=>s+billAmt(b),0);
    const paid      = uPayments.reduce((s,p)=>s+p.amount,0);
    const units     = uBills.reduce((s,b)=>s+b.units,0);
    const overdue   = uBills.filter(b=>b.status==="overdue").length;
    return { ...u, billed, paid, balance:billed-paid, units, overdue, billCount:uBills.length };
  }).sort((a,b)=>b.billed-a.billed);

  // Area analytics
  const areaStats = [...new Set(users.map(u=>u.area))].map(area => {
    const aUsers    = users.filter(u=>u.area===area);
    const aMeters   = meters.filter(m=>m.area===area);
    const aBills    = bills.filter(b=>aUsers.some(u=>u.id===b.userId));
    const aPayments = payments.filter(p=>aUsers.some(u=>u.id===p.userId));
    const billed    = aBills.reduce((s,b)=>s+billAmt(b),0);
    const collected = aPayments.reduce((s,p)=>s+p.amount,0);
    const units     = aBills.reduce((s,b)=>s+b.units,0);
    const overdue   = aBills.filter(b=>b.status==="overdue").length;
    const rate      = billed>0 ? Math.round((collected/billed)*100) : 0;
    return { area, customers:aUsers.length, meters:aMeters.length, billed, collected, units, overdue, rate };
  }).sort((a,b)=>b.collected-a.collected);

  // Payment method breakdown
  const methodBreakdown = ["M-Pesa","Bank Transfer","Cash","Cheque","PesaLink","Card"].map(m => ({
    method : m,
    count  : payments.filter(p=>p.method===m).length,
    amount : payments.filter(p=>p.method===m).reduce((s,p)=>s+p.amount,0),
  })).filter(m=>m.count>0).sort((a,b)=>b.amount-a.amount);

  const METHOD_COLORS = { "M-Pesa":"#059669","Bank Transfer":"#0077b6","Cash":"#f59e0b","Cheque":"#7c3aed","PesaLink":"#0891b2","Card":"#db2777" };

  // ── Mini bar chart ────────────────────────────────────────────────────────
  const BarChart = ({ data, valueKey, color="#0077b6", height=72 }) => {
    const max = Math.max(...data.map(d=>d[valueKey]),1);
    return (
      <div style={{ display:"flex", alignItems:"flex-end", gap:5, height }}>
        {data.map((d,i)=>(
          <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
            <div style={{ fontSize:9, color:"#94a8b8", fontWeight:700 }}>
              {d[valueKey]>0 ? (valueKey==="units" ? d[valueKey] : `${Math.round(d[valueKey]/1000)}k`) : ""}
            </div>
            <div style={{ width:"100%", background:color, borderRadius:"4px 4px 0 0",
              height:`${Math.max((d[valueKey]/max)*(height-22),4)}px`,
              opacity:0.6+0.4*(d[valueKey]/max), transition:"height .4s" }}/>
            <span style={{ fontSize:10, color:"#94a8b8", fontWeight:600 }}>{d.label}</span>
          </div>
        ))}
      </div>
    );
  };

  // ── Gauge ring ────────────────────────────────────────────────────────────
  const Gauge = ({ pct, color, label, value }) => {
    const r   = 42; const circ = 2*Math.PI*r;
    const off = circ - (pct/100)*circ;
    return (
      <div style={{ display:"flex", flexDirection:"column", alignItems:"center" }}>
        <svg width={110} height={110} style={{ transform:"rotate(-90deg)" }}>
          <circle cx={55} cy={55} r={r} fill="none" stroke="#e8f4fd" strokeWidth={10}/>
          <circle cx={55} cy={55} r={r} fill="none" stroke={color} strokeWidth={10}
            strokeDasharray={circ} strokeDashoffset={off}
            strokeLinecap="round" style={{ transition:"stroke-dashoffset .8s" }}/>
        </svg>
        <div style={{ marginTop:-70, textAlign:"center", pointerEvents:"none" }}>
          <div style={{ fontWeight:800, fontSize:22, color }}>{pct}%</div>
          <div style={{ fontSize:11, color:"#94a8b8", fontWeight:600 }}>{label}</div>
        </div>
        <div style={{ marginTop:6, fontWeight:700, color:"#0a2540", fontSize:15 }}>{value}</div>
      </div>
    );
  };

  // ── Progress bar ──────────────────────────────────────────────────────────
  const ProgBar = ({ pct, color="#0077b6" }) => (
    <div style={{ background:"#e8f4fd", borderRadius:8, height:8, width:"100%", overflow:"hidden" }}>
      <div style={{ background:color, height:8, borderRadius:8, width:`${Math.min(pct,100)}%`, transition:"width .6s" }}/>
    </div>
  );

  // ── Tab bar ───────────────────────────────────────────────────────────────
  const TabBar = () => (
    <div style={{ display:"flex", gap:4, background:"#f0f7ff", borderRadius:12, padding:4, marginBottom:22, flexWrap:"wrap" }}>
      {[
        { id:"overview",   emoji:"📊", label:"Overview"         },
        { id:"monthly",    emoji:"📅", label:"Monthly Report"   },
        { id:"customers",  emoji:"👥", label:"Customer Report"  },
        { id:"areas",      emoji:"🗺️",  label:"Area Report"     },
        { id:"collection", emoji:"💰", label:"Collection Report"},
      ].map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)}
          style={{ padding:"8px 16px", borderRadius:9, border:"none", cursor:"pointer", fontWeight:700, fontSize:13, transition:"all .2s",
            background:tab===t.id?"#0077b6":"transparent", color:tab===t.id?"#fff":"#5b8fa8" }}>
          {t.emoji} {t.label}
        </button>
      ))}
    </div>
  );

  // ════════════════════════════════════════════════════════════════════════
  //  TAB 1 — OVERVIEW
  // ════════════════════════════════════════════════════════════════════════
  const OverviewTab = () => (
    <div>
      {/* KPI row */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))", gap:14, marginBottom:22 }}>
        {[
          { label:"Total Revenue",    value:fmtKES(totalCollected),  color:"#059669", bg:"#d1fae5", sub:"collected" },
          { label:"Total Billed",     value:fmtKES(totalBilled),     color:"#0077b6", bg:"#dbeafe", sub:"invoiced"  },
          { label:"Outstanding",      value:fmtKES(totalOutstanding),color:"#dc2626", bg:"#fee2e2", sub:"uncollected"},
          { label:"Total Units",      value:`${totalUnits} m³`,      color:"#7c3aed", bg:"#ede9fe", sub:"consumed"  },
          { label:"Avg per Customer", value:`${avgUnitsPerCust} m³`, color:"#f59e0b", bg:"#fef3c7", sub:"per month" },
          { label:"Active Meters",    value:meters.filter(m=>m.status==="active").length, color:"#0891b2", bg:"#cffafe", sub:"operational" },
        ].map(k=>(
          <div key={k.label} style={{ background:"#fff", borderRadius:16, padding:18, boxShadow:"0 2px 12px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" }}>
            <div style={{ fontSize:11, color:"#94a8b8", fontWeight:700, marginBottom:6 }}>{k.label}</div>
            <div style={{ fontWeight:800, color:k.color, fontSize:20, lineHeight:1 }}>{k.value}</div>
            <div style={{ fontSize:11, color:"#94a8b8", marginTop:4 }}>{k.sub}</div>
          </div>
        ))}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))", gap:16, marginBottom:16 }}>
        {/* Collection rate gauge */}
        <div style={{ ...sCard, display:"flex", flexDirection:"column", alignItems:"center", gap:16 }}>
          <h3 style={{ margin:0, fontSize:15, color:"#0a2540", fontWeight:800, alignSelf:"flex-start" }}>Collection Rate</h3>
          <Gauge pct={collectionRate} color={collectionRate>=90?"#059669":collectionRate>=70?"#f59e0b":"#dc2626"}
            label="collected" value={fmtKES(totalCollected)}/>

    ].map(bk=>({
      ...bk,
      items : aging.filter(a=>a.daysLate>=bk.min&&a.daysLate<=bk.max),
      total : aging.filter(a=>a.daysLate>=bk.min&&a.daysLate<=bk.max).reduce((s,a)=>s+a.balance,0),
    }));

      <div>

        <div style={{ ...sCard, overflow:"hidden", padding:0, marginBottom:20 }}>
          <div style={{ padding:"18px 22px 14px", borderBottom:"1px solid #f0f7ff" }}>

            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
              <thead>
                <tr style={{ background:"#f8fbff" }}>

                    <th key={h} style={thSt}>{h}</th>
