    { id:"a2", name:"Billing Clerk",username:"billing", email:"billing@h2owater.co.ke", role:"billing",    active:true,  lastLogin:"2025-05-14" },
    { id:"a3", name:"Field Officer", username:"field",  email:"field@h2owater.co.ke",   role:"fieldtech",  active:false, lastLogin:"2025-04-30" },
  ],
  // System preferences
  prefs: {
    dueDayOfMonth:    15,
    billGenerationDay: 1,
    currency:         "KES",
    dateFormat:       "YYYY-MM-DD",
    timezone:         "Africa/Nairobi",
    language:         "English",
    autoGenerateBills: true,
    autoSendReminders: true,
    reminderDaysBefore: 3,
    sessionTimeout:   30,
    darkMode:         false,
  },
  // Backup log
  backups: [
    { id:"bk1", date:"2025-05-01", size:"2.3 MB", type:"Auto",   status:"success", records:{ users:4, bills:16, payments:10, meters:7 } },
    { id:"bk2", date:"2025-04-01", size:"1.9 MB", type:"Auto",   status:"success", records:{ users:4, bills:12, payments:8,  meters:6 } },
    { id:"bk3", date:"2025-03-15", size:"1.1 MB", type:"Manual", status:"success", records:{ users:3, bills:8,  payments:6,  meters:5 } },
  ],
};

const SettingsModule = ({ store, showToast, onLogout }) => {
  const { users, bills, payments, meters } = store;

  // ── State ──────────────────────────────────────────────────────────────────
  const [settings, setSettingsRaw] = useState(() => {
    try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || DEFAULT_SETTINGS; } catch { return DEFAULT_SETTINGS; }
  });
  const saveSettings = s => { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); setSettingsRaw(s); };

  const [tab,       setTab]       = useState("company");
  const [modal,     setModal]     = useState(null);
  const [saved,     setSaved]     = useState(false);

  // Working copies (edited locally, saved on click)
  const [co,  setCo]  = useState({ ...settings.company });
  const [pr,  setPr]  = useState({ ...settings.prefs });
  const [admins, setAdmins] = useState([...settings.admins]);

  // Admin form
  const blankAdmin = { id:"", name:"", username:"", email:"", role:"billing", active:true, lastLogin:"" };
  const [adminForm, setAdminForm] = useState(blankAdmin);
  const [editAdminId, setEditAdminId] = useState(null);

  // ── Save helpers ───────────────────────────────────────────────────────────
  const flashSaved = () => { setSaved(true); setTimeout(()=>setSaved(false), 2500); };

  const saveCompany = () => {
    saveSettings({ ...settings, company:co });
    showToast("Company profile saved!"); flashSaved();
  };
  const savePrefs = () => {
    saveSettings({ ...settings, prefs:pr });
    showToast("Preferences saved!"); flashSaved();
  };
  const saveAdmin = () => {
    if (!adminForm.name || !adminForm.username) return showToast("Name and username are required","error");
    if (editAdminId) {
      const updated = admins.map(a => a.id===editAdminId ? { ...a,...adminForm } : a);
      setAdmins(updated);
      saveSettings({ ...settings, admins:updated });
      showToast("Admin user updated!");
    } else {
      const nu = { ...adminForm, id:uid(), lastLogin:"Never" };
      const updated = [...admins, nu];
      setAdmins(updated);
      saveSettings({ ...settings, admins:updated });
      showToast("Admin user added!");
    }
    setModal(null); setAdminForm(blankAdmin); setEditAdminId(null);
  };
  const toggleAdmin = id => {
    const updated = admins.map(a => a.id===id ? { ...a, active:!a.active } : a);
    setAdmins(updated);
    saveSettings({ ...settings, admins:updated });
    showToast("Admin status updated");
  };

  // ── Backup / Restore ───────────────────────────────────────────────────────
  const runBackup = () => {
    const snap = {
      id:   uid(),
      date: today(),
      size: `${(JSON.stringify({ users,bills,payments,meters }).length/1024).toFixed(1)} KB`,
      type: "Manual",
      status: "success",
      records: { users:users.length, bills:bills.length, payments:payments.length, meters:meters.length },
    };
    const updated = { ...settings, backups:[snap,...settings.backups] };
    saveSettings(updated);
    showToast("Backup created successfully!");
  };

  const exportJSON = () => {
    const data = JSON.stringify({ users,bills,payments,meters, exportDate:today() }, null, 2);
    const blob  = new Blob([data], { type:"application/json" });
    const url   = URL.createObjectURL(blob);
    const a     = document.createElement("a");
    a.href = url; a.download = `h2o-backup-${today()}.json`; a.click();
    URL.revokeObjectURL(url);
    showToast("Data exported as JSON!");
  };

  const exportCSV = () => {
    const rows = [
      ["Type","ID","Name/No","Details","Date","Amount/Status"],
      ...users.map(u=>   ["Customer", u.id, u.name,    `${u.meterNo} · ${u.area} · ${u.phone}`, u.joinDate, u.status]),
      ...meters.map(m=>  ["Meter",    m.id, m.meterNo, `${m.brand} ${m.type} · ${m.area}`,       m.installDate, m.status]),
      ...bills.map(b=>   ["Bill",     b.id, b.invoiceNo||b.id, `${MONTHS[b.month-1]} ${b.year} · ${b.units}m³`, b.dueDate, fmtKES(b.amount||b.totalAmount||0)]),
      ...payments.map(p=>["Payment",  p.id, p.ref,     `${p.method}`,                            p.date,    fmtKES(p.amount)]),
    ];
    const csv  = rows.map(r=>r.map(c=>`"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type:"text/csv" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href=url; a.download=`h2o-export-${today()}.csv`; a.click();
    URL.revokeObjectURL(url);
    showToast("Full data exported as CSV!");
  };

  // ── Style shortcuts ────────────────────────────────────────────────────────
  const card  = { background:"#fff", borderRadius:18, padding:22, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" };
  const sPrim = { background:"linear-gradient(135deg,#0077b6,#00b4d8)", color:"#fff", border:"none", borderRadius:10, padding:"10px 20px", fontWeight:700, fontSize:13, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:8 };
  const sGrn  = { background:"linear-gradient(135deg,#059669,#34d399)", color:"#fff", border:"none", borderRadius:10, padding:"10px 20px", fontWeight:700, fontSize:13, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:8 };
  const sDng  = { background:"linear-gradient(135deg,#dc2626,#f87171)", color:"#fff", border:"none", borderRadius:10, padding:"10px 20px", fontWeight:700, fontSize:13, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:8 };
  const sSec  = { background:"#f0f7ff", color:"#0077b6", border:"1.5px solid #dde8f0", borderRadius:10, padding:"10px 18px", fontWeight:700, fontSize:13, cursor:"pointer" };
  const sIco  = (bg="#f0f7ff",col="#0077b6") => ({ background:bg, border:"none", borderRadius:8, width:32, height:32, cursor:"pointer", display:"inline-flex", alignItems:"center", justifyContent:"center", color:col });
  const inp   = { width:"100%", padding:"10px 14px", border:"1.5px solid #dde8f0", borderRadius:10, fontSize:14, color:"#0a2540", background:"#f8fbff", outline:"none", boxSizing:"border-box" };
  const lbl   = { display:"block", fontSize:11, fontWeight:700, color:"#5b8fa8", marginBottom:5, textTransform:"uppercase", letterSpacing:"0.08em" };
  const thS   = { padding:"11px 15px", textAlign:"left", color:"#5b8fa8", fontWeight:700, fontSize:11, textTransform:"uppercase", letterSpacing:"0.05em", borderBottom:"1px solid #e8f4fd", whiteSpace:"nowrap" };
  const tdS   = { padding:"11px 15px", color:"#374151", verticalAlign:"middle" };

  const FI = ({ label, as:as_="input", hint, ...p }) => (
    <div style={{ marginBottom:15 }}>
      {label && <label style={lbl}>{label}</label>}
      {as_==="select"   ? <select   {...p} style={{ ...inp,...(p.style||{}) }}>{p.children}</select>
      :as_==="textarea" ? <textarea {...p} style={{ ...inp, resize:"vertical", minHeight:80,...(p.style||{}) }}/>
      :                   <input    {...p} style={{ ...inp,...(p.style||{}) }}/>}
      {hint && <div style={{ fontSize:11, color:"#94a8b8", marginTop:3 }}>{hint}</div>}
    </div>
  );

  // ── TABS ──────────────────────────────────────────────────────────────────
  const TabBar = () => (
    <div style={{ display:"flex", gap:4, background:"#f0f7ff", borderRadius:12, padding:4, marginBottom:22, flexWrap:"wrap" }}>
      {[
        { id:"company",  label:"🏢 Company Profile"    },
        { id:"admins",   label:"🛡️ Admin Users"        },
        { id:"prefs",    label:"⚙️ Preferences"        },
        { id:"backup",   label:"💾 Backup & Data"      },
        { id:"security", label:"🔒 Security"           },
        { id:"about",    label:"ℹ️ About System"       },
      ].map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)}
          style={{ padding:"8px 15px", borderRadius:9, border:"none", cursor:"pointer", fontWeight:700, fontSize:12, transition:"all .2s",
            background:tab===t.id?"#0077b6":"transparent", color:tab===t.id?"#fff":"#5b8fa8" }}>
          {t.label}
        </button>
      ))}
    </div>
  );

  // ── TAB: COMPANY PROFILE ──────────────────────────────────────────────────
  const CompanyTab = () => (
    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))", gap:18 }}>

      {/* Identity card */}
      <div style={card}>
        <h3 style={{ margin:"0 0 18px", fontSize:15, color:"#0a2540", fontWeight:800 }}>🏢 Company Identity</h3>

        {/* Live preview card */}
        <div style={{ background:"linear-gradient(135deg,#0a2540,#0077b6)", borderRadius:16, padding:22, color:"#fff", marginBottom:20, textAlign:"center" }}>
          <div style={{ fontSize:48, marginBottom:8 }}>{co.logo}</div>
          <div style={{ fontWeight:800, fontSize:22, fontFamily:"'Playfair Display',serif" }}>{co.name||"Company Name"}</div>
          <div style={{ opacity:0.7, fontSize:13, marginTop:4 }}>{co.tagline}</div>
          <div style={{ opacity:0.5, fontSize:12, marginTop:8 }}>{co.address}</div>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 14px" }}>
          <FI label="Company Name *" value={co.name} onChange={e=>setCo(c=>({...c,name:e.target.value}))} placeholder="H2O Water Limited"/>
          <FI label="Logo Emoji"     value={co.logo} onChange={e=>setCo(c=>({...c,logo:e.target.value}))} placeholder="💧" hint="Paste any emoji"/>
        </div>
        <FI label="Tagline"         value={co.tagline}  onChange={e=>setCo(c=>({...c,tagline:e.target.value}))}/>
        <FI label="Physical Address" value={co.address} onChange={e=>setCo(c=>({...c,address:e.target.value}))} as_="textarea"/>
        <button onClick={saveCompany} style={{ ...sPrim, width:"100%", justifyContent:"center" }}>
          <Icon name="check" size={15} color="#fff"/> Save Company Profile
        </button>
      </div>

      {/* Contact & Payments */}
      <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
        <div style={card}>
          <h3 style={{ margin:"0 0 16px", fontSize:15, color:"#0a2540", fontWeight:800 }}>📞 Contact Details</h3>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 14px" }}>
            <FI label="Phone"   value={co.phone}   onChange={e=>setCo(c=>({...c,phone:e.target.value}))}   placeholder="+254 700 000 000"/>
            <FI label="Email"   value={co.email}   onChange={e=>setCo(c=>({...c,email:e.target.value}))}   placeholder="support@company.co.ke"/>
            <FI label="Website" value={co.website} onChange={e=>setCo(c=>({...c,website:e.target.value}))} placeholder="www.company.co.ke"/>
          </div>
        </div>

        <div style={card}>
          <h3 style={{ margin:"0 0 16px", fontSize:15, color:"#0a2540", fontWeight:800 }}>💳 M-Pesa / Payment Config</h3>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 14px" }}>
            <FI label="M-Pesa Paybill No" value={co.paybill}    onChange={e=>setCo(c=>({...c,paybill:e.target.value}))}    placeholder="400200"/>
            <FI label="Account Reference" value={co.accountRef} onChange={e=>setCo(c=>({...c,accountRef:e.target.value}))} placeholder="MeterNo or Name"/>
          </div>
          {/* M-Pesa preview card */}
          <div style={{ background:"#f0f7ff", borderRadius:12, padding:14 }}>
            <div style={{ fontSize:11, color:"#5b8fa8", fontWeight:700, marginBottom:8 }}>CUSTOMER PAYMENT INSTRUCTIONS PREVIEW</div>
            <div style={{ fontSize:13, color:"#0a2540", lineHeight:1.8 }}>
              1. Go to M-Pesa → Lipa na M-Pesa → Pay Bill<br/>
              2. Business No: <b style={{ color:"#0077b6" }}>{co.paybill||"XXXXXX"}</b><br/>
              3. Account No: <b style={{ color:"#0077b6" }}>{co.accountRef==="MeterNo"?"Your Meter Number":"Your Name"}</b><br/>
              4. Amount: Your bill total
            </div>
          </div>
          <button onClick={saveCompany} style={{ ...sPrim, marginTop:14, width:"100%", justifyContent:"center" }}>
            <Icon name="check" size={15} color="#fff"/> Save Payment Config
          </button>
        </div>
      </div>
    </div>
  );

  // ── TAB: ADMIN USERS ──────────────────────────────────────────────────────
  const ROLES = ["superadmin","billing","fieldtech","readonly"];
  const roleConf = {
    superadmin: { label:"Super Admin",   bg:"#fee2e2", color:"#991b1b",  desc:"Full access to all modules" },
    billing:    { label:"Billing Clerk", bg:"#dbeafe", color:"#1e40af",  desc:"Billing and payment access"  },
    fieldtech:  { label:"Field Tech",    bg:"#fef3c7", color:"#92400e",  desc:"Meter reading entry only"    },
    readonly:   { label:"Read Only",     bg:"#f3f4f6", color:"#374151",  desc:"View reports only"           },
  };
  const rc = r => roleConf[r]||roleConf.readonly;

  const AdminsTab = () => (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18, flexWrap:"wrap", gap:10 }}>
        <div>
          <div style={{ fontWeight:800, color:"#0a2540", fontSize:15 }}>Admin Users</div>
          <div style={{ fontSize:13, color:"#6b8fa8" }}>Manage who can access the admin panel</div>
        </div>
        <button onClick={()=>{ setAdminForm(blankAdmin); setEditAdminId(null); setModal("admin"); }} style={sPrim}>
          <Icon name="plus" size={14} color="#fff"/> Add Admin User
        </button>
      </div>

      {/* Role legend */}
      <div style={{ display:"flex", gap:8, marginBottom:18, flexWrap:"wrap" }}>
        {Object.entries(roleConf).map(([k,v])=>(
          <div key={k} style={{ background:v.bg, color:v.color, borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:700 }}>
            {v.label} — <span style={{ fontWeight:400 }}>{v.desc}</span>
          </div>
        ))}
      </div>

      <div style={{ ...card, overflow:"hidden", padding:0 }}>
        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
            <thead>
              <tr style={{ background:"#f8fbff" }}>
                {["Admin","Username","Email","Role","Last Login","Status","Actions"].map(h=>(
                  <th key={h} style={thS}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {admins.map((a,i)=>{
                const r = rc(a.role);
                return (
                  <tr key={a.id} style={{ borderBottom:"1px solid #f0f7ff", background:i%2===0?"#fff":"#fafcff" }}>
                    <td style={tdS}>
                      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                        <div style={{ width:34, height:34, background:`linear-gradient(135deg,${r.color},#0077b6)`, borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:14, flexShrink:0 }}>
                          {a.name.charAt(0)}
                        </div>
                        <div style={{ fontWeight:700, color:"#0a2540" }}>{a.name}</div>

//  LOGIN PAGE
// ════════════════════════════════════════════════════════════════════════════
const LoginPage = ({ onLogin, users }) => {
  const [tab,  setTab]  = useState("user");
  const [form, setForm] = useState({ identifier:"", password:"" });
  const [err,  setErr]  = useState("");
  const [loading, setLoading] = useState(false);

  const handle = () => {
    setErr(""); setLoading(true);
    setTimeout(() => {
      setLoading(false);
      if (tab === "admin") {
        if (form.identifier === "admin" && form.password === "admin123") return onLogin({ role:"admin", name:"Administrator" });
        return setErr("Invalid admin credentials.");
      }
      const u = users.find(u => (u.meterNo === form.identifier || u.email === form.identifier) && u.password === form.password);
      if (u) return onLogin({ role:"user", ...u });
      setErr("Invalid meter number / email or password.");
    }, 600);
  };

  return (
    <div style={{ minHeight:"100vh", background:"linear-gradient(135deg,#001f3d 0%,#0077b6 60%,#00b4d8 100%)", display:"flex", alignItems:"center", justifyContent:"center", padding:16, fontFamily:"'DM Sans',sans-serif" }}>

          {tab==="admin" && <p style={{ fontSize:13, color:"#7a9ab0", margin:"0 0 16px", background:"#fff8e1", padding:"10px 14px", borderRadius:10, borderLeft:"3px solid #f59e0b" }}>

          <Input label={tab==="user"?"Meter Number or Email":"Username"} type="text" placeholder={tab==="user"?"MTR-XXXX or email":"admin"} value={form.identifier} onChange={e=>setForm(f=>({...f,identifier:e.target.value}))} />
          <Input label="Password" type="password" placeholder="••••••••" value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))} />

//  ADMIN DASHBOARD
// ════════════════════════════════════════════════════════════════════════════
const AdminDash = ({ store, onLogout }) => {
  const { users, setUsers, bills, setBills, payments, setPayments, meters, setMeters } = store;
  const [page, setPage] = useState("dashboard");
  const [sideOpen, setSideOpen] = useState(false);
  const [modal, setModal] = useState(null);
  const [search, setSearch] = useState("");
  const [toast, setToast] = useState(null);
  const [notif, setNotif] = useState(false);

  const showToast = (msg, type="success") => { setToast({msg,type}); setTimeout(()=>setToast(null),3000); };

  // ── Computed stats ──
  const totalRevenue = payments.reduce((s,p)=>s+p.amount,0);
  const pendingBills = bills.filter(b=>b.status!=="paid");
  const overdueCount = bills.filter(b=>b.status==="overdue").length;
  const totalUnits = bills.reduce((s,b)=>s+b.units,0);

  const userBills = uid => bills.filter(b=>b.userId===uid);
  const userBalance = uid => {
    const totalBilled = userBills(uid).reduce((s,b)=>s+b.amount,0);
    const totalPaid   = payments.filter(p=>p.userId===uid).reduce((s,p)=>s+p.amount,0);
    return totalBilled - totalPaid;
  };

  // ── Add meter reading ──
  const [readForm, setReadForm] = useState({ userId:"", month: new Date().getMonth()+1, year: new Date().getFullYear(), currReading:"" });
  const submitReading = () => {
    const u = users.find(u=>u.id===readForm.userId);
    if (!u || !readForm.currReading) return;
    const prev = bills.filter(b=>b.userId===readForm.userId).sort((a,b)=>b.year!==a.year?b.year-a.year:b.month-a.month)[0];
    const prevReading = prev ? prev.currReading : 0;
    const curr = Number(readForm.currReading);
    if (curr <= prevReading) return showToast("Current reading must be > previous reading","error");
    const units = curr - prevReading;
    const amount = units * RATE_PER_UNIT;
    const dueDate = new Date(readForm.year, readForm.month, 15).toISOString().split("T")[0];
    const nb = { id:uid(), userId:readForm.userId, month:Number(readForm.month), year:Number(readForm.year), prevReading, currReading:curr, units, amount, dueDate, status:"unpaid" };
    setBills([...bills, nb]);
    showToast(`Bill created: ${fmtKES(amount)} for ${u.name}`);
    setModal(null);
    setReadForm({ userId:"", month: new Date().getMonth()+1, year: new Date().getFullYear(), currReading:"" });
  };

  // ── Record payment ──
  const [payForm, setPayForm] = useState({ billId:"", userId:"", amount:"", method:"M-Pesa", ref:"" });
  const submitPayment = () => {
    if (!payForm.billId || !payForm.amount) return;
    const np = { id:uid(), userId:payForm.userId, billId:payForm.billId, amount:Number(payForm.amount), date:today(), method:payForm.method, ref:payForm.ref||`REF-${uid().toUpperCase()}` };
    setPayments([...payments, np]);
    const bill = bills.find(b=>b.id===payForm.billId);
    if (bill) { const totalPaid = [...payments,np].filter(p=>p.billId===bill.id).reduce((s,p)=>s+p.amount,0); if (totalPaid>=bill.amount) setBills(bills.map(b=>b.id===bill.id?{...b,status:"paid"}:b)); }
    showToast("Payment recorded successfully!");
    setModal(null);
  };

  // ── Add user ──
  const [userForm, setUserForm] = useState({ name:"", meterNo:"", area:"Westlands", address:"", phone:"", email:"", password:"" });
  const submitUser = () => {
    if (!userForm.name||!userForm.meterNo) return;
    setUsers([...users, { id:uid(), ...userForm, joinDate:today(), status:"active" }]);
    showToast("Customer added!");
    setModal(null);
    setUserForm({ name:"", meterNo:"", area:"Westlands", address:"", phone:"", email:"", password:"" });
  };

  // ── Edit user ──
  const [editUser, setEditUser] = useState(null);
  const saveEditUser = () => { setUsers(users.map(u=>u.id===editUser.id?editUser:u)); showToast("Customer updated!"); setModal(null); };

  const navItems = [

    { id:"billing",       icon:"zap",   label:"Billing Engine"     },
    { id:"payments",      icon:"pay",   label:"Payment Management" },

    { id:"settings",      icon:"gear",  label:"System Settings"    },

  const filteredUsers = users.filter(u => u.name.toLowerCase().includes(search.toLowerCase()) || u.meterNo.toLowerCase().includes(search.toLowerCase()) || u.area.toLowerCase().includes(search.toLowerCase()));

  // recent activity
  const recentBills = [...bills].sort((a,b)=>b.id.localeCompare(a.id)).slice(0,5);

  // chart data for dashboard

            {n.id==="bills"   && overdueCount>0 && <span style={{ marginLeft:"auto", background:"#ef4444", color:"#fff", borderRadius:10, padding:"2px 7px", fontSize:11, fontWeight:700 }}>{overdueCount}</span>}

          <Icon name="gear" size={17} color={page==="settings"?"#00b4d8":"rgba(255,255,255,0.45)"}/>System Settings
        </button>

          <Icon name="logout" size={18} color="#fca5a5"/>Logout
        </button>
      </div>
    </div>
  );

  // ── PAGE CONTENT ──
  const renderPage = () => {
    if (page==="meters")        return <MeterModule         store={store} showToast={showToast}/>;
    if (page==="billing")       return <BillingModule        store={store} showToast={showToast}/>;
    if (page==="payments")      return <PaymentModule        store={store} showToast={showToast}/>;
    if (page==="reports")       return <ReportsModule        store={store}/>;
    if (page==="customers")     return <CustomerModule       store={store} showToast={showToast}/>;
    if (page==="notifications") return <NotificationsModule  store={store} showToast={showToast} currentUser={null}/>;
    if (page==="settings")      return <SettingsModule       store={store} showToast={showToast} onLogout={onLogout}/>;
    if (page==="dashboard") return (
      <div>
        <h2 style={h2style}>Overview Dashboard</h2>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))", gap:16, marginBottom:24 }}>
          <StatCard icon="users"  label="Total Customers"  value={users.length}                                         sub="Active accounts"                 color="#0077b6" accent="#dbeafe"/>
          <StatCard icon="meter"  label="Active Meters"    value={store.meters.filter(m=>m.status==="active").length}   sub={`${store.meters.filter(m=>m.status==="faulty").length} faulty`} color="#059669" accent="#d1fae5"/>
          <StatCard icon="pay"    label="Total Revenue"    value={fmtKES(totalRevenue)}                                 sub="All payments"                    color="#059669" accent="#d1fae5"/>
          <StatCard icon="bill"   label="Pending Bills"    value={pendingBills.length}                                  sub={`${overdueCount} overdue`}       color="#f59e0b" accent="#fef3c7"/>
        </div>
        {/* Quick-access module buttons */}
        <div style={{ display:"flex", gap:10, marginBottom:20, flexWrap:"wrap" }}>
          <button onClick={()=>setPage("customers")} style={{ background:"#dbeafe", border:"1.5px solid #93c5fd", borderRadius:12, padding:"10px 18px", fontWeight:700, fontSize:13, color:"#1e40af", cursor:"pointer", display:"flex", alignItems:"center", gap:8 }}>
            <Icon name="users" size={16} color="#1e40af"/> Customer Management
          </button>
          <button onClick={()=>setPage("meters")}   style={{ background:"#f0fdf4", border:"1.5px solid #86efac", borderRadius:12, padding:"10px 18px", fontWeight:700, fontSize:13, color:"#059669", cursor:"pointer", display:"flex", alignItems:"center", gap:8 }}>
            <Icon name="meter" size={16} color="#059669"/> Meter Management
          </button>
          <button onClick={()=>setPage("billing")}  style={{ background:"#fff8e1", border:"1.5px solid #fde68a", borderRadius:12, padding:"10px 18px", fontWeight:700, fontSize:13, color:"#f59e0b", cursor:"pointer", display:"flex", alignItems:"center", gap:8 }}>

                    <div style={{ marginTop:12 }}>

                      <MiniBar data={ub.slice(0,4).reverse().map(b=>({ lbl:MONTHS[b.month-1], val:b.units }))} color="#0077b6"/>
                    </div>
                  </div>
                ) : <div style={{ color:"#94a8b8", fontSize:13, textAlign:"center", padding:20 }}>No readings yet</div>}
              </div>
            );
          })}
        </div>
      </div>
    );

    if (page==="bills") return (
      <div>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20, flexWrap:"wrap", gap:12 }}>
          <h2 style={{...h2style, margin:0}}>All Bills</h2>
          <button onClick={()=>setModal("readingEntry")} style={btnPrimary}><Icon name="plus" size={16} color="#fff"/> Generate Bill</button>
        </div>
        {["overdue","unpaid","paid"].map(status=>{
          const bs = bills.filter(b=>b.status===status).sort((a,b)=>b.year!==a.year?b.year-a.year:b.month-a.month);
          if (!bs.length) return null;
          return (
            <div key={status} style={{ marginBottom:20 }}>
              <h3 style={{ margin:"0 0 12px", fontSize:14, color:"#5b8fa8", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.05em", display:"flex", alignItems:"center", gap:8 }}>
                <Badge status={status}/> ({bs.length})
              </h3>
              <div style={{ background:"#fff", borderRadius:18, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd", overflow:"hidden" }}>
                <div style={{ overflowX:"auto" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                    <thead><tr style={{ background:"#f8fbff" }}>
                      {["Customer","Meter","Period","Prev","Curr","Units","Amount","Due Date","Action"].map(h=>(
                        <th key={h} style={{ padding:"10px 14px", textAlign:"left", color:"#5b8fa8", fontWeight:700, fontSize:11, textTransform:"uppercase", letterSpacing:"0.05em", borderBottom:"1px solid #e8f4fd", whiteSpace:"nowrap" }}>{h}</th>
                      ))}
                    </tr></thead>
                    <tbody>
                      {bs.map(b=>{
                        const u=users.find(x=>x.id===b.userId);
                        return (
                          <tr key={b.id} style={{ borderBottom:"1px solid #f0f7ff" }}>
                            <td style={td}><div style={{ fontWeight:700 }}>{u?.name}</div><div style={{ fontSize:11, color:"#94a8b8" }}>{u?.area}</div></td>
                            <td style={td}><span style={{ fontFamily:"monospace", color:"#0077b6", fontWeight:700, fontSize:12 }}>{u?.meterNo}</span></td>
                            <td style={td}>{MONTHS[b.month-1]} {b.year}</td>
                            <td style={td}>{b.prevReading}</td>
                            <td style={td}>{b.currReading}</td>
                            <td style={td}><b style={{ color:"#0077b6" }}>{b.units}</b></td>
                            <td style={td}><b style={{ color:"#0a2540" }}>{fmtKES(b.amount)}</b></td>
                            <td style={td}><span style={{ color: status==="overdue"?"#dc2626":"#0a2540", fontWeight: status==="overdue"?700:400 }}>{b.dueDate}</span></td>
                            <td style={td}>
                              {status!=="paid" && <button onClick={()=>{ setPayForm({ billId:b.id, userId:b.userId, amount:b.amount, method:"M-Pesa", ref:"" }); setModal("payBill"); }} style={{...btnPrimary, padding:"6px 12px", fontSize:12}}>Pay</button>}
                              {status==="paid" && <span style={{ color:"#059669", fontWeight:700, fontSize:12 }}>✓ Paid</span>}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    );

    if (page==="payments") return (
      <div>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20, flexWrap:"wrap", gap:12 }}>
          <h2 style={{...h2style, margin:0}}>Payment Records</h2>
          <button onClick={()=>setModal("payBill")} style={btnPrimary}><Icon name="plus" size={16} color="#fff"/> Record Payment</button>
        </div>
        <div style={{ background:"#fff", borderRadius:18, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd", overflow:"hidden" }}>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
              <thead><tr style={{ background:"#f8fbff" }}>
                {["Date","Customer","Bill Period","Method","Reference","Amount"].map(h=>(
                  <th key={h} style={{ padding:"12px 16px", textAlign:"left", color:"#5b8fa8", fontWeight:700, fontSize:12, textTransform:"uppercase", letterSpacing:"0.05em", borderBottom:"1px solid #e8f4fd", whiteSpace:"nowrap" }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {[...payments].sort((a,b)=>b.date.localeCompare(a.date)).map((p,i)=>{
                  const u=users.find(x=>x.id===p.userId);
                  const b=bills.find(x=>x.id===p.billId);
                  return (
                    <tr key={p.id} style={{ borderBottom:"1px solid #f0f7ff", background: i%2===0?"#fff":"#fafcff" }}>
                      <td style={td}>{p.date}</td>
                      <td style={td}><div style={{ fontWeight:700, color:"#0a2540" }}>{u?.name}</div><span style={{ fontFamily:"monospace", fontSize:11, color:"#0077b6" }}>{u?.meterNo}</span></td>
                      <td style={td}>{b ? `${MONTHS[b.month-1]} ${b.year}` : "—"}</td>
                      <td style={td}><span style={{ background:"#f0f7ff", color:"#0077b6", borderRadius:6, padding:"2px 8px", fontWeight:600, fontSize:12 }}>{p.method}</span></td>
                      <td style={td}><span style={{ fontFamily:"monospace", color:"#059669", fontWeight:600 }}>{p.ref}</span></td>
                      <td style={td}><b style={{ color:"#059669", fontSize:14 }}>{fmtKES(p.amount)}</b></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );

    if (page==="areas") {
      const areas = [...new Set(users.map(u=>u.area))];
      return (
        <div>
          <h2 style={h2style}>Area Management</h2>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))", gap:16 }}>
            {areas.map(area=>{
              const areaUsers = users.filter(u=>u.area===area);
              const areaBills = bills.filter(b=>areaUsers.some(u=>u.id===b.userId));
              const areaRevenue = payments.filter(p=>areaUsers.some(u=>u.id===p.userId)).reduce((s,p)=>s+p.amount,0);
              const areaOverdue = areaBills.filter(b=>b.status==="overdue").length;
              return (
                <div key={area} style={{ background:"#fff", borderRadius:18, padding:22, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:16 }}>
                    <div style={{ background:"linear-gradient(135deg,#0077b6,#00b4d8)", borderRadius:12, width:42, height:42, display:"flex", alignItems:"center", justifyContent:"center" }}>
                      <Icon name="map" size={20} color="#fff"/>
                    </div>
                    <div>
                      <div style={{ fontWeight:800, color:"#0a2540", fontSize:16 }}>{area}</div>
                      <div style={{ fontSize:12, color:"#94a8b8" }}>{areaUsers.length} customers</div>
                    </div>
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                    <div style={{ background:"#f8fbff", borderRadius:10, padding:12 }}>
                      <div style={{ fontSize:11, color:"#94a8b8", fontWeight:600 }}>REVENUE</div>
                      <div style={{ fontWeight:800, color:"#059669", fontSize:15 }}>{fmtKES(areaRevenue)}</div>
                    </div>
                    <div style={{ background:"#fff8f0", borderRadius:10, padding:12 }}>
                      <div style={{ fontSize:11, color:"#94a8b8", fontWeight:600 }}>OVERDUE</div>
                      <div style={{ fontWeight:800, color: areaOverdue>0?"#dc2626":"#059669", fontSize:15 }}>{areaOverdue} bills</div>
                    </div>
                  </div>
                  <div style={{ marginTop:14 }}>
                    {areaUsers.map(u=>(
                      <div key={u.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 0", borderBottom:"1px solid #f0f7ff" }}>
                        <span style={{ fontSize:13, color:"#0a2540", fontWeight:600 }}>{u.name}</span>
                        <span style={{ fontFamily:"monospace", fontSize:12, color:"#0077b6" }}>{u.meterNo}</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }
  };

  return (
    <div style={{ display:"flex", minHeight:"100vh", fontFamily:"'DM Sans',sans-serif", background:"#f4f8fb" }}>
      {/* Desktop sidebar */}
      <div style={{ display:"none", "@media(min-width:768px)":{ display:"flex" } }} className="desktop-sidebar">
        <Sidebar/>
      </div>
      {/* Mobile overlay sidebar */}
      {sideOpen && (
        <div style={{ position:"fixed", inset:0, zIndex:200 }}>
          <div style={{ position:"absolute", inset:0, background:"rgba(0,0,0,0.5)" }} onClick={()=>setSideOpen(false)}/>
          <div style={{ position:"relative", width:240, height:"100%" }}><Sidebar/></div>
        </div>
      )}

      {/* Main */}
      <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
        {/* Topbar */}
        <div style={{ background:"#fff", borderBottom:"1px solid #e8f4fd", padding:"14px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
          <div style={{ display:"flex", alignItems:"center", gap:12 }}>
            <button onClick={()=>setSideOpen(!sideOpen)} className="mobile-menu" style={{ background:"none", border:"none", cursor:"pointer", display:"none", padding:4 }}>
              <Icon name="menu" size={22} color="#0a2540"/>
            </button>
            <div>
              <div style={{ fontWeight:800, color:"#0a2540", fontSize:16, fontFamily:"'Playfair Display',serif" }}>
                {navItems.find(n=>n.id===page)?.label||"Dashboard"}
              </div>
              <div style={{ fontSize:12, color:"#94a8b8" }}>AquaFlow Admin</div>
            </div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <button onClick={()=>setNotif(!notif)} style={{ background:"#f0f7ff", border:"none", borderRadius:10, width:38, height:38, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", position:"relative" }}>
              <Icon name="bell" size={18} color="#0077b6"/>
              {overdueCount>0 && <span style={{ position:"absolute", top:6, right:6, width:8, height:8, background:"#ef4444", borderRadius:"50%" }}/>}
            </button>
            <div style={{ background:"linear-gradient(135deg,#0077b6,#00b4d8)", borderRadius:10, width:38, height:38, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:700, fontSize:14 }}>A</div>
          </div>
        </div>

        {/* Notifications dropdown */}
        {notif && overdueCount>0 && (
          <div style={{ position:"absolute", top:64, right:16, background:"#fff", borderRadius:16, boxShadow:"0 8px 40px rgba(0,0,0,0.15)", border:"1px solid #e8f4fd", width:300, zIndex:100, padding:16 }}>
            <div style={{ fontWeight:700, color:"#0a2540", marginBottom:12, fontSize:14 }}>Overdue Alerts</div>
            {bills.filter(b=>b.status==="overdue").map(b=>{
              const u=users.find(x=>x.id===b.userId);
              return <div key={b.id} style={{ padding:"8px 0", borderBottom:"1px solid #f0f7ff", fontSize:13 }}>
                <b style={{ color:"#dc2626" }}>{u?.name}</b> — {MONTHS[b.month-1]} {b.year}: {fmtKES(b.amount)}
              </div>;
            })}
          </div>
        )}

        <div style={{ flex:1, overflowY:"auto", padding:"24px 20px" }}>
          {renderPage()}
        </div>
      </div>

      {/* Toast */}
      {toast && (
        <div style={{ position:"fixed", bottom:24, right:24, background: toast.type==="error"?"#dc2626":"#059669", color:"#fff", padding:"14px 22px", borderRadius:14, fontWeight:700, fontSize:14, boxShadow:"0 8px 30px rgba(0,0,0,0.25)", zIndex:9999, display:"flex", alignItems:"center", gap:10 }}>
          <Icon name={toast.type==="error"?"x":"check"} size={18} color="#fff"/>
          {toast.msg}
        </div>
      )}

      {/* ── MODALS ── */}
      {modal==="readingEntry" && (
        <Modal title="Enter Meter Reading" onClose={()=>setModal(null)}>
          <Input label="Select Customer" as="select" value={readForm.userId} onChange={e=>setReadForm(f=>({...f,userId:e.target.value}))}>
            <option value="">-- Choose Customer --</option>
            {users.map(u=><option key={u.id} value={u.id}>{u.name} ({u.meterNo})</option>)}
          </Input>
          {readForm.userId && (() => {
            const prev = bills.filter(b=>b.userId===readForm.userId).sort((a,b)=>b.year!==a.year?b.year-a.year:b.month-a.month)[0];
            const prevR = prev?prev.currReading:0;
            const units = readForm.currReading ? Math.max(0,Number(readForm.currReading)-prevR) : 0;
            return (
              <div style={{ background:"#f0f7ff", borderRadius:12, padding:14, marginBottom:16, fontSize:13 }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                  <span style={{ color:"#5b8fa8" }}>Previous Reading:</span>
                  <b style={{ color:"#0a2540" }}>{prevR} m³</b>
                </div>
                {readForm.currReading && <>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                    <span style={{ color:"#5b8fa8" }}>Units Consumed:</span>
                    <b style={{ color:"#0077b6" }}>{units} m³</b>
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", borderTop:"1px solid #dde8f0", paddingTop:8, marginTop:8 }}>
                    <span style={{ color:"#5b8fa8", fontWeight:700 }}>Bill Amount:</span>
                    <b style={{ color:"#059669", fontSize:16 }}>{fmtKES(units*RATE_PER_UNIT)}</b>
                  </div>
                </>}
              </div>
            );
          })()}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <Input label="Month" as="select" value={readForm.month} onChange={e=>setReadForm(f=>({...f,month:e.target.value}))}>
              {MONTHS.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
            </Input>
            <Input label="Year" type="number" value={readForm.year} onChange={e=>setReadForm(f=>({...f,year:e.target.value}))}/>
          </div>
          <Input label="Current Meter Reading (m³)" type="number" placeholder="e.g. 1450" value={readForm.currReading} onChange={e=>setReadForm(f=>({...f,currReading:e.target.value}))}/>
          <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
            <button onClick={()=>setModal(null)} style={btnSecondary}>Cancel</button>
            <button onClick={submitReading} style={btnPrimary}>Generate Bill</button>
          </div>
        </Modal>
      )}

      {modal==="payBill" && (
        <Modal title="Record Payment" onClose={()=>setModal(null)}>
          {!payForm.billId && (
            <Input label="Select Customer" as="select" onChange={e=>{ const u=users.find(x=>x.id===e.target.value); if(u){ const unpaid=bills.filter(b=>b.userId===u.id&&b.status!=="paid"); if(unpaid.length) setPayForm(f=>({...f, userId:u.id, billId:unpaid[0].id, amount:unpaid[0].amount})); }}}>
              <option value="">-- Choose Customer --</option>
              {users.map(u=><option key={u.id} value={u.id}>{u.name} ({u.meterNo})</option>)}
            </Input>
          )}
          {payForm.userId && (
            <Input label="Select Bill" as="select" value={payForm.billId} onChange={e=>{ const b=bills.find(x=>x.id===e.target.value); if(b) setPayForm(f=>({...f,billId:b.id,amount:b.amount})); }}>
              <option value="">-- Choose Bill --</option>
              {bills.filter(b=>b.userId===payForm.userId&&b.status!=="paid").map(b=><option key={b.id} value={b.id}>{MONTHS[b.month-1]} {b.year} — {fmtKES(b.amount)} ({b.status})</option>)}
            </Input>
          )}
          <Input label="Amount (KES)" type="number" value={payForm.amount} onChange={e=>setPayForm(f=>({...f,amount:e.target.value}))}/>
          <Input label="Payment Method" as="select" value={payForm.method} onChange={e=>setPayForm(f=>({...f,method:e.target.value}))}>
            {["M-Pesa","Bank Transfer","Cash","Cheque","PesaLink"].map(m=><option key={m}>{m}</option>)}
          </Input>
          <Input label="Transaction Reference (optional)" type="text" placeholder="e.g. QWE123456" value={payForm.ref} onChange={e=>setPayForm(f=>({...f,ref:e.target.value}))}/>
          {payForm.billId && (() => {
            const b=bills.find(x=>x.id===payForm.billId);
            const paid=payments.filter(p=>p.billId===payForm.billId).reduce((s,p)=>s+p.amount,0);
            const bal=b?b.amount-paid:0;
            return bal>0 ? (
              <div style={{ background:"#fff8e1", borderRadius:12, padding:12, marginBottom:12, fontSize:13 }}>
                <div style={{ display:"flex", justifyContent:"space-between" }}>
                  <span>Outstanding Balance:</span><b style={{ color:"#dc2626" }}>{fmtKES(bal)}</b>
                </div>
              </div>
            ):null;
          })()}
          <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
            <button onClick={()=>setModal(null)} style={btnSecondary}>Cancel</button>
            <button onClick={submitPayment} style={btnPrimary}>Confirm Payment</button>
          </div>
        </Modal>
      )}

      {modal==="addUser" && (
        <Modal title="Add New Customer" onClose={()=>setModal(null)} wide>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 16px" }}>
            <Input label="Full Name" type="text" value={userForm.name} onChange={e=>setUserForm(f=>({...f,name:e.target.value}))}/>
            <Input label="Meter Number" type="text" placeholder="MTR-XXXX" value={userForm.meterNo} onChange={e=>setUserForm(f=>({...f,meterNo:e.target.value}))}/>
            <Input label="Area" as="select" value={userForm.area} onChange={e=>setUserForm(f=>({...f,area:e.target.value}))}>
              {AREAS.map(a=><option key={a}>{a}</option>)}
            </Input>
            <Input label="Phone" type="tel" value={userForm.phone} onChange={e=>setUserForm(f=>({...f,phone:e.target.value}))}/>
            <Input label="Email" type="email" value={userForm.email} onChange={e=>setUserForm(f=>({...f,email:e.target.value}))}/>
            <Input label="Password" type="password" value={userForm.password} onChange={e=>setUserForm(f=>({...f,password:e.target.value}))}/>
          </div>
          <Input label="Address" type="text" value={userForm.address} onChange={e=>setUserForm(f=>({...f,address:e.target.value}))}/>
          <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
            <button onClick={()=>setModal(null)} style={btnSecondary}>Cancel</button>
            <button onClick={submitUser} style={btnPrimary}>Add Customer</button>
          </div>
        </Modal>
      )}

      {modal==="editUser" && editUser && (
        <Modal title="Edit Customer" onClose={()=>setModal(null)} wide>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 16px" }}>
            <Input label="Full Name" type="text" value={editUser.name} onChange={e=>setEditUser(u=>({...u,name:e.target.value}))}/>
            <Input label="Meter Number" type="text" value={editUser.meterNo} onChange={e=>setEditUser(u=>({...u,meterNo:e.target.value}))}/>
            <Input label="Area" as="select" value={editUser.area} onChange={e=>setEditUser(u=>({...u,area:e.target.value}))}>
              {AREAS.map(a=><option key={a}>{a}</option>)}
            </Input>
            <Input label="Phone" type="tel" value={editUser.phone} onChange={e=>setEditUser(u=>({...u,phone:e.target.value}))}/>
            <Input label="Email" type="email" value={editUser.email} onChange={e=>setEditUser(u=>({...u,email:e.target.value}))}/>
            <Input label="Status" as="select" value={editUser.status} onChange={e=>setEditUser(u=>({...u,status:e.target.value}))}>
              <option value="active">Active</option><option value="inactive">Inactive</option>
            </Input>
          </div>
          <Input label="Address" type="text" value={editUser.address} onChange={e=>setEditUser(u=>({...u,address:e.target.value}))}/>
          <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
            <button onClick={()=>setModal(null)} style={btnSecondary}>Cancel</button>
            <button onClick={saveEditUser} style={btnPrimary}>Save Changes</button>
          </div>
        </Modal>
      )}

      <style>{`.desktop-sidebar{display:flex!important} @media(max-width:767px){.desktop-sidebar{display:none!important}.mobile-menu{display:flex!important}}`}</style>
    </div>
  );
};

// ── Standalone: Profile Page (extracted to fix React hooks rule) ─────────────
const ProfilePage = ({ user, store, showToast, myBills, totalPaid, balance }) => {
  const [editing,   setEditing]   = useState(false);
  const [profForm,  setProfForm]  = useState({ name:user.name, phone:user.phone, email:user.email, address:user.address||"" });
  const [pwForm,    setPwForm]    = useState({ current:"", next:"", confirm:"" });
  const [pwErr,     setPwErr]     = useState("");
  const [pwSuccess, setPwSuccess] = useState(false);

  const saveProfile = () => {
    store.setUsers(store.users.map(u => u.id===user.id ? { ...u, ...profForm } : u));
    showToast("Profile updated successfully!");
    setEditing(false);
  };
  const changePassword = () => {
    setPwErr(""); setPwSuccess(false);
    if (pwForm.current !== user.password) return setPwErr("Current password is incorrect.");
    if (pwForm.next.length < 6)           return setPwErr("New password must be at least 6 characters.");
    if (pwForm.next !== pwForm.confirm)   return setPwErr("Passwords do not match.");
    store.setUsers(store.users.map(u => u.id===user.id ? { ...u, password:pwForm.next } : u));
    setPwSuccess(true);
    setPwForm({ current:"", next:"", confirm:"" });
  };

  const fieldSt = { width:"100%", padding:"10px 14px", border:"1.5px solid #dde8f0", borderRadius:10, fontSize:14, color:"#0a2540", background:editing?"#f8fbff":"#f4f8fb", outline:"none", boxSizing:"border-box" };
  const labelSt = { display:"block", fontSize:11, fontWeight:700, color:"#5b8fa8", marginBottom:5, textTransform:"uppercase", letterSpacing:"0.08em" };

  return (
    <div>
      <h2 style={h2style}>My Profile</h2>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))", gap:20 }}>
        <div style={{ background:"#fff", borderRadius:18, padding:24, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" }}>
          <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:22, paddingBottom:20, borderBottom:"1px solid #f0f7ff" }}>
            <div style={{ width:64, height:64, background:"linear-gradient(135deg,#0077b6,#00b4d8)", borderRadius:18, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:28, flexShrink:0 }}>
              {user.name.charAt(0)}
            </div>
            <div>

            ))}

        </div>
      </div>
    </div>
  );
};
