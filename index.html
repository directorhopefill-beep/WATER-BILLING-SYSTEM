                  const ageBg    = a.daysLate===0?"#d1fae5":a.daysLate<=30?"#fef3c7":a.daysLate<=60?"#ffedd5":"#fee2e2";
                  return (
                    <tr key={a.id} style={{ borderBottom:"1px solid #f0f7ff", background:i%2===0?"#fff":"#fafcff" }}>
                      <td style={tdSt}><div style={{ fontWeight:700 }}>{a.user?.name}</div><div style={{ fontSize:11, color:"#94a8b8" }}>{a.user?.phone}</div></td>
                      <td style={tdSt}><span style={{ fontFamily:"monospace", color:"#0077b6", fontWeight:700 }}>{a.user?.meterNo}</span></td>
                      <td style={tdSt}><span style={{ fontFamily:"monospace", color:"#0077b6", fontSize:12 }}>{a.invoiceNo||a.id}</span></td>
                      <td style={tdSt}>{MONTHS[a.month-1]} {a.year}</td>
                      <td style={tdSt}>{a.dueDate}</td>
                      <td style={tdSt}>
                        <span style={{ background:ageBg, color:ageColor, borderRadius:8, padding:"3px 10px", fontWeight:700, fontSize:12 }}>
                          {a.daysLate===0?"Current":`${a.daysLate}d`}
                        </span>
                      </td>
                      <td style={tdSt}><b style={{ color:"#dc2626", fontSize:14 }}>{fmtKES(a.balance)}</b></td>
                      <td style={tdSt}>
                        <span style={{ background:ageBg, color:ageColor, borderRadius:8, padding:"3px 10px", fontSize:11, fontWeight:700 }}>
                          {a.daysLate===0?"Not Due":a.daysLate<=30?"1–30 days":a.daysLate<=60?"31–60 days":"60+ days"}
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              {aging.length>0 && (
                <tfoot>
                  <tr style={{ background:"#fff5f5", borderTop:"2px solid #fee2e2" }}>
                    <td colSpan={6} style={{ ...tdSt, fontWeight:800, color:"#0a2540" }}>TOTAL OUTSTANDING</td>
                    <td style={{ ...tdSt, fontWeight:800, color:"#dc2626", fontSize:15 }}>{fmtKES(aging.reduce((s,a)=>s+a.balance,0))}</td>
                    <td/>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>
        </div>

        {/* Meter health vs collection */}
        <div style={sCard}>
          <h3 style={{ margin:"0 0 16px", fontSize:15, color:"#0a2540", fontWeight:800 }}>Meter Health Summary</h3>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))", gap:10 }}>
            {["active","faulty","replaced","disconnected","pending"].map(st=>{
              const cnt = meters.filter(m=>m.status===st).length;
              if (!cnt) return null;
              const colors = { active:"#059669",faulty:"#dc2626",replaced:"#9ca3af",disconnected:"#f59e0b",pending:"#7c3aed" };
              const bgs    = { active:"#d1fae5",faulty:"#fee2e2",replaced:"#f3f4f6",disconnected:"#fef3c7",pending:"#ede9fe" };
              return (
                <div key={st} style={{ background:bgs[st], borderRadius:12, padding:"12px 14px", textAlign:"center" }}>
                  <div style={{ fontWeight:800, color:colors[st], fontSize:26 }}>{cnt}</div>
                  <div style={{ fontSize:11, color:colors[st], fontWeight:700, textTransform:"capitalize" }}>{st}</div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  };

  // ── RENDER ────────────────────────────────────────────────────────────────
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20, flexWrap:"wrap", gap:12 }}>
        <div>
          <h2 style={{ fontFamily:"'Playfair Display',serif", color:"#0a2540", fontSize:22, fontWeight:800, margin:0 }}>Reports & Analytics</h2>
          <p style={{ color:"#6b8fa8", fontSize:13, margin:"4px 0 0" }}>Financial performance · Customer insights · Area analysis · Collection aging</p>
        </div>
      </div>
      <TabBar/>
      {tab==="overview"   && <OverviewTab/>}
      {tab==="monthly"    && <MonthlyTab/>}
      {tab==="customers"  && <CustomerTab/>}
      {tab==="areas"      && <AreaTab/>}
      {tab==="collection" && <CollectionTab/>}
    </div>
  );
};

// ════════════════════════════════════════════════════════════════════════════
//  MODULE 6 — CUSTOMER MANAGEMENT
// ════════════════════════════════════════════════════════════════════════════
const CustomerModule = ({ store, showToast }) => {
  const { users, setUsers, bills, payments, meters, setMeters } = store;

  const [tab,        setTab]        = useState("directory");
  const [search,     setSearch]     = useState("");
  const [filterArea, setFilterArea] = useState("all");
  const [filterSt,   setFilterSt]   = useState("all");
  const [filterType, setFilterType] = useState("all");
  const [selected,   setSelected]   = useState([]);   // bulk selection ids
  const [viewId,     setViewId]     = useState(null); // profile view
  const [modal,      setModal]      = useState(null); // "add"|"edit"|"note"|"deactivate"
  const [noteText,   setNoteText]   = useState("");
  const [notes,      setNotes]      = useState(() => {
    try { return JSON.parse(localStorage.getItem("aq_notes")) || {}; } catch { return {}; }
  });

  // ── Blank form ─────────────────────────────────────────────────────────────
  const blankUser = { name:"", meterNo:"", area:"Westlands", address:"", phone:"", email:"", password:"", type:"residential", joinDate:today(), status:"active" };
  const [form, setForm]     = useState(blankUser);
  const [editId, setEditId] = useState(null);

  // ── Helpers ────────────────────────────────────────────────────────────────
  const saveNotes = n => { localStorage.setItem("aq_notes", JSON.stringify(n)); setNotes(n); };
  const userBills    = id => bills.filter(b => b.userId === id);
  const userPayments = id => payments.filter(p => p.userId === id);
  const userMeter    = id => meters.find(m => m.customerId === id);
  const totalBilled  = id => userBills(id).reduce((s,b)=>s+(b.amount||0),0);
  const totalPaid    = id => userPayments(id).reduce((s,p)=>s+p.amount,0);
  const balance      = id => totalBilled(id) - totalPaid(id);
  const overdueCount = id => userBills(id).filter(b=>b.status==="overdue").length;

  const CUSTOMER_TYPES = ["residential","commercial","institutional","government"];

  // ── Filtered list ──────────────────────────────────────────────────────────
  const filtered = users.filter(u => {
    const q = search.toLowerCase();
    const matchQ = !q || u.name.toLowerCase().includes(q) || u.meterNo.toLowerCase().includes(q)
                       || u.email.toLowerCase().includes(q) || u.phone.includes(q);
    const matchA = filterArea === "all" || u.area === filterArea;
    const matchS = filterSt   === "all" || u.status === filterSt;
    const matchT = filterType === "all" || (u.type||"residential") === filterType;
    return matchQ && matchA && matchS && matchT;
  });

  // ── CRUD ───────────────────────────────────────────────────────────────────
  const openAdd  = () => { setForm(blankUser); setEditId(null); setModal("add"); };
  const openEdit = u  => { setForm({...u}); setEditId(u.id); setModal("edit"); };

  const saveCustomer = () => {
    if (!form.name || !form.meterNo) return showToast("Name and Meter No are required","error");
    if (users.some(u=>u.meterNo===form.meterNo && u.id!==editId))
      return showToast("Meter number already in use","error");
    if (editId) {
      setUsers(users.map(u => u.id===editId ? {...u,...form} : u));
      showToast("Customer updated!");
    } else {
      const nu = { id:uid(), ...form };
      setUsers([...users, nu]);
      showToast(`${form.name} added successfully!`);
    }
    setModal(null);
  };

  const toggleStatus = id => {
    const u = users.find(x=>x.id===id);
    const next = u.status==="active" ? "inactive" : "active";
    setUsers(users.map(x => x.id===id ? {...x,status:next} : x));
    showToast(`${u.name} marked as ${next}`);
    setModal(null);
  };

  const addNote = id => {
    if (!noteText.trim()) return;
    const existing = notes[id] || [];
    const updated  = { ...notes, [id]: [...existing, { text:noteText.trim(), date:today(), by:"Admin" }] };
    saveNotes(updated);
    setNoteText("");
    showToast("Note added!");
  };

  // ── Bulk actions ───────────────────────────────────────────────────────────
  const toggleSelect = id  => setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s,id]);
  const selectAll    = ()  => setSelected(filtered.map(u=>u.id));
  const clearSelect  = ()  => setSelected([]);
  const bulkDeactivate = () => {
    setUsers(users.map(u => selected.includes(u.id) ? {...u,status:"inactive"} : u));
    showToast(`${selected.length} customers deactivated`);
    setSelected([]);
  };
  const bulkActivate = () => {
    setUsers(users.map(u => selected.includes(u.id) ? {...u,status:"active"} : u));
    showToast(`${selected.length} customers activated`);
    setSelected([]);
  };

  // ── Local style shortcuts ──────────────────────────────────────────────────
  const card  = { background:"#fff", borderRadius:18, padding:20, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" };
  const sPrim = { background:"linear-gradient(135deg,#0077b6,#00b4d8)", color:"#fff", border:"none", borderRadius:10, padding:"9px 18px", fontWeight:700, fontSize:13, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:7 };
  const sSec  = { background:"#f0f7ff", color:"#0077b6", border:"1.5px solid #dde8f0", borderRadius:10, padding:"9px 16px", fontWeight:700, fontSize:13, cursor:"pointer" };
  const sDng  = { background:"linear-gradient(135deg,#dc2626,#f87171)", color:"#fff", border:"none", borderRadius:10, padding:"9px 16px", fontWeight:700, fontSize:13, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:7 };
  const sGrn  = { background:"linear-gradient(135deg,#059669,#34d399)", color:"#fff", border:"none", borderRadius:10, padding:"9px 16px", fontWeight:700, fontSize:13, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:7 };
  const sIco  = (bg="#f0f7ff") => ({ background:bg, border:"none", borderRadius:8, width:32, height:32, cursor:"pointer", display:"inline-flex", alignItems:"center", justifyContent:"center" });
  const lbl   = { display:"block", fontSize:11, fontWeight:700, color:"#5b8fa8", marginBottom:5, textTransform:"uppercase", letterSpacing:"0.08em" };
  const inp   = { width:"100%", padding:"10px 14px", border:"1.5px solid #dde8f0", borderRadius:10, fontSize:14, color:"#0a2540", background:"#f8fbff", outline:"none", boxSizing:"border-box" };
  const th    = { padding:"11px 15px", textAlign:"left", color:"#5b8fa8", fontWeight:700, fontSize:11, textTransform:"uppercase", letterSpacing:"0.05em", borderBottom:"1px solid #e8f4fd", whiteSpace:"nowrap" };
  const tdS   = { padding:"11px 15px", color:"#374151", verticalAlign:"middle" };

  const FI = ({ label, hint, children, ...p }) => (
    <div style={{ marginBottom:14 }}>
      {label && <label style={lbl}>{label}</label>}
      {children || (p.as==="select"
        ? <select {...p} as={undefined} style={{ ...inp, ...p.style }}>{p.children2}</select>
        : p.as==="textarea"
        ? <textarea {...p} as={undefined} style={{ ...inp, resize:"vertical", minHeight:72, ...p.style }}/>
        : <input {...p} style={{ ...inp, ...p.style }}/>
      )}
      {hint && <div style={{ fontSize:11, color:"#94a8b8", marginTop:3 }}>{hint}</div>}
    </div>
  );

  // ── TYPE BADGE ─────────────────────────────────────────────────────────────
  const TypeBadge = ({ type }) => {
    const map = { residential:{ bg:"#dbeafe",c:"#1e40af" }, commercial:{ bg:"#fef3c7",c:"#92400e" }, institutional:{ bg:"#ede9fe",c:"#5b21b6" }, government:{ bg:"#d1fae5",c:"#065f46" } };
    const s = map[type||"residential"] || map.residential;
    return <span style={{ background:s.bg, color:s.c, borderRadius:20, padding:"3px 10px", fontSize:11, fontWeight:700, whiteSpace:"nowrap", textTransform:"capitalize" }}>{type||"Residential"}</span>;
  };

  // ── TAB BAR ────────────────────────────────────────────────────────────────
  const TabBar = () => (
    <div style={{ display:"flex", gap:4, background:"#f0f7ff", borderRadius:12, padding:4, marginBottom:22, flexWrap:"wrap" }}>
      {[
        { id:"directory", emoji:"👥", label:"Directory"          },
        { id:"profile",   emoji:"🪪", label:"Customer Profile"   },
        { id:"activity",  emoji:"📋", label:"Account Activity"   },
        { id:"bulk",      emoji:"⚡", label:"Bulk Actions"        },
      ].map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)}
          style={{ padding:"8px 16px", borderRadius:9, border:"none", cursor:"pointer", fontWeight:700, fontSize:13, transition:"all .2s",
            background:tab===t.id?"#0077b6":"transparent",
            color:tab===t.id?"#fff":"#5b8fa8" }}>
          {t.emoji} {t.label}
          {t.id==="profile" && viewId && <span style={{ marginLeft:6, background:"rgba(255,255,255,0.3)", borderRadius:8, padding:"1px 7px", fontSize:11 }}>1</span>}
          {t.id==="bulk" && selected.length>0 && <span style={{ marginLeft:6, background:"#dc2626", color:"#fff", borderRadius:8, padding:"1px 7px", fontSize:11 }}>{selected.length}</span>}
        </button>
      ))}
    </div>
  );

  // ════════════════════════════════════════════════════════════════════════════
  //  TAB 1 — DIRECTORY
  // ════════════════════════════════════════════════════════════════════════════
  const DirectoryTab = () => (
    <>
      {/* Stats strip */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))", gap:12, marginBottom:18 }}>
        {[
          { label:"Total",       value:users.length,                               color:"#0077b6", bg:"#dbeafe" },
          { label:"Active",      value:users.filter(u=>u.status==="active").length, color:"#059669", bg:"#d1fae5" },
          { label:"Inactive",    value:users.filter(u=>u.status==="inactive").length,color:"#6b7280",bg:"#f3f4f6"},
          { label:"With Balance",value:users.filter(u=>balance(u.id)>0).length,    color:"#dc2626", bg:"#fee2e2" },
          { label:"Overdue",     value:users.filter(u=>overdueCount(u.id)>0).length,color:"#f59e0b",bg:"#fef3c7"},
        ].map(s=>(
          <div key={s.label} style={{ background:s.bg, borderRadius:14, padding:"14px 16px" }}>
            <div style={{ fontSize:11, color:s.color, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:4 }}>{s.label}</div>
            <div style={{ fontWeight:800, color:"#0a2540", fontSize:24, lineHeight:1 }}>{s.value}</div>
          </div>
        ))}
      </div>

      {/* Filters & search */}
      <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap" }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, background:"#fff", border:"1.5px solid #dde8f0", borderRadius:10, padding:"8px 14px", flex:1, minWidth:200 }}>
          <Icon name="search" size={15} color="#94a8b8"/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, meter, email, phone…"
            style={{ border:"none", outline:"none", fontSize:13, color:"#0a2540", background:"transparent", width:"100%" }}/>
        </div>
        {[
          { val:filterArea, set:setFilterArea, opts:["all",...AREAS],          label:"Area"   },
          { val:filterSt,   set:setFilterSt,   opts:["all","active","inactive"],label:"Status" },
          { val:filterType, set:setFilterType, opts:["all",...CUSTOMER_TYPES], label:"Type"   },
        ].map(f=>(
          <select key={f.label} value={f.val} onChange={e=>f.set(e.target.value)}
            style={{ padding:"8px 14px", border:"1.5px solid #dde8f0", borderRadius:10, fontSize:13, color:"#0a2540", background:"#fff", cursor:"pointer" }}>
            <option value="all">All {f.label}s</option>
            {f.opts.filter(o=>o!=="all").map(o=><option key={o} value={o}>{o.charAt(0).toUpperCase()+o.slice(1)}</option>)}
          </select>
        ))}
        <button onClick={openAdd} style={sPrim}><Icon name="plus" size={15} color="#fff"/> Add Customer</button>
      </div>

      {/* Bulk selection bar */}
      {selected.length>0 && (
        <div style={{ background:"linear-gradient(135deg,#0a2540,#0077b6)", borderRadius:12, padding:"12px 18px", marginBottom:14, display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
          <span style={{ color:"#fff", fontWeight:700, fontSize:13 }}>{selected.length} selected</span>
          <button onClick={bulkActivate}   style={sGrn}><Icon name="check" size={13} color="#fff"/> Activate All</button>
          <button onClick={bulkDeactivate} style={sDng}><Icon name="x"     size={13} color="#fff"/> Deactivate All</button>
          <button onClick={clearSelect}    style={{ ...sSec, marginLeft:"auto" }}>Clear</button>
        </div>
      )}

      {/* Table */}
      <div style={{ ...card, overflow:"hidden", padding:0 }}>
        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
            <thead>
              <tr style={{ background:"#f8fbff" }}>
                <th style={th}><input type="checkbox" onChange={e=>e.target.checked?selectAll():clearSelect()} checked={selected.length===filtered.length&&filtered.length>0} style={{ cursor:"pointer" }}/></th>
                {["Meter No","Customer","Type","Area","Phone","Balance","Bills","Status","Actions"].map(h=>(
                  <th key={h} style={th}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.length===0 && <tr><td colSpan={10} style={{ textAlign:"center", padding:40, color:"#94a8b8" }}>No customers match your filters.</td></tr>}
              {filtered.map((u,i)=>{
                const bal  = balance(u.id);
                const oc   = overdueCount(u.id);
                const ubs  = userBills(u.id).length;
                const isSelected = selected.includes(u.id);
                return (
                  <tr key={u.id} style={{ borderBottom:"1px solid #f0f7ff", background:isSelected?"#f0f7ff":i%2===0?"#fff":"#fafcff", cursor:"pointer" }}>
                    <td style={tdS}><input type="checkbox" checked={isSelected} onChange={()=>toggleSelect(u.id)} onClick={e=>e.stopPropagation()} style={{ cursor:"pointer" }}/></td>
                    <td style={tdS}><span style={{ fontFamily:"monospace", background:"#e8f4fd", padding:"3px 8px", borderRadius:6, color:"#0077b6", fontWeight:700 }}>{u.meterNo}</span></td>
                    <td style={tdS}>
                      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                        <div style={{ width:34, height:34, background:"linear-gradient(135deg,#0077b6,#00b4d8)", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:14, flexShrink:0 }}>
                          {u.name.charAt(0)}
                        </div>
                        <div>
                          <div style={{ fontWeight:700, color:"#0a2540" }}>{u.name}</div>
                          <div style={{ fontSize:11, color:"#94a8b8" }}>{u.email}</div>
                        </div>
                      </div>
                    </td>
                    <td style={tdS}><TypeBadge type={u.type||"residential"}/></td>
                    <td style={tdS}>{u.area}</td>
                    <td style={tdS}>{u.phone}</td>
                    <td style={tdS}>
                      <div style={{ fontWeight:700, color:bal>0?"#dc2626":"#059669", fontSize:13 }}>{bal>0?`-${fmtKES(bal)}`:"Clear"}</div>
                      {oc>0 && <div style={{ fontSize:11, color:"#dc2626", fontWeight:600 }}>{oc} overdue</div>}
                    </td>
                    <td style={tdS}><span style={{ background:"#f0f7ff", color:"#0077b6", borderRadius:6, padding:"2px 8px", fontWeight:700 }}>{ubs}</span></td>
                    <td style={tdS}><Badge status={u.status}/></td>
                    <td style={tdS}>
                      <div style={{ display:"flex", gap:5 }}>
                        <button title="View Profile"    onClick={()=>{ setViewId(u.id); setTab("profile"); }} style={sIco("#dbeafe")}><Icon name="eye"  size={13} color="#0077b6"/></button>
                        <button title="Edit Customer"   onClick={()=>openEdit(u)}                            style={sIco()}><Icon name="edit" size={13} color="#0077b6"/></button>
                        <button title={u.status==="active"?"Deactivate":"Activate"} onClick={()=>toggleStatus(u.id)}
                          style={sIco(u.status==="active"?"#fee2e2":"#d1fae5")}>
                          <Icon name={u.status==="active"?"x":"check"} size={13} color={u.status==="active"?"#dc2626":"#059669"}/>
                        </button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={{ padding:"12px 18px", borderTop:"1px solid #f0f7ff", fontSize:12, color:"#94a8b8" }}>
          Showing {filtered.length} of {users.length} customers
        </div>
      </div>
    </>
  );

  // ════════════════════════════════════════════════════════════════════════════
  //  TAB 2 — CUSTOMER PROFILE
  // ════════════════════════════════════════════════════════════════════════════
  const ProfileTab = () => {
    const [pid, setPid] = useState(viewId || users[0]?.id || null);
    const u  = users.find(x=>x.id===pid);
    const m  = userMeter(pid);
    const ub = userBills(pid).sort((a,b)=>b.year!==a.year?b.year-a.year:b.month-a.month);
    const up = userPayments(pid).sort((a,b)=>b.date.localeCompare(a.date));
    const bal = balance(pid);
    const billed = totalBilled(pid);
    const paid   = totalPaid(pid);
    const colRate = billed>0 ? Math.round((paid/billed)*100) : 100;
    const custNotes = notes[pid] || [];

    if (!u) return <div style={{ textAlign:"center", color:"#94a8b8", padding:60 }}>Select a customer from the Directory tab.</div>;

    return (
      <div>
        {/* Customer picker */}
        <div style={{ display:"flex", gap:10, marginBottom:20, flexWrap:"wrap", alignItems:"center" }}>
          <label style={{ ...lbl, margin:0, whiteSpace:"nowrap" }}>Viewing profile:</label>
          <select value={pid} onChange={e=>setPid(e.target.value)}
            style={{ padding:"9px 14px", border:"1.5px solid #dde8f0", borderRadius:10, fontSize:13, color:"#0a2540", background:"#fff", cursor:"pointer", flex:1, maxWidth:320 }}>
            {users.map(x=><option key={x.id} value={x.id}>{x.name} — {x.meterNo}</option>)}
          </select>
          <button onClick={()=>openEdit(u)} style={sPrim}><Icon name="edit" size={14} color="#fff"/> Edit</button>
          <button onClick={()=>toggleStatus(pid)} style={u.status==="active"?sDng:sGrn}>
            <Icon name={u.status==="active"?"x":"check"} size={14} color="#fff"/> {u.status==="active"?"Deactivate":"Activate"}
          </button>
        </div>

        {/* Profile hero card */}
        <div style={{ background:"linear-gradient(135deg,#0a2540,#0077b6)", borderRadius:22, padding:28, color:"#fff", marginBottom:18, position:"relative", overflow:"hidden" }}>
          <div style={{ position:"absolute", right:-30, top:-30, width:160, height:160, background:"rgba(255,255,255,0.05)", borderRadius:"50%" }}/>
          <div style={{ position:"absolute", right:40, bottom:-40, width:100, height:100, background:"rgba(255,255,255,0.04)", borderRadius:"50%" }}/>
          <div style={{ display:"flex", alignItems:"flex-start", gap:20, flexWrap:"wrap" }}>
            <div style={{ width:68, height:68, background:"rgba(255,255,255,0.15)", borderRadius:18, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:30, flexShrink:0 }}>
              {u.name.charAt(0)}
            </div>
            <div style={{ flex:1 }}>
              <div style={{ fontFamily:"'Playfair Display',serif", fontWeight:800, fontSize:22 }}>{u.name}</div>
              <div style={{ opacity:0.7, fontSize:13, marginTop:4 }}>{u.address}</div>
              <div style={{ display:"flex", gap:10, marginTop:10, flexWrap:"wrap" }}>
                <span style={{ background:"rgba(255,255,255,0.15)", borderRadius:20, padding:"4px 14px", fontSize:12, fontWeight:700 }}>📞 {u.phone}</span>
                <span style={{ background:"rgba(255,255,255,0.15)", borderRadius:20, padding:"4px 14px", fontSize:12, fontWeight:700 }}>✉️ {u.email}</span>
                <span style={{ background:"rgba(255,255,255,0.15)", borderRadius:20, padding:"4px 14px", fontSize:12, fontWeight:700 }}>📅 Since {u.joinDate}</span>
              </div>
            </div>
            <div style={{ textAlign:"right" }}>
              <div style={{ display:"flex", gap:8, justifyContent:"flex-end", marginBottom:6 }}>
                <Badge status={u.status}/>
                <TypeBadge type={u.type||"residential"}/>
              </div>
              <div style={{ fontFamily:"monospace", fontWeight:800, fontSize:18, color:"#00b4d8" }}>{u.meterNo}</div>
              <div style={{ opacity:0.6, fontSize:12, marginTop:4 }}>{u.area}</div>
            </div>
          </div>
        </div>

        {/* KPI row */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))", gap:12, marginBottom:18 }}>
          {[
            { label:"Total Billed",   value:fmtKES(billed),           color:"#0077b6", bg:"#dbeafe" },
            { label:"Total Paid",     value:fmtKES(paid),             color:"#059669", bg:"#d1fae5" },
            { label:"Balance Due",    value:fmtKES(bal),              color:bal>0?"#dc2626":"#059669", bg:bal>0?"#fee2e2":"#d1fae5" },
            { label:"Collection Rate",value:`${colRate}%`,            color:colRate>=90?"#059669":colRate>=70?"#f59e0b":"#dc2626", bg:"#f8fbff" },
            { label:"Total Bills",    value:ub.length,                color:"#7c3aed", bg:"#ede9fe" },
            { label:"Overdue Bills",  value:overdueCount(pid),        color:overdueCount(pid)>0?"#dc2626":"#059669", bg:overdueCount(pid)>0?"#fee2e2":"#d1fae5" },
          ].map(s=>(
            <div key={s.label} style={{ background:s.bg, borderRadius:14, padding:16 }}>
              <div style={{ fontSize:11, color:s.color, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:6 }}>{s.label}</div>
              <div style={{ fontWeight:800, color:"#0a2540", fontSize:20, lineHeight:1 }}>{s.value}</div>
            </div>
          ))}
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))", gap:16 }}>

          {/* Meter info */}
          <div style={{ ...card }}>
            <h3 style={{ margin:"0 0 14px", fontSize:15, color:"#0a2540", fontWeight:800, display:"flex", alignItems:"center", gap:8 }}>
              <Icon name="meter" size={17} color="#0077b6"/> Assigned Meter
            </h3>
            {!m ? (
              <div style={{ textAlign:"center", color:"#94a8b8", padding:24, fontSize:13 }}>No meter assigned.</div>
            ) : (
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, fontSize:13 }}>
                {[
                  ["Meter No",    <span style={{ fontFamily:"monospace", color:"#0077b6", fontWeight:700 }}>{m.meterNo}</span>],
                  ["Serial No",   m.serialNo],
                  ["Type",        m.type],
                  ["Brand",       m.brand],
                  ["Status",      <Badge status={m.status}/>],
                  ["Installed",   m.installDate],
                  ["Last Reading",m.lastReadingDate||"—"],
                  ["Current m³",  <b style={{ color:"#0077b6" }}>{m.currentReading} m³</b>],
                ].map(([k,v])=>(
                  <div key={k} style={{ background:"#f8fbff", borderRadius:10, padding:"10px 14px" }}>
                    <div style={{ fontSize:10, color:"#94a8b8", fontWeight:700, textTransform:"uppercase", marginBottom:4 }}>{k}</div>
                    <div style={{ fontWeight:600, color:"#0a2540" }}>{v}</div>
                  </div>
                ))}
                {m.gps && (
                  <div style={{ gridColumn:"1/-1", background:"#f0f7ff", borderRadius:10, padding:"10px 14px" }}>
                    <div style={{ fontSize:10, color:"#94a8b8", fontWeight:700, textTransform:"uppercase", marginBottom:4 }}>GPS</div>
                    <div style={{ fontSize:13, color:"#0077b6", fontFamily:"monospace" }}>📍 {m.gps}</div>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Recent bills */}
          <div style={{ ...card }}>
            <h3 style={{ margin:"0 0 14px", fontSize:15, color:"#0a2540", fontWeight:800, display:"flex", alignItems:"center", gap:8 }}>
              <Icon name="bill" size={17} color="#0077b6"/> Recent Bills
            </h3>
            {ub.length===0 ? <div style={{ textAlign:"center", color:"#94a8b8", padding:20 }}>No bills yet.</div>
            : ub.slice(0,5).map(b=>(
              <div key={b.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"9px 0", borderBottom:"1px solid #f0f7ff" }}>
                <div>
                  <div style={{ fontWeight:700, color:"#0a2540", fontSize:13 }}>{MONTHS[b.month-1]} {b.year}</div>
                  <div style={{ fontSize:11, color:"#94a8b8" }}>{b.units} m³ · Due: {b.dueDate}</div>
                </div>
                <div style={{ textAlign:"right" }}>
                  <div style={{ fontWeight:700, color:"#0077b6", fontSize:13 }}>{fmtKES(b.amount||0)}</div>
                  <Badge status={b.status}/>
                </div>
              </div>
            ))}
          </div>

          {/* Recent payments */}
          <div style={{ ...card }}>
            <h3 style={{ margin:"0 0 14px", fontSize:15, color:"#0a2540", fontWeight:800, display:"flex", alignItems:"center", gap:8 }}>
              <Icon name="pay" size={17} color="#059669"/> Recent Payments
            </h3>
            {up.length===0 ? <div style={{ textAlign:"center", color:"#94a8b8", padding:20 }}>No payments yet.</div>
            : up.slice(0,5).map(p=>(
              <div key={p.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"9px 0", borderBottom:"1px solid #f0f7ff" }}>
                <div>
                  <div style={{ fontWeight:700, color:"#0a2540", fontSize:13 }}>{p.method}</div>
                  <div style={{ fontSize:11, color:"#94a8b8" }}>{p.date} · <span style={{ fontFamily:"monospace", color:"#059669" }}>{p.ref}</span></div>
                </div>
                <div style={{ fontWeight:800, color:"#059669" }}>{fmtKES(p.amount)}</div>
              </div>
            ))}
          </div>

          {/* Admin notes */}
          <div style={{ ...card }}>
            <h3 style={{ margin:"0 0 14px", fontSize:15, color:"#0a2540", fontWeight:800, display:"flex", alignItems:"center", gap:8 }}>
              <Icon name="edit" size={17} color="#7c3aed"/> Admin Notes
            </h3>
            <div style={{ maxHeight:180, overflowY:"auto", marginBottom:12 }}>
              {custNotes.length===0 && <div style={{ color:"#94a8b8", fontSize:13, textAlign:"center", padding:16 }}>No notes yet.</div>}
              {[...custNotes].reverse().map((n,i)=>(
                <div key={i} style={{ background:"#f8fbff", borderRadius:10, padding:"10px 14px", marginBottom:8, fontSize:13 }}>
                  <div style={{ color:"#0a2540" }}>{n.text}</div>
                  <div style={{ fontSize:11, color:"#94a8b8", marginTop:4 }}>{n.by} · {n.date}</div>
                </div>
              ))}
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <input value={noteText} onChange={e=>setNoteText(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&addNote(pid)}
                placeholder="Add a note about this customer…"
                style={{ ...inp, flex:1, marginBottom:0 }}/>
              <button onClick={()=>addNote(pid)} style={sPrim}><Icon name="plus" size={14} color="#fff"/></button>
            </div>
          </div>
        </div>
      </div>
    );
  };

  // ════════════════════════════════════════════════════════════════════════════
  //  TAB 3 — ACCOUNT ACTIVITY
  // ════════════════════════════════════════════════════════════════════════════
  const ActivityTab = () => {
    const [actId, setActId] = useState(viewId || users[0]?.id || null);
    const u   = users.find(x=>x.id===actId);
    const ub  = userBills(actId).sort((a,b)=>b.year!==a.year?b.year-a.year:b.month-a.month);
    const up  = userPayments(actId).sort((a,b)=>b.date.localeCompare(a.date));

    // Build combined chronological ledger
    const ledger = [
      ...ub.map(b=>({ date:b.dueDate, type:"bill",    label:`Bill — ${MONTHS[b.month-1]} ${b.year}`, amount:b.amount||0, status:b.status, id:b.id })),
      ...up.map(p=>({ date:p.date,    type:"payment", label:`Payment via ${p.method}`,                amount:p.amount,    ref:p.ref,        id:p.id })),
    ].sort((a,b)=>b.date.localeCompare(a.date));

    // Running balance
    let running = 0;
    const withBalance = [...ledger].reverse().map(row => {
      if (row.type==="bill")    running += row.amount;
      if (row.type==="payment") running -= row.amount;
      return { ...row, runningBalance: running };
    }).reverse();

    return (
      <div>
        <div style={{ display:"flex", gap:10, marginBottom:20, flexWrap:"wrap", alignItems:"center" }}>
          <label style={{ ...lbl, margin:0 }}>Customer:</label>
          <select value={actId} onChange={e=>setActId(e.target.value)}
            style={{ padding:"9px 14px", border:"1.5px solid #dde8f0", borderRadius:10, fontSize:13, color:"#0a2540", background:"#fff", cursor:"pointer", flex:1, maxWidth:320 }}>
            {users.map(x=><option key={x.id} value={x.id}>{x.name} — {x.meterNo}</option>)}
          </select>
        </div>

        {u && (
          <div style={{ background:"linear-gradient(135deg,#0a2540,#0d3a60)", borderRadius:16, padding:"16px 22px", color:"#fff", marginBottom:18, display:"flex", gap:20, flexWrap:"wrap", alignItems:"center" }}>
            <div style={{ width:44, height:44, background:"rgba(255,255,255,0.12)", borderRadius:12, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:20, flexShrink:0 }}>{u.name.charAt(0)}</div>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:800, fontSize:16 }}>{u.name}</div>
              <div style={{ opacity:0.6, fontSize:12 }}>{u.meterNo} · {u.area}</div>
            </div>
            {[
              { label:"Billed",  value:fmtKES(totalBilled(actId)), color:"#93c5fd" },
              { label:"Paid",    value:fmtKES(totalPaid(actId)),   color:"#6ee7b7" },
              { label:"Balance", value:fmtKES(balance(actId)),     color:balance(actId)>0?"#fca5a5":"#6ee7b7" },
            ].map(s=>(
              <div key={s.label} style={{ textAlign:"center" }}>
                <div style={{ fontSize:11, opacity:0.6, textTransform:"uppercase", letterSpacing:"0.06em" }}>{s.label}</div>
                <div style={{ fontWeight:800, fontSize:16, color:s.color }}>{s.value}</div>
              </div>
            ))}
          </div>
        )}

        <div style={{ ...card, overflow:"hidden", padding:0 }}>
          <div style={{ padding:"16px 20px", borderBottom:"1px solid #f0f7ff", fontWeight:700, color:"#0a2540", fontSize:14 }}>
            Account Statement — Full History ({withBalance.length} entries)
          </div>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
              <thead>
                <tr style={{ background:"#f8fbff" }}>
                  {["Date","Entry","Type","Amount","Running Balance","Status / Ref"].map(h=>(
                    <th key={h} style={th}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {withBalance.length===0 && <tr><td colSpan={6} style={{ textAlign:"center", padding:40, color:"#94a8b8" }}>No activity yet.</td></tr>}
                {withBalance.map((row,i)=>(
                  <tr key={row.id} style={{ borderBottom:"1px solid #f0f7ff", background:row.type==="payment"?"#f0fdf4":i%2===0?"#fff":"#fafcff" }}>
                    <td style={tdS}>{row.date}</td>
                    <td style={tdS}><b style={{ color:row.type==="payment"?"#059669":"#0a2540" }}>{row.label}</b></td>
                    <td style={tdS}>
                      <span style={{ background:row.type==="payment"?"#d1fae5":"#dbeafe", color:row.type==="payment"?"#065f46":"#1e40af", borderRadius:6, padding:"2px 8px", fontSize:12, fontWeight:700, textTransform:"capitalize" }}>
                        {row.type}
                      </span>
                    </td>
                    <td style={tdS}>
                      <b style={{ color:row.type==="payment"?"#059669":"#dc2626", fontSize:14 }}>
                        {row.type==="payment"?"-":"+"}{ fmtKES(row.amount) }
                      </b>
                    </td>
                    <td style={tdS}>
                      <span style={{ fontWeight:700, color:row.runningBalance>0?"#dc2626":"#059669" }}>{fmtKES(row.runningBalance)}</span>
                    </td>
                    <td style={tdS}>{row.status ? <Badge status={row.status}/> : <span style={{ fontFamily:"monospace", fontSize:11, color:"#059669" }}>{row.ref}</span>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  };

  // ════════════════════════════════════════════════════════════════════════════
  //  TAB 4 — BULK ACTIONS
  // ════════════════════════════════════════════════════════════════════════════
  const BulkTab = () => {
    const [bulkArea,   setBulkArea]   = useState("all");
    const [bulkStatus, setBulkStatus] = useState("all");
    const [bulkType,   setBulkType]   = useState("all");

    const bulkFiltered = users.filter(u=>{
      const ma = bulkArea==="all"   || u.area===bulkArea;
      const ms = bulkStatus==="all" || u.status===bulkStatus;
      const mt = bulkType==="all"   || (u.type||"residential")===bulkType;
      return ma && ms && mt;
    });

    const runBulk = (action) => {
      const ids = bulkFiltered.map(u=>u.id);
      if (action==="activate")   { setUsers(users.map(u=>ids.includes(u.id)?{...u,status:"active"}:u));   showToast(`${ids.length} customers activated`); }
      if (action==="deactivate") { setUsers(users.map(u=>ids.includes(u.id)?{...u,status:"inactive"}:u)); showToast(`${ids.length} customers deactivated`); }
    };

    // Export CSV
    const exportCSV = () => {
      const header = "Name,Meter No,Email,Phone,Area,Type,Status,Join Date,Balance\n";
      const rows = bulkFiltered.map(u=>
        [u.name, u.meterNo, u.email, u.phone, u.area, u.type||"residential", u.status, u.joinDate, balance(u.id)].join(",")
      ).join("\n");
      const blob = new Blob([header+rows], { type:"text/csv" });
      const a = document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download=`h2o_customers_${today()}.csv`; a.click();
      showToast("CSV exported!");
    };

    return (
      <div>
        <div style={{ background:"#fff8e1", borderRadius:14, padding:"14px 18px", marginBottom:20, display:"flex", alignItems:"center", gap:12, border:"1px solid #fde68a" }}>
          <Icon name="warn" size={20} color="#f59e0b"/>
          <div style={{ fontSize:13, color:"#92400e" }}>
            <b>Bulk actions apply to filtered results below.</b> Use the filters to select a subset before running any action.
          </div>
        </div>

        {/* Filters */}
        <div style={{ ...card, marginBottom:16 }}>
          <h3 style={{ margin:"0 0 14px", fontSize:15, color:"#0a2540", fontWeight:800 }}>🎯 Filter Target Group</h3>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:12 }}>
            {[
              { label:"Area",   val:bulkArea,   set:setBulkArea,   opts:["all",...AREAS]          },
              { label:"Status", val:bulkStatus, set:setBulkStatus, opts:["all","active","inactive"] },
              { label:"Type",   val:bulkType,   set:setBulkType,   opts:["all",...CUSTOMER_TYPES] },
            ].map(f=>(
              <div key={f.label}>
                <label style={lbl}>{f.label}</label>
                <select value={f.val} onChange={e=>f.set(e.target.value)} style={{ ...inp }}>
                  {f.opts.map(o=><option key={o} value={o}>{o==="all"?"All "+f.label+"s":o.charAt(0).toUpperCase()+o.slice(1)}</option>)}
                </select>
              </div>
            ))}
          </div>
          <div style={{ marginTop:14, padding:"12px 16px", background:"#f0f7ff", borderRadius:10, fontSize:14, fontWeight:700, color:"#0a2540" }}>
            ✅ {bulkFiltered.length} customer{bulkFiltered.length!==1?"s":""} match this filter
          </div>
        </div>

        {/* Action cards */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))", gap:14, marginBottom:20 }}>
          {[
            { title:"✅ Activate All",    desc:`Mark all ${bulkFiltered.length} filtered customers as Active.`,   action:()=>runBulk("activate"),   style:sGrn },
            { title:"🚫 Deactivate All",  desc:`Mark all ${bulkFiltered.length} filtered customers as Inactive.`, action:()=>runBulk("deactivate"), style:sDng },
            { title:"📥 Export to CSV",   desc:`Download ${bulkFiltered.length} customer records as a CSV file.`,  action:exportCSV,                 style:sPrim },
          ].map(a=>(
            <div key={a.title} style={{ ...card }}>
              <div style={{ fontWeight:800, color:"#0a2540", fontSize:15, marginBottom:6 }}>{a.title}</div>
              <div style={{ fontSize:13, color:"#6b8fa8", marginBottom:14 }}>{a.desc}</div>
              <button onClick={a.action} style={{ ...a.style, width:"100%", justifyContent:"center" }}>{a.title.split(" ").slice(1).join(" ")}</button>
            </div>
          ))}
        </div>

        {/* Preview table */}
        <div style={{ ...card, overflow:"hidden", padding:0 }}>
          <div style={{ padding:"14px 18px", borderBottom:"1px solid #f0f7ff", fontWeight:700, color:"#0a2540", fontSize:14 }}>
            Preview: {bulkFiltered.length} customers in current filter
          </div>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
              <thead><tr style={{ background:"#f8fbff" }}>
                {["Customer","Meter No","Area","Type","Status","Balance"].map(h=><th key={h} style={th}>{h}</th>)}
              </tr></thead>
              <tbody>
                {bulkFiltered.length===0 && <tr><td colSpan={6} style={{ textAlign:"center", padding:32, color:"#94a8b8" }}>No customers match the filter.</td></tr>}
                {bulkFiltered.map((u,i)=>(
                  <tr key={u.id} style={{ borderBottom:"1px solid #f0f7ff", background:i%2===0?"#fff":"#fafcff" }}>
                    <td style={tdS}><div style={{ fontWeight:700, color:"#0a2540" }}>{u.name}</div><div style={{ fontSize:11, color:"#94a8b8" }}>{u.email}</div></td>
                    <td style={tdS}><span style={{ fontFamily:"monospace", color:"#0077b6", fontWeight:700 }}>{u.meterNo}</span></td>
                    <td style={tdS}>{u.area}</td>
                    <td style={tdS}><TypeBadge type={u.type||"residential"}/></td>
                    <td style={tdS}><Badge status={u.status}/></td>
                    <td style={tdS}><span style={{ fontWeight:700, color:balance(u.id)>0?"#dc2626":"#059669" }}>{balance(u.id)>0?`-${fmtKES(balance(u.id))}`:"Clear"}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  };

  // ════════════════════════════════════════════════════════════════════════════
  //  MODALS
  // ════════════════════════════════════════════════════════════════════════════
  const AddEditModal = () => (
    <Modal title={editId?"Edit Customer":"Add New Customer"} onClose={()=>setModal(null)} wide>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 16px" }}>
        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Full Name *</label>
          <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} style={inp} placeholder="e.g. James Mwangi"/>
        </div>
        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Meter Number *</label>
          <input value={form.meterNo} onChange={e=>setForm(f=>({...f,meterNo:e.target.value}))} style={inp} placeholder="MTR-XXXX"/>
        </div>
        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Phone</label>
          <input type="tel" value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} style={inp} placeholder="07XX XXX XXX"/>
        </div>
        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Email</label>
          <input type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} style={inp}/>
        </div>
        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Area</label>
          <select value={form.area} onChange={e=>setForm(f=>({...f,area:e.target.value}))} style={inp}>
            {AREAS.map(a=><option key={a}>{a}</option>)}
          </select>
        </div>
        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Customer Type</label>
          <select value={form.type||"residential"} onChange={e=>setForm(f=>({...f,type:e.target.value}))} style={inp}>
            {CUSTOMER_TYPES.map(t=><option key={t} value={t}>{t.charAt(0).toUpperCase()+t.slice(1)}</option>)}
          </select>
        </div>
        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Join Date</label>
          <input type="date" value={form.joinDate} onChange={e=>setForm(f=>({...f,joinDate:e.target.value}))} style={inp}/>
        </div>
        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Status</label>
          <select value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))} style={inp}>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        {!editId && (
          <div style={{ marginBottom:14 }}>
            <label style={lbl}>Password</label>
            <input type="password" value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))} style={inp} placeholder="Min 6 chars"/>
          </div>
        )}
      </div>
      <div style={{ marginBottom:14 }}>
        <label style={lbl}>Address</label>
        <input value={form.address} onChange={e=>setForm(f=>({...f,address:e.target.value}))} style={inp} placeholder="Full physical address"/>
      </div>
      <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
        <button onClick={()=>setModal(null)} style={sSec}>Cancel</button>
        <button onClick={saveCustomer} style={sPrim}><Icon name="check" size={14} color="#fff"/> {editId?"Save Changes":"Add Customer"}</button>
      </div>
    </Modal>
  );

  // ── RENDER ─────────────────────────────────────────────────────────────────
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20, flexWrap:"wrap", gap:12 }}>
        <div>
          <h2 style={{ fontFamily:"'Playfair Display',serif", color:"#0a2540", fontSize:22, fontWeight:800, margin:0 }}>Customer Management</h2>
          <p style={{ color:"#6b8fa8", fontSize:13, margin:"4px 0 0" }}>Full customer profiles, account activity, bulk actions</p>
        </div>
        <button onClick={openAdd} style={sPrim}><Icon name="plus" size={15} color="#fff"/> Add Customer</button>
      </div>

      <TabBar/>
      {tab==="directory" && <DirectoryTab/>}
      {tab==="profile"   && <ProfileTab/>}
      {tab==="activity"  && <ActivityTab/>}
      {tab==="bulk"      && <BulkTab/>}

      {modal==="add"  && <AddEditModal/>}
      {modal==="edit" && <AddEditModal/>}
    </div>
  );
};

// ════════════════════════════════════════════════════════════════════════════
//  MODULE 7 — NOTIFICATIONS & ALERTS
// ════════════════════════════════════════════════════════════════════════════
const NOTIF_STORAGE_KEY = "aq_notifications";

// seed notifications
const SEED_NOTIFS = [
  { id:"n1", type:"overdue",   title:"Overdue Bill Alert",         body:"James Mwangi (MTR-0041) — April 2025 bill of KES 6,950 is overdue.",    target:"all",   userId:"u1", date:"2025-05-16", read:false, priority:"high"   },
  { id:"n2", type:"payment",   title:"Payment Received",           body:"Fatuma Hassan paid KES 4,400 for January 2025 via M-Pesa (MPE456789).",  target:"u2",    userId:"u2", date:"2025-05-14", read:true,  priority:"normal" },
  { id:"n3", type:"bill",      title:"New Bill Generated",         body:"Grace Wanjiku's April 2025 bill of KES 4,250 has been generated.",        target:"u4",    userId:"u4", date:"2025-05-13", read:false, priority:"normal" },
  { id:"n4", type:"meter",     title:"Faulty Meter Reported",      body:"MTR-0078 in Parklands has been flagged as faulty. Technician dispatched.",target:"admin", userId:null, date:"2025-05-12", read:false, priority:"high"   },
  { id:"n5", type:"system",    title:"Monthly Billing Cycle Done", body:"May 2025 billing cycle completed. 3 bills generated, 1 skipped.",         target:"admin", userId:null, date:"2025-05-10", read:true,  priority:"normal" },
  { id:"n6", type:"overdue",   title:"Overdue Bill Alert",         body:"Fatuma Hassan (MTR-0057) — April 2025 bill of KES 9,925 is overdue.",    target:"all",   userId:"u2", date:"2025-05-09", read:false, priority:"high"   },
  { id:"n7", type:"announcement", title:"Water Maintenance Notice",body:"Scheduled maintenance on May 20, 2025. Westlands may experience outage 8AM–12PM.", target:"all", userId:null, date:"2025-05-08", read:true, priority:"normal" },
];

const NotificationsModule = ({ store, showToast, currentUser }) => {
  const { users, bills, payments, meters } = store;

  // ── State ──────────────────────────────────────────────────────────────────
  const [notifs, setNotifsRaw] = useState(() => {
    try { return JSON.parse(localStorage.getItem(NOTIF_STORAGE_KEY)) || SEED_NOTIFS; } catch { return SEED_NOTIFS; }
  });
  const saveNotifs = n => { localStorage.setItem(NOTIF_STORAGE_KEY, JSON.stringify(n)); setNotifsRaw(n); };

  const [tab,        setTab]        = useState("inbox");
  const [composeOpen,setComposeOpen]= useState(false);
  const [filterType, setFilterType] = useState("all");
  const [filterRead, setFilterRead] = useState("all");
  const [viewNotif,  setViewNotif]  = useState(null);

  // Compose form state
  const blankMsg = { title:"", body:"", type:"announcement", target:"all", priority:"normal", userId:"" };
  const [msg, setMsg] = useState(blankMsg);

  // ── Helpers ────────────────────────────────────────────────────────────────
  const isAdmin   = !currentUser;  // admin has no currentUser
  const myNotifs  = isAdmin
    ? notifs
    : notifs.filter(n => n.target==="all" || n.target===currentUser?.id);

  const filtered = myNotifs.filter(n => {
    const matchT = filterType==="all" || n.type===filterType;
    const matchR = filterRead==="all" || (filterRead==="unread"?!n.read:n.read);
    return matchT && matchR;
  });

  const unreadCount = myNotifs.filter(n=>!n.read).length;

  const markRead   = id => saveNotifs(notifs.map(n=>n.id===id?{...n,read:true}:n));
  const markAll    = ()  => saveNotifs(notifs.map(n=>({ ...n, read:true })));
  const deleteNotif= id => { saveNotifs(notifs.filter(n=>n.id!==id)); showToast("Notification deleted"); };
  const sendNotif  = () => {
    if (!msg.title||!msg.body) return showToast("Title and message are required","error");
    const nn = { id:uid(), ...msg, date:today(), read:false };
    saveNotifs([nn, ...notifs]);
    showToast("Notification sent!");
    setMsg(blankMsg); setComposeOpen(false);
  };

  // ── Auto-generate system alerts from live data ─────────────────────────────
  const autoAlerts = useMemo(() => {
    const alerts = [];
    // Overdue bills not yet notified
    bills.filter(b=>b.status==="overdue").forEach(b=>{
      const u = users.find(x=>x.id===b.userId);
      const exists = notifs.some(n=>n.type==="overdue"&&n.userId===b.userId&&n.body?.includes(MONTHS[b.month-1]));
      if (!exists && u) alerts.push({ type:"overdue", priority:"high", title:"Overdue Bill", body:`${u.name} — ${MONTHS[b.month-1]} bill of ${fmtKES(b.amount||b.totalAmount||0)} is overdue.`, userId:b.userId });
    });
    // Faulty meters
    meters.filter(m=>m.status==="faulty").forEach(m=>{
      const exists = notifs.some(n=>n.type==="meter"&&n.body?.includes(m.meterNo));
      if (!exists) alerts.push({ type:"meter", priority:"high", title:"Faulty Meter", body:`${m.meterNo} in ${m.area} flagged as faulty. ${m.notes||""}`, userId:null });
    });
    return alerts;
  }, [bills, meters, notifs, users]);

  const sendAutoAlert = a => {
    const nn = { id:uid(), ...a, target: a.userId||"admin", date:today(), read:false };
    saveNotifs([nn,...notifs]);
    showToast(`Alert sent: ${a.title}`);
  };

  // ── Type config ────────────────────────────────────────────────────────────
  const typeConf = {
    overdue:      { label:"Overdue",      emoji:"⚠️",  bg:"#fee2e2", color:"#991b1b",  border:"#fca5a5" },
    payment:      { label:"Payment",      emoji:"💳",  bg:"#d1fae5", color:"#065f46",  border:"#6ee7b7" },
    bill:         { label:"Bill",         emoji:"🧾",  bg:"#dbeafe", color:"#1e40af",  border:"#93c5fd" },
    meter:        { label:"Meter",        emoji:"🔧",  bg:"#fef3c7", color:"#92400e",  border:"#fde68a" },
    system:       { label:"System",       emoji:"⚙️",  bg:"#ede9fe", color:"#5b21b6",  border:"#c4b5fd" },
    announcement: { label:"Announcement", emoji:"📢",  bg:"#f0f9ff", color:"#0c4a6e",  border:"#7dd3fc" },
  };
  const tc = t => typeConf[t] || typeConf.system;

  // ── Local styles ───────────────────────────────────────────────────────────
  const card  = { background:"#fff", borderRadius:18, padding:20, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" };
  const sPrim = { background:"linear-gradient(135deg,#0077b6,#00b4d8)", color:"#fff", border:"none", borderRadius:10, padding:"9px 18px", fontWeight:700, fontSize:13, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:7 };
  const sSec  = { background:"#f0f7ff", color:"#0077b6", border:"1.5px solid #dde8f0", borderRadius:10, padding:"9px 16px", fontWeight:700, fontSize:13, cursor:"pointer" };
  const sDng  = { background:"none", color:"#dc2626", border:"none", borderRadius:8, padding:"5px 10px", fontWeight:700, fontSize:12, cursor:"pointer" };
  const inp   = { width:"100%", padding:"10px 14px", border:"1.5px solid #dde8f0", borderRadius:10, fontSize:14, color:"#0a2540", background:"#f8fbff", outline:"none", boxSizing:"border-box" };
  const lbl   = { display:"block", fontSize:11, fontWeight:700, color:"#5b8fa8", marginBottom:5, textTransform:"uppercase", letterSpacing:"0.08em" };

  // ── TAB BAR ────────────────────────────────────────────────────────────────
  const TabBar = () => (
    <div style={{ display:"flex", gap:4, background:"#f0f7ff", borderRadius:12, padding:4, marginBottom:22, flexWrap:"wrap" }}>
      {[
        { id:"inbox",     label:"📥 Inbox"             },
        { id:"alerts",    label:"⚡ Smart Alerts"       },
        ...(isAdmin ? [
          { id:"compose",   label:"✉️ Compose & Send"   },
          { id:"templates", label:"📝 Templates"        },
        ] : []),
      ].map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)}
          style={{ padding:"8px 16px", borderRadius:9, border:"none", cursor:"pointer", fontWeight:700, fontSize:13, transition:"all .2s",
            background:tab===t.id?"#0077b6":"transparent", color:tab===t.id?"#fff":"#5b8fa8" }}>
          {t.label}
          {t.id==="inbox" && unreadCount>0 && <span style={{ marginLeft:6, background:"#dc2626", color:"#fff", borderRadius:10, padding:"1px 7px", fontSize:11, fontWeight:800 }}>{unreadCount}</span>}
          {t.id==="alerts" && autoAlerts.length>0 && <span style={{ marginLeft:6, background:"#f59e0b", color:"#fff", borderRadius:10, padding:"1px 7px", fontSize:11, fontWeight:800 }}>{autoAlerts.length}</span>}
        </button>
      ))}
    </div>
  );

  // ── INBOX TAB ──────────────────────────────────────────────────────────────
  const InboxTab = () => (
    <>
      {/* Stats strip */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))", gap:12, marginBottom:18 }}>
        {[
          { label:"Total",    value:myNotifs.length,                          bg:"#f0f7ff", color:"#0077b6" },
          { label:"Unread",   value:unreadCount,                              bg:"#fee2e2", color:"#dc2626" },
          { label:"High Pri", value:myNotifs.filter(n=>n.priority==="high").length, bg:"#fef3c7", color:"#f59e0b" },
          { label:"Read",     value:myNotifs.filter(n=>n.read).length,        bg:"#d1fae5", color:"#059669" },
        ].map(s=>(
          <div key={s.label} style={{ background:s.bg, borderRadius:12, padding:"12px 16px", textAlign:"center" }}>
            <div style={{ fontWeight:800, fontSize:22, color:s.color }}>{s.value}</div>
            <div style={{ fontSize:11, color:"#94a8b8", fontWeight:600, textTransform:"uppercase" }}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Filter bar */}
      <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap", alignItems:"center" }}>
        <select value={filterType} onChange={e=>setFilterType(e.target.value)}
          style={{ padding:"8px 14px", border:"1.5px solid #dde8f0", borderRadius:10, fontSize:13, color:"#0a2540", background:"#fff", cursor:"pointer" }}>
          <option value="all">All Types</option>
          {Object.entries(typeConf).map(([k,v])=><option key={k} value={k}>{v.emoji} {v.label}</option>)}
        </select>
        <select value={filterRead} onChange={e=>setFilterRead(e.target.value)}
          style={{ padding:"8px 14px", border:"1.5px solid #dde8f0", borderRadius:10, fontSize:13, color:"#0a2540", background:"#fff", cursor:"pointer" }}>
          <option value="all">All Messages</option>
          <option value="unread">Unread Only</option>
          <option value="read">Read Only</option>
        </select>
        {unreadCount>0 && (
          <button onClick={markAll} style={{ ...sSec, marginLeft:"auto" }}>
            <Icon name="check" size={14} color="#0077b6"/> Mark All Read
          </button>
        )}
      </div>

      {/* Notification list */}
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {filtered.length===0 && (
          <div style={{ ...card, textAlign:"center", padding:48 }}>
            <div style={{ fontSize:40, marginBottom:12 }}>📭</div>
            <div style={{ fontWeight:700, color:"#94a8b8", fontSize:16 }}>No notifications found</div>
          </div>
        )}
        {filtered.map(n=>{
          const t = tc(n.type);
          const u = n.userId ? users.find(x=>x.id===n.userId) : null;
          return (
            <div key={n.id} onClick={()=>{ markRead(n.id); setViewNotif(n); }}
              style={{ ...card, cursor:"pointer", borderLeft:`4px solid ${t.border}`,
                background:n.read?"#fff":"#f8fbff",
                boxShadow: n.read?"0 1px 8px rgba(10,37,64,0.04)":"0 2px 16px rgba(10,37,64,0.1)",
                transition:"all .15s" }}>
              <div style={{ display:"flex", alignItems:"flex-start", gap:14 }}>
                {/* Icon */}
                <div style={{ background:t.bg, borderRadius:12, width:44, height:44, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0 }}>
                  {t.emoji}
                </div>
                {/* Content */}
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8, flexWrap:"wrap" }}>
                    <div style={{ fontWeight:n.read?600:800, color:"#0a2540", fontSize:14 }}>{n.title}</div>
                    <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
                      {n.priority==="high" && <span style={{ background:"#fee2e2", color:"#dc2626", borderRadius:6, padding:"2px 8px", fontSize:11, fontWeight:700 }}>HIGH</span>}
                      <span style={{ background:t.bg, color:t.color, borderRadius:6, padding:"2px 8px", fontSize:11, fontWeight:700 }}>{t.label}</span>
                      {!n.read && <div style={{ width:9, height:9, borderRadius:"50%", background:"#0077b6", flexShrink:0 }}/>}
                    </div>
                  </div>
                  <div style={{ fontSize:13, color:"#6b7280", marginTop:4, lineHeight:1.5 }}>{n.body}</div>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:8 }}>
                    <div style={{ display:"flex", gap:12, fontSize:12, color:"#94a8b8" }}>
                      <span>📅 {n.date}</span>
                      {u && <span>👤 {u.name}</span>}
                      <span>🎯 {n.target==="all"?"All Customers":n.target==="admin"?"Admin only":"Direct"}</span>
                    </div>
                    {isAdmin && (
                      <button onClick={e=>{ e.stopPropagation(); deleteNotif(n.id); }} style={sDng}>
                        <Icon name="trash" size={13} color="#dc2626"/> Delete
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Notification detail modal */}
      {viewNotif && (() => {
        const t = tc(viewNotif.type);
        const u = viewNotif.userId ? users.find(x=>x.id===viewNotif.userId) : null;
        return (
          <Modal title="Notification Detail" onClose={()=>setViewNotif(null)}>
            <div style={{ background:t.bg, borderRadius:14, padding:18, marginBottom:16, border:`1px solid ${t.border}` }}>
              <div style={{ fontSize:32, marginBottom:8 }}>{t.emoji}</div>
              <div style={{ fontWeight:800, color:"#0a2540", fontSize:18, marginBottom:6 }}>{viewNotif.title}</div>
              <div style={{ fontSize:14, color:"#374151", lineHeight:1.7 }}>{viewNotif.body}</div>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16, fontSize:13 }}>
              {[
                { label:"Date",     value:viewNotif.date },
                { label:"Type",     value:t.label },
                { label:"Priority", value:viewNotif.priority.charAt(0).toUpperCase()+viewNotif.priority.slice(1) },
                { label:"Target",   value:viewNotif.target==="all"?"All Customers":viewNotif.target==="admin"?"Admin Only":"Direct Message" },
                ...(u ? [{ label:"Customer", value:`${u.name} (${u.meterNo})` }] : []),
                { label:"Status", value:viewNotif.read?"✓ Read":"● Unread" },
              ].map(f=>(
                <div key={f.label} style={{ background:"#f8fbff", borderRadius:10, padding:"10px 14px" }}>
                  <div style={{ fontSize:10, color:"#5b8fa8", fontWeight:700, textTransform:"uppercase", marginBottom:3 }}>{f.label}</div>
                  <div style={{ fontWeight:700, color:"#0a2540", fontSize:13 }}>{f.value}</div>
                </div>
              ))}
            </div>
            <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
              {isAdmin && <button onClick={()=>{ deleteNotif(viewNotif.id); setViewNotif(null); }} style={{ ...sSec, color:"#dc2626", borderColor:"#fca5a5" }}>Delete</button>}
              <button onClick={()=>setViewNotif(null)} style={sPrim}>Close</button>
            </div>
          </Modal>
        );
      })()}
    </>
  );

  // ── SMART ALERTS TAB ───────────────────────────────────────────────────────
  const AlertsTab = () => (
    <div>
      <div style={{ background:"linear-gradient(135deg,#0a2540,#0077b6)", borderRadius:18, padding:22, color:"#fff", marginBottom:20 }}>
        <div style={{ display:"flex", alignItems:"center", gap:14 }}>
          <div style={{ fontSize:36 }}>⚡</div>
          <div>
            <div style={{ fontWeight:800, fontSize:17 }}>Smart Alert Engine</div>
            <div style={{ opacity:0.75, fontSize:13, marginTop:3 }}>Auto-detected issues from live data — review and send with one click.</div>
          </div>
        </div>
      </div>

      {autoAlerts.length===0 ? (
        <div style={{ ...card, textAlign:"center", padding:48 }}>
          <div style={{ fontSize:44, marginBottom:12 }}>✅</div>
          <div style={{ fontWeight:800, color:"#059669", fontSize:16 }}>No pending smart alerts!</div>
          <div style={{ color:"#94a8b8", fontSize:13, marginTop:6 }}>All overdue bills and meter faults have been notified.</div>
        </div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          {autoAlerts.map((a,i)=>{
            const t = tc(a.type);
            const u = a.userId ? users.find(x=>x.id===a.userId) : null;
            return (
              <div key={i} style={{ ...card, borderLeft:`4px solid ${t.border}` }}>
                <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, flexWrap:"wrap" }}>
                  <div style={{ display:"flex", gap:14, flex:1 }}>
                    <div style={{ background:t.bg, borderRadius:12, width:44, height:44, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0 }}>
                      {t.emoji}
                    </div>
                    <div>
                      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                        <b style={{ color:"#0a2540", fontSize:14 }}>{a.title}</b>
                        <span style={{ background:"#fee2e2", color:"#dc2626", borderRadius:6, padding:"2px 8px", fontSize:11, fontWeight:700 }}>AUTO-DETECTED</span>
                      </div>
                      <div style={{ fontSize:13, color:"#6b7280", lineHeight:1.5 }}>{a.body}</div>
                      {u && <div style={{ fontSize:12, color:"#94a8b8", marginTop:4 }}>Customer: {u.name} · {u.phone}</div>}
                    </div>
                  </div>
                  <button onClick={()=>sendAutoAlert(a)} style={{ ...sPrim, flexShrink:0 }}>
                    <Icon name="bell" size={14} color="#fff"/> Send Alert
                  </button>
                </div>
              </div>
            );
          })}

          <div style={{ display:"flex", justifyContent:"flex-end" }}>
            <button onClick={()=>{ autoAlerts.forEach(a=>sendAutoAlert(a)); }}
              style={{ ...sPrim, background:"linear-gradient(135deg,#dc2626,#f87171)" }}>
              <Icon name="bell" size={15} color="#fff"/> Send All {autoAlerts.length} Alerts
            </button>
          </div>
        </div>
      )}
    </div>
  );

  // ── COMPOSE TAB (admin only) ────────────────────────────────────────────────
  const ComposeTab = () => (
    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))", gap:16 }}>
      {/* Compose form */}
      <div style={{ ...card }}>
        <h3 style={{ margin:"0 0 18px", fontSize:15, color:"#0a2540", fontWeight:800 }}>✉️ Send Notification</h3>

        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Notification Type</label>
          <select value={msg.type} onChange={e=>setMsg(m=>({...m,type:e.target.value}))} style={inp}>
            {Object.entries(typeConf).map(([k,v])=><option key={k} value={k}>{v.emoji} {v.label}</option>)}
          </select>
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Send To</label>
          <select value={msg.target} onChange={e=>setMsg(m=>({...m,target:e.target.value,userId:""}))} style={inp}>
            <option value="all">📢 All Customers</option>
            <option value="admin">🛡️ Admin Only</option>
            <option value="specific">👤 Specific Customer</option>
          </select>
        </div>

        {msg.target==="specific" && (
          <div style={{ marginBottom:14 }}>
            <label style={lbl}>Select Customer</label>
            <select value={msg.userId} onChange={e=>setMsg(m=>({...m,userId:e.target.value}))} style={inp}>
              <option value="">— Choose Customer —</option>
              {users.map(u=><option key={u.id} value={u.id}>{u.name} ({u.meterNo})</option>)}
            </select>
          </div>
        )}

        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Priority</label>
          <div style={{ display:"flex", gap:10 }}>
            {["normal","high"].map(p=>(
              <button key={p} onClick={()=>setMsg(m=>({...m,priority:p}))}
                style={{ flex:1, padding:"9px", border:`2px solid ${msg.priority===p?(p==="high"?"#dc2626":"#0077b6"):"#dde8f0"}`,
                  borderRadius:10, fontWeight:700, fontSize:13, cursor:"pointer",
                  background: msg.priority===p?(p==="high"?"#fee2e2":"#dbeafe"):"#f8fbff",
                  color: msg.priority===p?(p==="high"?"#dc2626":"#0077b6"):"#6b7280" }}>
                {p==="high"?"🔴 High":"🔵 Normal"}
              </button>
            ))}
          </div>
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={lbl}>Title *</label>
          <input value={msg.title} onChange={e=>setMsg(m=>({...m,title:e.target.value}))} style={inp} placeholder="e.g. Water Interruption Notice"/>
        </div>

        <div style={{ marginBottom:16 }}>
          <label style={lbl}>Message *</label>
          <textarea value={msg.body} onChange={e=>setMsg(m=>({...m,body:e.target.value}))} style={{ ...inp, resize:"vertical", minHeight:100 }}
            placeholder="Type your full message here…"/>
        </div>

        {/* Live preview */}
        {(msg.title||msg.body) && (
          <div style={{ background:tc(msg.type).bg, borderRadius:14, padding:16, marginBottom:16, border:`1px solid ${tc(msg.type).border}` }}>
            <div style={{ fontSize:11, color:tc(msg.type).color, fontWeight:700, textTransform:"uppercase", marginBottom:6 }}>PREVIEW</div>
            <div style={{ display:"flex", gap:10, alignItems:"flex-start" }}>
              <span style={{ fontSize:22 }}>{tc(msg.type).emoji}</span>
              <div>
                <div style={{ fontWeight:800, color:"#0a2540", fontSize:14 }}>{msg.title||"(no title)"}</div>
                <div style={{ fontSize:13, color:"#374151", marginTop:4, lineHeight:1.5 }}>{msg.body||"(no message)"}</div>
                <div style={{ fontSize:11, color:"#94a8b8", marginTop:6 }}>
                  To: {msg.target==="all"?"All Customers":msg.target==="admin"?"Admin Only":users.find(u=>u.id===msg.userId)?.name||"—"} · {today()}
                </div>
              </div>
            </div>
          </div>
        )}

        <button onClick={sendNotif} style={{ ...sPrim, width:"100%", justifyContent:"center", padding:12 }}>
          <Icon name="bell" size={16} color="#fff"/> Send Notification
        </button>
      </div>

      {/* Recent sent */}
      <div style={{ ...card }}>
        <h3 style={{ margin:"0 0 16px", fontSize:15, color:"#0a2540", fontWeight:800 }}>📤 Recently Sent</h3>
        {notifs.slice(0,8).map(n=>{
          const t = tc(n.type);
          return (
            <div key={n.id} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"10px 0", borderBottom:"1px solid #f0f7ff" }}>
              <div style={{ background:t.bg, borderRadius:8, width:34, height:34, display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, flexShrink:0 }}>{t.emoji}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontWeight:700, fontSize:13, color:"#0a2540", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{n.title}</div>
                <div style={{ fontSize:12, color:"#94a8b8" }}>{n.date} · {n.target==="all"?"All":n.target==="admin"?"Admin":"Direct"}</div>
              </div>
              {n.priority==="high" && <span style={{ background:"#fee2e2", color:"#dc2626", borderRadius:6, padding:"2px 6px", fontSize:10, fontWeight:700, flexShrink:0 }}>HIGH</span>}
            </div>
          );
        })}
      </div>
    </div>
  );

  // ── TEMPLATES TAB (admin only) ─────────────────────────────────────────────
  const TemplatesTab = () => {
    const templates = [
      { icon:"⚠️", name:"Overdue Reminder",      type:"overdue",      body:"Dear [Customer Name], your bill of [Amount] for [Month] is overdue. Please pay immediately to avoid a late penalty. Pay via M-Pesa Paybill XXXXXX, Account: [Meter No]." },
      { icon:"💳", name:"Payment Confirmation",   type:"payment",      body:"Dear [Customer Name], we have received your payment of [Amount] for your [Month] bill. Your account is now up to date. Thank you." },
      { icon:"🧾", name:"New Bill Ready",         type:"bill",         body:"Dear [Customer Name], your water bill for [Month] is ready. Amount due: [Amount]. Due date: [Due Date]. Pay early to avoid penalties." },
      { icon:"🔧", name:"Meter Maintenance",      type:"meter",        body:"Dear Customer, a technician will visit on [Date] to inspect your meter [Meter No]. Please ensure access is available between 8AM–5PM." },
      { icon:"📢", name:"Service Interruption",   type:"announcement", body:"Dear Customer, scheduled maintenance will affect water supply in [Area] on [Date] from [Time] to [Time]. We apologise for the inconvenience." },
      { icon:"🎉", name:"Welcome New Customer",   type:"announcement", body:"Welcome to H2O Water Limited! Your account is now active. Meter No: [Meter No]. Bills are generated monthly and due on the 15th. Contact us for any queries." },
      { icon:"⚙️", name:"Rate Change Notice",     type:"system",       body:"Dear Customer, please note that water tariff rates will change effective [Date]. New rate: KES [Amount]/m³. For details, contact our offices." },
      { icon:"💧", name:"Conservation Alert",     type:"announcement", body:"Dear Customer, your water usage this month ([Amount] m³) is above average. Please check for leaks and practice water conservation. Thank you." },
    ];

    return (
      <div>
        <div style={{ background:"#f0f7ff", borderRadius:14, padding:"14px 18px", marginBottom:20, fontSize:13, color:"#5b8fa8" }}>
          💡 Click <b>"Use Template"</b> to pre-fill the compose form. Replace <b>[placeholders]</b> with actual values before sending.
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))", gap:14 }}>
          {templates.map((t,i)=>{
            const conf = tc(t.type);
            return (
              <div key={i} style={{ ...card, borderTop:`3px solid ${conf.border}` }}>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
                  <span style={{ fontSize:22 }}>{t.icon}</span>
                  <div>
                    <div style={{ fontWeight:800, color:"#0a2540", fontSize:14 }}>{t.name}</div>
                    <span style={{ background:conf.bg, color:conf.color, borderRadius:6, padding:"2px 8px", fontSize:11, fontWeight:700 }}>{conf.label}</span>
                  </div>
                </div>
                <div style={{ fontSize:12, color:"#6b7280", lineHeight:1.6, marginBottom:12, background:"#f8fbff", borderRadius:8, padding:"10px 12px" }}>
                  {t.body}
                </div>
                <button onClick={()=>{ setMsg(m=>({...m,type:t.type,body:t.body,title:t.name})); setTab("compose"); }}
                  style={{ ...sPrim, width:"100%", justifyContent:"center", fontSize:12, padding:"8px" }}>
                  Use Template →
                </button>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // ── RENDER ─────────────────────────────────────────────────────────────────
  return (
    <div>
      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20, flexWrap:"wrap", gap:12 }}>
        <div>
          <h2 style={{ fontFamily:"'Playfair Display',serif", color:"#0a2540", fontSize:22, fontWeight:800, margin:0 }}>
            Notifications & Alerts
          </h2>
          <p style={{ color:"#6b8fa8", fontSize:13, margin:"4px 0 0" }}>
            {isAdmin ? "Send alerts, manage inbox and auto-detect issues from live data" : "Your account notifications and messages"}
          </p>
        </div>
        {isAdmin && (
          <button onClick={()=>setTab("compose")} style={sPrim}>
            <Icon name="bell" size={15} color="#fff"/> + Send Notification
          </button>
        )}
      </div>

      <TabBar/>
      {tab==="inbox"     && <InboxTab/>}
      {tab==="alerts"    && <AlertsTab/>}
      {tab==="compose"   && isAdmin && <ComposeTab/>}
      {tab==="templates" && isAdmin && <TemplatesTab/>}
    </div>
  );
};

//  MODULE 8 — SYSTEM SETTINGS & CONFIGURATION
// ════════════════════════════════════════════════════════════════════════════

const DEFAULT_SETTINGS = {
  // Company profile
  company: {

    phone:       "+254 700 000 000",

  admins: [
