<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H2O Water Limited – AquaFlow Billing System</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f1a;--sidebar:#111827;--card:#161d2e;--card2:#1e2840;
  --border:#2a3550;--accent:#00c2ff;--accent2:#0077ff;--green:#22c55e;
  --red:#ef4444;--yellow:#f59e0b;--purple:#8b5cf6;
  --text:#e8edf5;--muted:#6b7a99;--white:#fff;
  --radius:12px;--font:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
.hidden{display:none!important;}

/* ─── SPLASH ─── */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.splash-logo{font-size:4rem;margin-bottom:1rem;animation:pulse 1.5s infinite;}
.splash-title{font-size:2rem;font-weight:700;color:var(--accent);letter-spacing:-1px;}
.splash-sub{color:var(--muted);margin-top:.5rem;font-size:.95rem;}
.splash-bar{width:240px;height:4px;background:var(--card2);border-radius:4px;margin-top:2rem;overflow:hidden;}
.splash-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:4px;animation:load 1.8s ease forwards;}
@keyframes load{from{width:0}to{width:100%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ─── LOGIN ─── */
#loginPage{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:2rem;
  background:radial-gradient(ellipse at 20% 50%,rgba(0,194,255,.08) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(0,119,255,.06) 0%,transparent 50%),var(--bg);}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:420px;}
.login-logo{text-align:center;margin-bottom:2rem;}
.login-logo .icon{font-size:3rem;display:block;}
.login-logo h1{font-size:1.6rem;font-weight:700;color:var(--accent);margin-top:.5rem;}
.login-logo p{color:var(--muted);font-size:.85rem;margin-top:.25rem;}
.tab-row{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:2rem;gap:4px;}
.tab-btn{flex:1;padding:.6rem;border:none;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;font-family:var(--font);font-weight:600;font-size:.9rem;transition:.2s;}
.tab-btn.active{background:var(--accent2);color:#fff;}
.field{margin-bottom:1.2rem;}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.4rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.field input,.field select{width:100%;padding:.75rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:.95rem;outline:none;transition:.2s;}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,194,255,.1);}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;border:none;border-radius:10px;cursor:pointer;font-family:var(--font);font-weight:600;font-size:.9rem;transition:.2s;text-decoration:none;}
.btn-primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-full{width:100%;justify-content:center;}
.login-err{color:var(--red);font-size:.85rem;text-align:center;margin-top:.75rem;}


/* ─── SHELL ─── */
#appShell{display:flex;min-height:100vh;}
.sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:.3s;}
.sidebar-head{padding:1.5rem 1.2rem 1rem;border-bottom:1px solid var(--border);}
.sidebar-brand{display:flex;align-items:center;gap:.75rem;}
.brand-icon{font-size:1.8rem;}
.brand-text h2{font-size:1rem;font-weight:700;color:var(--accent);}
.brand-text p{font-size:.72rem;color:var(--muted);}
.sidebar-user{margin-top:1rem;background:var(--card2);border-radius:10px;padding:.75rem;display:flex;align-items:center;gap:.75rem;}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0;}
.sidebar-user-info p{font-size:.85rem;font-weight:600;}
.sidebar-user-info span{font-size:.72rem;color:var(--muted);}
.sidebar-nav{padding:1rem .75rem;flex:1;overflow-y:auto;}
.nav-section{margin-bottom:1.2rem;}
.nav-label{font-size:.68rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.5rem .6rem .3rem;}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem .8rem;border-radius:10px;cursor:pointer;color:var(--muted);font-size:.88rem;font-weight:500;transition:.2s;margin-bottom:2px;border:none;background:transparent;width:100%;text-align:left;font-family:var(--font);}
.nav-item:hover{background:var(--card2);color:var(--text);}
.nav-item.active{background:rgba(0,194,255,.12);color:var(--accent);font-weight:600;}
.nav-item .ni{font-size:1.1rem;width:20px;text-align:center;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:.68rem;padding:.15rem .4rem;border-radius:20px;font-weight:700;}
.sidebar-foot{padding:1rem .75rem;border-top:1px solid var(--border);}
.main{margin-left:260px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--sidebar);border-bottom:1px solid var(--border);padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:1.1rem;font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:.75rem;}
.content{padding:1.5rem;flex:1;}

/* ─── CARDS & LAYOUT ─── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;}
.card-title{font-size:.9rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1rem;}
.grid{display:grid;gap:1rem;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;}
.kpi-label{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.kpi-val{font-size:1.8rem;font-weight:700;margin:.3rem 0;line-height:1;}
.kpi-sub{font-size:.78rem;color:var(--muted);}
.kpi-icon{font-size:1.6rem;margin-bottom:.5rem;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.section-title{font-size:1rem;font-weight:700;}

/* ─── TABLE ─── */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;}
th{background:var(--card2);padding:.7rem 1rem;text-align:left;font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
td{padding:.75rem 1rem;border-top:1px solid var(--border);font-size:.88rem;vertical-align:middle;}
tr:hover td{background:rgba(255,255,255,.02);}

/* ─── BADGES ─── */
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.badge-green{background:rgba(34,197,94,.15);color:var(--green);}
.badge-red{background:rgba(239,68,68,.15);color:var(--red);}
.badge-yellow{background:rgba(245,158,11,.15);color:var(--yellow);}
.badge-blue{background:rgba(0,194,255,.15);color:var(--accent);}
.badge-purple{background:rgba(139,92,246,.15);color:var(--purple);}
.badge-gray{background:rgba(107,122,153,.15);color:var(--muted);}

/* ─── BUTTONS ─── */
.btn-sm{padding:.4rem .85rem;font-size:.8rem;border-radius:8px;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}
.btn-green{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.btn-green:hover{background:var(--green);color:#fff;}
.btn-red{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.btn-red:hover{background:var(--red);color:#fff;}
.btn-yellow{background:rgba(245,158,11,.15);color:var(--yellow);border:1px solid rgba(245,158,11,.3);}
.btn-icon{padding:.45rem .6rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:.9rem;transition:.2s;}
.btn-icon:hover{color:var(--text);background:var(--card2);}

/* ─── FORMS ─── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.form-group{margin-bottom:1rem;}
.form-group label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.35rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.65rem .9rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none;transition:.2s;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,194,255,.08);}
.form-group textarea{resize:vertical;min-height:80px;}

/* ─── MODAL ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:1rem;font-weight:700;}
.modal-body{padding:1.5rem;}
.modal-foot{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:.75rem;justify-content:flex-end;}

/* ─── TOAST ─── */
#toastContainer{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;display:flex;flex-direction:column;gap:.5rem;}
.toast{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:.75rem 1.2rem;font-size:.88rem;display:flex;align-items:center;gap:.6rem;min-width:240px;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:slideIn .3s ease;}
.toast.success{border-left:3px solid var(--green);}
.toast.error{border-left:3px solid var(--red);}
.toast.info{border-left:3px solid var(--accent);}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ─── PROGRESS ─── */
.progress{height:6px;background:var(--border);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;transition:.4s;}
.progress-blue{background:var(--accent);}
.progress-green{background:var(--green);}
.progress-red{background:var(--red);}
.progress-yellow{background:var(--yellow);}

/* ─── MODULE TABS ─── */
.mod-tabs{display:flex;gap:.5rem;padding:.75rem;background:var(--sidebar);border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:wrap;}
.mod-tab{padding:.5rem 1rem;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:500;color:var(--muted);background:transparent;font-family:var(--font);white-space:nowrap;transition:.2s;}
.mod-tab.active{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.mod-panel{display:none;}
.mod-panel.active{display:block;}

/* ─── STATS ROW ─── */
.stats-row{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem;}
.stat-chip{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:.5rem .9rem;font-size:.82rem;}
.stat-chip span{color:var(--muted);}
.stat-chip strong{color:var(--text);}

/* ─── SEARCH ─── */
.search-row{display:flex;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap;}
.search-box{flex:1;min-width:200px;display:flex;align-items:center;gap:.5rem;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:.5rem .9rem;}
.search-box input{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:.9rem;flex:1;}
.search-box span{color:var(--muted);}

/* ─── CHART BARS ─── */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:100px;}
.bar{flex:1;background:linear-gradient(to top,var(--accent2),var(--accent));border-radius:4px 4px 0 0;min-height:4px;position:relative;}
.bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--muted);white-space:nowrap;}
.bar-val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--accent);white-space:nowrap;}
.chart-wrap{margin-bottom:2rem;}

/* ─── RESPONSIVE ─── */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .g4,.g3{grid-template-columns:1fr 1fr;}
  .g2{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  .topbar{padding:.75rem 1rem;}
  .content{padding:1rem;}
  .hamburger{display:flex!important;}
}
.hamburger{display:none;flex-direction:column;gap:4px;cursor:pointer;padding:.4rem;}
.hamburger span{width:20px;height:2px;background:var(--text);border-radius:2px;}

/* ─── PAGE ANIMATIONS ─── */
.page-enter{animation:fadeUp .25s ease forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ─── DASHBOARD QUICK ACTIONS ─── */
.quick-actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.qa-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:.75rem;flex:1;min-width:160px;}
.qa-card:hover{border-color:var(--accent);background:rgba(0,194,255,.05);transform:translateY(-2px);}
.qa-icon{font-size:1.5rem;}
.qa-text p{font-size:.85rem;font-weight:600;}
.qa-text span{font-size:.75rem;color:var(--muted);}

/* ─── CUSTOMER PORTAL ─── */
.cust-banner{background:linear-gradient(135deg,rgba(0,119,255,.2),rgba(0,194,255,.1));border:1px solid rgba(0,194,255,.2);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:1.25rem;}
.cust-banner .avatar{width:52px;height:52px;font-size:1.2rem;}
.bill-card{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
.bill-card.overdue{border-color:rgba(239,68,68,.4);}
.bill-card.paid{border-color:rgba(34,197,94,.3);}

/* ─── INVOICE ─── */
.invoice{background:#fff;color:#1a1a2e;border-radius:var(--radius);padding:2rem;font-family:var(--font);}
.invoice-head{display:flex;justify-content:space-between;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:2px solid #e5e7eb;}
.invoice-line{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid #f3f4f6;font-size:.9rem;}
.invoice-total{display:flex;justify-content:space-between;padding:.75rem 0;font-weight:700;font-size:1.1rem;color:#1e40af;}

/* ─── EMPTY STATE ─── */
.empty{text-align:center;padding:3rem;color:var(--muted);}
.empty .icon{font-size:3rem;display:block;margin-bottom:1rem;opacity:.4;}
.empty p{font-size:.9rem;}

/* ─── NOTIFICATION ITEM ─── */
.notif-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;margin-bottom:.5rem;display:flex;align-items:flex-start;gap:.9rem;cursor:pointer;transition:.2s;border-left:3px solid transparent;}
.notif-item:hover{border-color:var(--accent);}
.notif-item.unread{background:rgba(0,194,255,.04);}
.notif-item.overdue-n{border-left-color:var(--red);}
.notif-item.payment-n{border-left-color:var(--green);}
.notif-item.info-n{border-left-color:var(--accent);}
.notif-icon{font-size:1.3rem;flex-shrink:0;}
.notif-body p{font-size:.9rem;font-weight:500;margin-bottom:.2rem;}
.notif-body span{font-size:.78rem;color:var(--muted);}

/* ─── SETTINGS TOGGLE ─── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0;border-bottom:1px solid var(--border);}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--border);border-radius:24px;cursor:pointer;transition:.3s;}
.slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
.toggle input:checked+.slider{background:var(--accent2);}
.toggle input:checked+.slider:before{transform:translateX(20px);}

/* ─── METER READING CARD ─── */
.meter-card{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;display:flex;flex-direction:column;gap:.75rem;}
.meter-card.overdue-m{border-color:rgba(245,158,11,.4);}
.reading-preview{background:var(--bg);border-radius:8px;padding:.75rem;font-size:.85rem;}
.reading-preview .calc{color:var(--accent);font-weight:600;font-family:var(--mono);}

/* ─── SIDEBAR OVERLAY ─── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;}
.sidebar-overlay.active{display:block;}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">💧</div>
  <div class="splash-title">AquaFlow</div>
  <div class="splash-sub">H2O Water Limited – Billing System</div>
  <div class="splash-bar"><div class="splash-fill"></div></div>
</div>

<!-- TOAST CONTAINER -->
<div id="toastContainer"></div>

<!-- SIDEBAR OVERLAY (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ════════════════════════════════════
     LOGIN PAGE
════════════════════════════════════ -->
<div id="loginPage" class="hidden">
  <div class="login-card">
    <div class="login-logo">
      <span class="icon">💧</span>
      <h1>AquaFlow</h1>
      <p>H2O Water Limited – Billing Portal</p>
    </div>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchLoginTab('admin')">Admin Login</button>
      <button class="tab-btn" onclick="switchLoginTab('customer')">Customer Login</button>
    </div>
    <div id="loginForm">
      <div class="field">
        <label id="loginUserLabel">Username</label>
        <input type="text" id="loginUser" placeholder="Enter username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn btn-primary btn-full" onclick="doLogin()">Sign In →</button>
      <p class="login-err" id="loginErr"></p>
    </div>

  </div>
</div>

<!-- ════════════════════════════════════
     APP SHELL
════════════════════════════════════ -->
<div id="appShell" class="hidden">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-brand">
        <div class="brand-icon">💧</div>
        <div class="brand-text">
          <h2>AquaFlow</h2>
          <p>H2O Water Limited</p>
        </div>
      </div>
      <div class="sidebar-user" id="sidebarUser" style="margin-top:.75rem;"></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <button class="nav-item" style="color:var(--red);width:100%;" onclick="logout()">
        <span class="ni">🚪</span> Sign Out
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:1rem;">
        <div class="hamburger" id="hamburger" onclick="toggleSidebar()">
          <span></span><span></span><span></span>
        </div>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
      </div>
      <div class="topbar-right">
        <span id="topbarDate" style="font-size:.8rem;color:var(--muted);"></span>
        <button class="btn btn-sm btn-outline" onclick="logout()">Logout</button>
      </div>
    </div>
    <div class="content" id="mainContent"></div>
  </div>
</div>

<!-- ════════════════════════════════════
     MODAL CONTAINER
════════════════════════════════════ -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <div class="modal-head">

<script>
// ══════════════════════════════════════════════════════════
//  CORE DATA STORE
// ══════════════════════════════════════════════════════════
const STORE = {
  get(k){try{return JSON.parse(localStorage.getItem('h2o_'+k))||null;}catch{return null;}},
  set(k,v){localStorage.setItem('h2o_'+k,JSON.stringify(v));},
  def(k,v){if(!this.get(k))this.set(k,v);}
};

// ── SEED DEFAULT DATA ──
STORE.def('admins',[
  {id:'a1',name:'Allan Ndata',username:'admin',password:'admin123',role:'Super Admin',email:'admin@h2owater.co.ke',active:true,lastLogin:'2026-05-18'},
  {id:'a2',name:'Billing Clerk',username:'clerk',password:'clerk123',role:'Billing Clerk',email:'clerk@h2owater.co.ke',active:true,lastLogin:'2026-05-17'}
]);

STORE.def('customers',[]);
STORE.def('meters',[]);
STORE.def('readings',[]);
STORE.def('bills',[]);
STORE.def('payments',[]);
STORE.def('notifications',[]);

STORE.def('settings',{
  company:'H2O Water Limited',
  tagline:'Clean Water for Every Home',
  address:'Westlands Commercial Centre, Nairobi',
  phone:'0700 123 456',
  email:'info@h2owater.co.ke',
  website:'www.h2owater.co.ke',
  paybill:'891234',
  accRef:'MTR-{meter}',
  rate:150,
  standing:200,
  minUnits:5,
  vat:false,
  vatRate:16,
  penalty:true,
  penaltyRate:10,
  graceDays:7,
  billDay:1,
  dueDay:15,
  currency:'KES',
  timezone:'Africa/Nairobi',
  language:'English',
  autoGenerate:true,
  autoReminder:true,
  reminderDays:3,
  darkMode:true
});

// ══════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════
const fmtKES = n => `KES ${Number(n||0).toLocaleString()}`;
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-KE',{day:'numeric',month:'short',year:'numeric'}) : '—';
const fmtPeriod = p => {if(!p)return '—';const[y,m]=p.split('-');return new Date(y,m-1).toLocaleDateString('en-KE',{month:'long',year:'numeric'});};
const uid = () => Math.random().toString(36).slice(2,9);
const el = id => document.getElementById(id);
const q = (s,ctx=document) => ctx.querySelector(s);
const qa = (s,ctx=document) => [...ctx.querySelectorAll(s)];

function toast(msg,type='info'){
  const t=document.createElement('div');
  const icons={info:'ℹ️',success:'✅',error:'❌'};
  t.className=`toast ${type}`;
  t.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  el('toastContainer').appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

function openModal(title,body,foot=''){
  el('modalTitle').textContent=title;
  el('modalBody').innerHTML=body;
  el('modalFoot').innerHTML=foot;
  el('modalOverlay').classList.remove('hidden');
}
function closeModal(force){
  if(force===true||force.target===el('modalOverlay'))
    el('modalOverlay').classList.add('hidden');
}

function toggleSidebar(){
  el('sidebar').classList.toggle('open');
  el('sidebarOverlay').classList.toggle('active');
}
function closeSidebar(){
  el('sidebar').classList.remove('open');
  el('sidebarOverlay').classList.remove('active');
}

// ══════════════════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════════════════
let currentUser=null, loginMode='admin';

function switchLoginTab(mode){
  loginMode=mode;
  qa('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(mode==='admin')===!i));
  el('loginUserLabel').textContent=mode==='admin'?'Username':'Meter No. or Phone Number';
  el('loginUser').placeholder=mode==='admin'?'Enter username':'e.g. MTR-0100 or 0712345678';
}

function doLogin(){
  const user=el('loginUser').value.trim();
  const pass=el('loginPass').value;
  el('loginErr').textContent='';
  if(!user||!pass){el('loginErr').textContent='Please enter credentials.';return;}
  if(loginMode==='admin'){
    const admins=STORE.get('admins')||[];
    const found=admins.find(a=>a.username===user&&a.password===pass&&a.active);
    if(found){currentUser={...found,role_type:'admin'};launchApp();}
    else el('loginErr').textContent='Invalid admin credentials.';
  } else {
    const customers=STORE.get('customers')||[];
    const found=customers.find(c=>(c.meter===user||c.phone===user)&&c.password===pass&&c.status==='active');
    if(found){currentUser={...found,role_type:'customer'};launchApp();}
    else el('loginErr').textContent='Invalid meter number, phone number, or password.';
  }
}

function logout(){
  currentUser=null;
  el('appShell').classList.add('hidden');
  el('loginPage').classList.remove('hidden');
  el('loginUser').value='';
  el('loginPass').value='';
  switchLoginTab('admin');
}

function launchApp(){
  el('loginPage').classList.add('hidden');
  el('appShell').classList.remove('hidden');
  buildSidebar();
  navigateTo(currentUser.role_type==='admin'?'dashboard':'cust-overview');
}

// ══════════════════════════════════════════════════════════
//  SIDEBAR BUILDER
// ══════════════════════════════════════════════════════════
const ADMIN_NAV=[
  {section:'Main'},
  {id:'dashboard',label:'Dashboard',icon:'🏠'},
  {section:'Modules'},
  {id:'meters',label:'Meter Management',icon:'🔧'},
  {id:'billing',label:'Billing Engine',icon:'⚡'},
  {id:'payments',label:'Payment Management',icon:'💳'},
  {id:'customers',label:'Customer Management',icon:'👥'},
  {section:'Analytics'},
  {id:'reports',label:'Reports & Analytics',icon:'📊'},
  {section:'System'},
  {id:'notifications',label:'Notifications',icon:'🔔'},
  {id:'settings',label:'System Settings',icon:'⚙️'},
];
const CUST_NAV=[
  {id:'cust-overview',label:'My Account',icon:'🏠'},
  {id:'cust-bills',label:'My Bills',icon:'🧾'},
  {id:'cust-payments',label:'Payment History',icon:'💳'},
  {id:'cust-receipts',label:'My Receipts',icon:'🧾'},
  {id:'cust-usage',label:'Usage Analytics',icon:'📈'},
  {id:'cust-meter',label:'My Meter',icon:'🔧'},
  {id:'cust-notifications',label:'Notifications',icon:'🔔'},
  {id:'cust-profile',label:'My Profile',icon:'👤'},
  {id:'cust-support',label:'Help & Support',icon:'💬'},
];

function buildSidebar(){
  const nav=currentUser.role_type==='admin'?ADMIN_NAV:CUST_NAV;
  const bills=STORE.get('bills')||[];
  const overdueCount=bills.filter(b=>b.status==='overdue').length;
  const notifs=STORE.get('notifications')||[];
  const unreadCount=notifs.filter(n=>!n.read&&(n.to==='all'||n.to==='admin'||n.to===currentUser.id)).length;

  el('sidebarUser').innerHTML=`
    <div class="avatar">${(currentUser.name||'U')[0]}</div>
    <div class="sidebar-user-info">
      <p>${currentUser.name}</p>
      <span>${currentUser.role||currentUser.meter||''}</span>
    </div>`;

  let html='';
  nav.forEach(item=>{
    if(item.section){html+=`<div class="nav-label">${item.section}</div>`;return;}
    const badge=item.id==='notifications'&&unreadCount?`<span class="nav-badge">${unreadCount}</span>`:'';
    html+=`<button class="nav-item" id="nav-${item.id}" onclick="navigateTo('${item.id}')">
      <span class="ni">${item.icon}</span>${item.label}${badge}</button>`;
  });
  el('sidebarNav').innerHTML=html;
}

let currentPage='';
function navigateTo(page){
  currentPage=page;
  qa('.nav-item').forEach(n=>n.classList.remove('active'));
  const ni=el('nav-'+page);
  if(ni)ni.classList.add('active');
  const titles={
    dashboard:'Dashboard',meters:'Meter Management',billing:'Billing Engine',
    payments:'Payment Management',customers:'Customer Management',
    reports:'Reports & Analytics',notifications:'Notifications',settings:'System Settings',
    'cust-overview':'My Account','cust-bills':'My Bills','cust-payments':'Payment History',
    'cust-receipts':'My Receipts',
    'cust-usage':'Usage Analytics','cust-meter':'My Meter','cust-notifications':'Notifications',
    'cust-profile':'My Profile','cust-support':'Help & Support'
  };
  el('topbarTitle').textContent=titles[page]||page;
  el('topbarDate').textContent=new Date().toLocaleDateString('en-KE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const content=el('mainContent');
  content.innerHTML='<div class="page-enter">';
  const pages={
    dashboard:renderDashboard,
    meters:renderMeters,
    billing:renderBilling,
    payments:renderPayments,
    customers:renderCustomers,
    reports:renderReports,
    notifications:renderNotifications,
    settings:renderSettings,
    'cust-overview':renderCustOverview,
    'cust-bills':renderCustBills,
    'cust-payments':renderCustPayments,
    'cust-receipts':renderCustReceipts,
    'cust-usage':renderCustUsage,
    'cust-meter':renderCustMeter,
    'cust-notifications':renderCustNotifications,
    'cust-profile':renderCustProfile,
    'cust-support':renderCustSupport,
  };
  if(pages[page])content.innerHTML=pages[page]();
  else content.innerHTML=`<div class="empty"><span class="icon">🚧</span><p>Page coming soon</p></div>`;
  closeSidebar();
}

//  MODULE 0 — ADMIN DASHBOARD
// ══════════════════════════════════════════════════════════
function renderDashboard(){
  const bills=STORE.get('bills')||[];
  const customers=STORE.get('customers')||[];
  const payments=STORE.get('payments')||[];
  const meters=STORE.get('meters')||[];
  const totalRev=payments.reduce((s,p)=>s+p.amount,0);
  const totalBilled=bills.reduce((s,b)=>s+b.total,0);
  const outstanding=bills.reduce((s,b)=>s+b.balance,0);
  const overdue=bills.filter(b=>b.status==='overdue');
  const activeCustomers=customers.filter(c=>c.status==='active').length;
  const faultyMeters=meters.filter(m=>m.status==='faulty').length;
  const collectionRate=totalBilled?Math.round(totalRev/totalBilled*100):0;

  const months=['Jan','Feb','Mar','Apr','May'];
  const revData=[42000,38000,51000,45000,totalRev];
  const maxRev=Math.max(...revData);

  return `
  <div style="max-width:1400px">
    <div style="margin-bottom:1.5rem;">
      <h2 style="font-size:1.4rem;font-weight:700;">Welcome back, ${currentUser.name.split(' ')[0]} 👋</h2>
      <p style="color:var(--muted);font-size:.9rem;margin-top:.25rem;">Here's what's happening today at H2O Water Limited</p>
    </div>

    <div class="grid g4" style="margin-bottom:1.5rem;">
      <div class="kpi" style="border-top:3px solid var(--accent);">
        <div class="kpi-icon">💰</div>
        <div class="kpi-label">Total Revenue</div>
        <div class="kpi-val" style="color:var(--accent);">${fmtKES(totalRev)}</div>
        <div class="kpi-sub">All-time collected</div>
      </div>
      <div class="kpi" style="border-top:3px solid var(--green);">
        <div class="kpi-icon">👥</div>
        <div class="kpi-label">Active Customers</div>
        <div class="kpi-val" style="color:var(--green);">${activeCustomers}</div>
        <div class="kpi-sub">${customers.length} total registered</div>
      </div>
      <div class="kpi" style="border-top:3px solid var(--red);">
        <div class="kpi-icon">⚠️</div>
        <div class="kpi-label">Outstanding Balance</div>
        <div class="kpi-val" style="color:var(--red);">${fmtKES(outstanding)}</div>
        <div class="kpi-sub">${overdue.length} overdue bills</div>
      </div>
      <div class="kpi" style="border-top:3px solid var(--yellow);">
        <div class="kpi-icon">📈</div>
        <div class="kpi-label">Collection Rate</div>
        <div class="kpi-val" style="color:var(--yellow);">${collectionRate}%</div>
        <div class="kpi-sub">of total billed</div>
      </div>
    </div>

    <div class="quick-actions" style="margin-bottom:1.5rem;">
      <div class="qa-card" onclick="navigateTo('meters')"><div class="qa-icon">🔧</div><div class="qa-text"><p>Meter Management</p><span>Enter readings</span></div></div>
      <div class="qa-card" onclick="navigateTo('billing')"><div class="qa-icon">⚡</div><div class="qa-text"><p>Billing Engine</p><span>Generate bills</span></div></div>
      <div class="qa-card" onclick="navigateTo('payments')"><div class="qa-icon">💳</div><div class="qa-text"><p>Record Payment</p><span>Post a payment</span></div></div>
      <div class="qa-card" onclick="navigateTo('customers')"><div class="qa-icon">👥</div><div class="qa-text"><p>Customers</p><span>Manage accounts</span></div></div>
      <div class="qa-card" onclick="navigateTo('reports')"><div class="qa-icon">📊</div><div class="qa-text"><p>Reports</p><span>View analytics</span></div></div>
    </div>

    <div class="grid g2">
      <div class="card">
        <div class="card-title">Revenue Trend (5 Months)</div>
        <div class="chart-wrap" style="padding-bottom:24px;">
          <div class="bar-chart">
            ${revData.map((v,i)=>{
              const h=Math.max(10,Math.round(v/maxRev*90));
              return `<div class="bar" style="height:${h}px;"><span class="bar-val">${Math.round(v/1000)}K</span><span class="bar-label">${months[i]}</span></div>`;
            }).join('')}
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Overdue Bills ⚠️</div>
        ${overdue.length?overdue.map(b=>{
          const c=(STORE.get('customers')||[]).find(x=>x.id===b.customerId);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--border);">
            <div><p style="font-size:.88rem;font-weight:600;">${c?c.name:'Unknown'}</p><p style="font-size:.75rem;color:var(--muted);">${fmtPeriod(b.period)}</p></div>
            <div style="text-align:right;"><p style="font-size:.88rem;color:var(--red);font-weight:600;">${fmtKES(b.balance)}</p></div>
          </div>`;
        }).join(''):`<div class="empty" style="padding:1.5rem;"><span class="icon">✅</span><p>No overdue bills</p></div>`}
        ${faultyMeters?`<div style="margin-top:.75rem;padding:.75rem;background:rgba(245,158,11,.1);border-radius:8px;border:1px solid rgba(245,158,11,.3);font-size:.85rem;color:var(--yellow);">⚠️ ${faultyMeters} faulty meter(s) need attention</div>`:''}
      </div>
    </div>

    <div class="card" style="margin-top:1rem;">
      <div class="section-head"><div class="section-title">Recent Bills</div><button class="btn btn-sm btn-outline" onclick="navigateTo('billing')">View All</button></div>

        <table>
          <thead><tr><th>Invoice</th><th>Customer</th><th>Period</th><th>Units</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th></tr></thead>
          <tbody>
            ${bills.slice(0,5).map(b=>{
              const c=(STORE.get('customers')||[]).find(x=>x.id===b.customerId);
              const stBadge={paid:'badge-green',unpaid:'badge-yellow',overdue:'badge-red'}[b.status]||'badge-gray';
              return `<tr><td style="font-family:var(--mono);font-size:.8rem;">${b.invoiceNo}</td><td>${c?c.name:'Unknown'}</td><td>${fmtPeriod(b.period)}</td><td>${b.units} m³</td><td>${fmtKES(b.total)}</td><td>${fmtKES(b.paid)}</td><td style="color:${b.balance?'var(--red)':'var(--green)'};">${fmtKES(b.balance)}</td><td><span class="badge ${stBadge}">${b.status}</span></td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════
//  MODULE 1 — METER MANAGEMENT
// ══════════════════════════════════════════════════════════
function renderMeters(){
  return `
  <div class="mod-tabs">
    <button class="mod-tab active" onclick="mTab(this,'m-registry')">📋 Registry</button>
    <button class="mod-tab" onclick="mTab(this,'m-readings')">⚡ Enter Reading</button>
    <button class="mod-tab" onclick="mTab(this,'m-bulk')" id="m-bulk-tab">📊 Bulk Readings & Billing</button>
    <button class="mod-tab" onclick="mTab(this,'m-history')">📈 Reading History</button>
    <button class="mod-tab" onclick="mTab(this,'m-faulty')">🔧 Faulty / Issues</button>
  </div>
  <div style="padding:1.5rem;">
    <div class="mod-panel active" id="m-registry">${mRegistry()}</div>
    <div class="mod-panel" id="m-readings">${mReadings()}</div>
    <div class="mod-panel" id="m-bulk">${mBulkReadings()}</div>
    <div class="mod-panel" id="m-history">${mHistory()}</div>
    <div class="mod-panel" id="m-faulty">${mFaulty()}</div>
  </div>`;
}

function mRegistry(){
  const meters=STORE.get('meters')||[];
  const customers=STORE.get('customers')||[];
  return `
  <div class="section-head">
    <div class="section-title">Meter Registry (${meters.length} meters)</div>
    <button class="btn btn-primary btn-sm" onclick="openAddMeterModal()">+ Add Meter</button>
  </div>
  <div class="search-row">
    <div class="search-box"><span>🔍</span><input placeholder="Search by meter, serial, customer…" oninput="filterMeters(this.value)" id="meterSearch"></div>
    <select class="form-group" style="min-width:140px;padding:.5rem .8rem;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);" onchange="filterMeterStatus(this.value)">
      <option value="">All Statuses</option><option>active</option><option>faulty</option><option>replaced</option><option>disconnected</option>
    </select>
  </div>
  <div class="tbl-wrap" id="meterTable">
    <table><thead><tr><th>Meter No</th><th>Serial</th><th>Type/Brand</th><th>Customer</th><th>Area</th><th>Installed</th><th>Last Reading</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="meterTbody">
    ${meters.map(m=>{
      const c=customers.find(x=>x.id===m.customerId);
      const stColor={active:'var(--green)',faulty:'var(--red)',replaced:'var(--muted)',disconnected:'var(--yellow)'}[m.status]||'var(--muted)';
      const stBadge={active:'badge-green',faulty:'badge-red',replaced:'badge-gray',disconnected:'badge-yellow'}[m.status]||'badge-gray';
      return `<tr data-meter='${JSON.stringify({...m,customerName:c?c.name:'Unassigned'})}'>
        <td style="font-family:var(--mono);font-weight:600;color:var(--accent);">${m.meterNo}</td>
        <td style="font-size:.8rem;color:var(--muted);">${m.serial}</td>
        <td>${m.type} / ${m.brand}</td>
        <td>${c?c.name:'<span style="color:var(--muted)">Unassigned</span>'}</td>
        <td>${m.area}</td>
        <td style="font-size:.8rem;">${fmtDate(m.installDate)}</td>
        <td><span style="font-family:var(--mono)">${m.lastReading}</span> m³<br><span style="font-size:.72rem;color:var(--muted)">${fmtDate(m.lastReadDate)}</span></td>
        <td><span class="badge ${stBadge}">${m.status}</span></td>
        <td>
          <button class="btn-icon" title="Enter Reading" onclick="quickReadingModal('${m.id}')">⚡</button>
          <button class="btn-icon" title="Edit" onclick="editMeterModal('${m.id}')">✏️</button>
          ${m.status==='active'?`<button class="btn-icon" title="Mark Faulty" onclick="markMeterStatus('${m.id}','faulty')">🔧</button>`:''}
          ${m.status==='faulty'?`<button class="btn-icon" title="Mark Active" onclick="markMeterStatus('${m.id}','active')">✅</button>`:''}
        </td></tr>`;
    }).join('')}
    </tbody></table>
  </div>`;
}

function mReadings(){
  const meters=STORE.get('meters')||[];
  const customers=STORE.get('customers')||[];
  const settings=STORE.get('settings')||{};
  const activeMeters=meters.filter(m=>m.status==='active'&&m.customerId);
  const now=new Date();
  return `
  <div class="section-head"><div class="section-title">Enter Meter Readings</div></div>
  <p style="color:var(--muted);font-size:.88rem;margin-bottom:1rem;">Enter current readings below. Units = Current − Previous. Bill = Units × KES ${settings.rate||150} + KES ${settings.standing||200} standing charge</p>
  <div class="grid g2">
  ${activeMeters.map(m=>{
    const c=customers.find(x=>x.id===m.customerId);
    const lastDate=new Date(m.lastReadDate||now);
    const daysSince=Math.round((now-lastDate)/86400000);
    const overdue=daysSince>35;
    return `
    <div class="meter-card ${overdue?'overdue-m':''}">
      <div style="display:flex;justify-content:space-between;align-items:start;">
        <div><p style="font-weight:700;font-family:var(--mono);color:var(--accent);">${m.meterNo}</p><p style="font-size:.82rem;color:var(--muted);">${c?c.name:''} · ${m.area}</p></div>
        ${overdue?`<span class="badge badge-yellow">Overdue</span>`:'<span class="badge badge-green">Active</span>'}
      </div>
      <div style="font-size:.82rem;color:var(--muted);">Last reading: <strong style="color:var(--text);">${m.lastReading} m³</strong> on ${fmtDate(m.lastReadDate)}</div>
      <div class="form-group" style="margin:0;">
        <label>Current Reading (m³)</label>
        <input type="number" min="${m.lastReading}" placeholder="${m.lastReading+10}"
          oninput="previewReading(this,'prev-${m.id}',${m.lastReading})"
          onblur="saveReading(this,'${m.id}')" id="read-${m.id}">
      </div>
      <div class="reading-preview" id="prev-${m.id}" style="display:none;">
        <div class="calc" id="calc-${m.id}"></div>
      </div>
    </div>`;
  }).join('')}
  </div>`;
}

function previewReading(input,previewId,prevReading){
  const curr=parseFloat(input.value)||0;
  const units=Math.max(0,curr-prevReading);
  const s=STORE.get('settings')||{};
  const rate=s.rate||150;const standing=s.standing||200;
  const bill=units*rate+standing;
  const prev=el(previewId);
  if(curr>prevReading){
    prev.style.display='block';
    prev.querySelector('.calc').textContent=`${units} units × KES ${rate} + KES ${standing} standing = ${fmtKES(bill)}`;
  } else {
    prev.style.display='none';

function mBulkReadings(){
  const meters=STORE.get('meters')||[];
  const customers=STORE.get('customers')||[];
  const readings=STORE.get('readings')||[];
  const bills=STORE.get('bills')||[];
  const settings=STORE.get('settings')||{};
  const rate=settings.rate||150;
  const standing=settings.standing||200;
  const today=new Date().toISOString().split('T')[0];
  const currentPeriod=today.substring(0,7);// YYYY-MM

  // Build row data for each active meter
  const activeMeters=meters.filter(m=>m.status!=='decommissioned');

  function getEstimate(meterId){
    // Get last 3 readings for trend
    const hist=readings.filter(r=>r.meterId===meterId).sort((a,b)=>b.period.localeCompare(a.period)).slice(0,3);
    if(!hist.length)return null;
    const avg=Math.round(hist.reduce((s,r)=>s+r.units,0)/hist.length);
    return avg;
  }

  function alreadyRead(meterId){
    return readings.find(r=>r.meterId===meterId&&r.period===currentPeriod);
  }

  function alreadyBilled(customerId){
    return bills.find(b=>b.customerId===customerId&&b.period===currentPeriod);
  }

  const rows=activeMeters.map(m=>{
    const cust=customers.find(c=>c.id===m.customerId);
    const est=getEstimate(m.id);
    const readDone=alreadyRead(m.id);
    const billDone=cust?alreadyBilled(cust.id):null;
    const unitsEst=est||0;
    const totalEst=(unitsEst*rate)+standing;
    return {m,cust,est,readDone,billDone,unitsEst,totalEst};
  });

  const periodDisplay=new Date(currentPeriod+'-01').toLocaleDateString('en-KE',{month:'long',year:'numeric'});

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1.25rem;">
    <div>
      <div class="section-title">📊 Bulk Readings & Billing — ${periodDisplay}</div>
      <p style="font-size:.82rem;color:var(--muted);margin-top:.25rem;">Enter current readings for all meters in one screen. Missing readings show usage estimates from trend. Generate bills directly from this view.</p>
    </div>
    <div style="display:flex;gap:.65rem;flex-wrap:wrap;">
      <button class="btn btn-sm btn-outline" onclick="bulkEstimateAll()">🔮 Estimate All Unread</button>
      <button class="btn btn-sm btn-outline" onclick="bulkDownloadSheet()">⬇️ Download Sheet (CSV)</button>
      <button class="btn btn-sm btn-green" onclick="bulkSaveAllReadings()">💾 Save All Readings</button>
      <button class="btn btn-sm btn-primary" onclick="bulkGenerateAllBills()">⚡ Generate All Bills</button>
    </div>
  </div>

  <!-- Summary strip -->
  <div class="grid g4" style="margin-bottom:1.25rem;">
    <div class="card" style="padding:.85rem;text-align:center;">
      <div style="font-size:1.4rem;font-weight:700;color:var(--accent);">${activeMeters.length}</div>
      <div style="font-size:.75rem;color:var(--muted);">Total Meters</div>
    </div>
    <div class="card" style="padding:.85rem;text-align:center;">
      <div style="font-size:1.4rem;font-weight:700;color:var(--green);">${rows.filter(r=>r.readDone).length}</div>
      <div style="font-size:.75rem;color:var(--muted);">Readings Done</div>
    </div>
    <div class="card" style="padding:.85rem;text-align:center;">
      <div style="font-size:1.4rem;font-weight:700;color:var(--yellow);">${rows.filter(r=>!r.readDone).length}</div>
      <div style="font-size:.75rem;color:var(--muted);">Pending Readings</div>
    </div>
    <div class="card" style="padding:.85rem;text-align:center;">
      <div style="font-size:1.4rem;font-weight:700;color:var(--red);">${rows.filter(r=>r.cust&&!r.billDone).length}</div>
      <div style="font-size:.75rem;color:var(--muted);">Bills Not Generated</div>
    </div>
  </div>

  <!-- Main grid table -->
  <div class="tbl-wrap">
    <table id="bulkReadTable">
      <thead>
        <tr>
          <th>Meter No.</th>
          <th>Customer</th>
          <th>Area</th>
          <th>Prev. Reading (m³)</th>
          <th>Curr. Reading (m³)</th>
          <th>Units Used</th>
          <th>Estimate</th>
          <th>Bill Amount</th>
          <th>Read</th>
          <th>Billed</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(({m,cust,est,readDone,billDone,unitsEst,totalEst})=>{
          const prev=m.lastReading||0;
          const currVal=readDone?readDone.curr:'';
          const units=readDone?readDone.units:'';
          const billAmt=readDone?((readDone.units*rate)+standing):totalEst;
          const estTag=est!==null?`<span title="Avg of last ${Math.min(3,readings.filter(r=>r.meterId===m.id).length)} readings" style="font-size:.72rem;color:var(--yellow);margin-left:.3rem;">~${est}m³ est.</span>`:'<span style="font-size:.72rem;color:var(--muted);">no history</span>';
          return `<tr id="bulk-row-${m.id}" data-meterid="${m.id}" data-custid="${cust?cust.id:''}" data-prev="${prev}" data-est="${est||0}">
            <td style="font-family:var(--mono);color:var(--accent);font-weight:600;">${m.meterNo}</td>
            <td>${cust?cust.name:'<span style="color:var(--muted)">Unassigned</span>'}</td>
            <td style="font-size:.82rem;">${m.area||'—'}</td>
            <td style="font-family:var(--mono);">${prev} m³</td>
            <td>
              ${readDone
                ? `<span style="font-family:var(--mono);color:var(--green);">${readDone.curr} m³</span>`

                    <input type="number" id="curr-${m.id}" placeholder="0" min="${prev}"
                      style="width:90px;padding:.35rem .5rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);"

              }

            <td id="units-${m.id}" style="font-family:var(--mono);">${units!==''?units+'&nbsp;m³':'<span style="color:var(--muted);">—</span>'}</td>
            <td>${!readDone?estTag:'<span style="color:var(--muted);font-size:.8rem;">read ✓</span>'}</td>

            <td style="text-align:center;">${readDone?'<span style="color:var(--green);">✅</span>':'<span style="color:var(--muted);">⏳</span>'}</td>
            <td style="text-align:center;">${billDone?'<span style="color:var(--green);">✅</span>':'<span style="color:var(--red);">❌</span>'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  <div id="bulk-save-result" style="margin-top:1rem;"></div>`;
}

function bulkCalcRow(meterId, prev, rate, standing){
  const inp=q('#curr-'+meterId);
  if(!inp)return;
  const curr=parseFloat(inp.value)||0;
  const units=Math.max(0,curr-prev);
  const amt=(units*rate)+standing;
  const uEl=q('#units-'+meterId);
  const aEl=q('#bilamt-'+meterId);
  if(uEl)uEl.innerHTML=curr>prev?`${units}&nbsp;m³`:'<span style="color:var(--red);">Check value</span>';
  if(aEl)aEl.textContent=curr>prev?fmtKES(amt):'—';
}

function bulkEstimateAll(){
  const readings=STORE.get('readings')||[];
  const today=new Date().toISOString().split('T')[0];
  const currentPeriod=today.substring(0,7);
  const rows=qa('#bulkReadTable tbody tr');
  let filled=0;
  rows.forEach(row=>{
    const mid=row.dataset.meterid;
    const prev=parseFloat(row.dataset.prev)||0;
    const est=parseFloat(row.dataset.est)||0;
    const inp=q('#curr-'+mid);
    if(inp&&!inp.value&&est>0){
      inp.value=prev+est;
      const settings=STORE.get('settings')||{};
      bulkCalcRow(mid,prev,settings.rate||150,settings.standing||200);
      filled++;
    }
  });
  toast(`Estimated ${filled} unread meters from usage trend`,'success');
}

function bulkSaveAllReadings(){
  const readings=STORE.get('readings')||[];
  const meters=STORE.get('meters')||[];
  const today=new Date().toISOString().split('T')[0];
  const currentPeriod=today.substring(0,7);
  const rows=qa('#bulkReadTable tbody tr');
  let saved=0,skipped=0;
  rows.forEach(row=>{
    const mid=row.dataset.meterid;
    const cid=row.dataset.custid;
    const prev=parseFloat(row.dataset.prev)||0;
    const inp=q('#curr-'+mid);
    if(!inp)return;// already read
    const curr=parseFloat(inp.value);
    if(!curr||curr<=prev){skipped++;return;}
    const units=curr-prev;
    // Remove existing for this period if any
    const filtered=readings.filter(r=>!(r.meterId===mid&&r.period===currentPeriod));
    filtered.push({id:'r'+uid(),meterId:mid,customerId:cid,prev,curr,units,period:currentPeriod,date:today,source:'bulk'});
    readings.length=0;filtered.forEach(r=>readings.push(r));
    // Update meter lastReading
    const mi=meters.findIndex(m=>m.id===mid);
    if(mi>-1){meters[mi].lastReading=curr;meters[mi].lastReadDate=today;}
    saved++;
  });
  STORE.set('readings',readings);
  STORE.set('meters',meters);
  const res=q('#bulk-save-result');
  if(res)res.innerHTML=`<div class="badge badge-green">✅ ${saved} readings saved${skipped?' · '+skipped+' skipped (value missing or not greater than previous)':''}</div>`;
  toast(`${saved} readings saved`,'success');
  if(saved)setTimeout(()=>navigateTo('meters'),800);
}

function bulkGenerateAllBills(){
  const readings=STORE.get('readings')||[];
  const bills=STORE.get('bills')||[];
  const customers=STORE.get('customers')||[];
  const settings=STORE.get('settings')||{};
  const rate=settings.rate||150;
  const standing=settings.standing||200;
  const today=new Date().toISOString().split('T')[0];
  const currentPeriod=today.substring(0,7);
  const dueDate=today.substring(0,8)+(settings.dueDay||15);

  // First save any pending readings
  bulkSaveAllReadings();

  const freshReadings=STORE.get('readings')||[];
  let generated=0,skipped=0;

  customers.filter(c=>c.status==='active').forEach(c=>{
    if(bills.find(b=>b.customerId===c.id&&b.period===currentPeriod)){skipped++;return;}
    const reading=freshReadings.find(r=>r.customerId===c.id&&r.period===currentPeriod);

    // Use estimated units if no reading
    const meterList=STORE.get('meters')||[];
    const meter=meterList.find(m=>m.customerId===c.id);
    let units=0;
    if(reading){
      units=reading.units;
    } else if(meter){
      // estimate from trend
      const hist=freshReadings.filter(r=>r.meterId===meter.id).sort((a,b)=>b.period.localeCompare(a.period)).slice(0,3);
      if(hist.length)units=Math.round(hist.reduce((s,r)=>s+r.units,0)/hist.length);
    }

    const water=units*rate;
    const prevBills=bills.filter(b=>b.customerId===c.id&&b.balance>0);
    const prevBal=prevBills.reduce((s,b)=>s+b.balance,0);
    const grossTotal=water+standing+prevBal;
    const {creditUsed,creditRemaining,netTotal,netBalance}=applyCredit(c,grossTotal);
    if(creditUsed>0){c.credit=creditRemaining;}
    const invNo='INV-'+String(bills.length+generated+1).padStart(4,'0');
    bills.push({
      id:'b'+uid(),customerId:c.id,period:currentPeriod,
      units,water,standing,prevBal,penalty:0,
      creditApplied:creditUsed,rate,
      grossTotal,total:netTotal,paid:0,balance:netBalance,
      status:netBalance<=0?'paid':'unpaid',
      invoiceNo:invNo,dueDate,genDate:today,
      estimated:!reading
    });
    generated++;
  });

  STORE.set('bills',bills);
  STORE.set('customers',STORE.get('customers')||[]);// flush credit deductions already applied to in-memory objects
  toast(`${generated} bills generated${skipped?' · '+skipped+' already existed':''}`,'success');
  openModal('✅ Bulk Billing Complete',`
    <div style="text-align:center;padding:1rem;">
      <div style="font-size:2.5rem;margin-bottom:.75rem;">⚡</div>
      <p style="font-weight:700;font-size:1.05rem;">${generated} bills generated for ${currentPeriod.replace('-','/')}</p>
      ${skipped?`<p style="font-size:.85rem;color:var(--muted);margin-top:.5rem;">${skipped} customers already had bills this period.</p>`:''}
      <p style="font-size:.82rem;color:var(--yellow);margin-top:.75rem;">⚠️ Bills for customers without a current reading used estimated units from usage trend.</p>
    </div>`,
    `<button class="btn btn-outline btn-sm" onclick="closeModal(true)">Close</button>
     <button class="btn btn-primary btn-sm" onclick="closeModal(true);navigateTo('billing')">View All Invoices →</button>`
  );
}

function bulkDownloadSheet(){
  const readings=STORE.get('readings')||[];
  const meters=STORE.get('meters')||[];
  const customers=STORE.get('customers')||[];
  const settings=STORE.get('settings')||{};
  const rate=settings.rate||150;
  const standing=settings.standing||200;
  const today=new Date().toISOString().split('T')[0];
  const currentPeriod=today.substring(0,7);

  const rows=qa('#bulkReadTable tbody tr');
  const lines=[['Meter No','Serial','Customer','Area','Type','Prev Reading (m³)','Curr Reading (m³)','Units Used','Water Charge (KES)','Standing (KES)','Total Bill (KES)','Period','Date Read','Source','Status']];

  rows.forEach(row=>{
    const mid=row.dataset.meterid;
    const cid=row.dataset.custid;
    const meter=meters.find(m=>m.id===mid)||{};
    const cust=customers.find(c=>c.id===cid)||{};
    const reading=readings.find(r=>r.meterId===mid&&r.period===currentPeriod);
    const inp=q('#curr-'+mid);
    const prev=parseFloat(row.dataset.prev)||0;
    const curr=reading?reading.curr:(inp?parseFloat(inp.value)||'':'' );
    const units=reading?reading.units:(curr&&curr>prev?curr-prev:'');
    const water=units?(units*rate):'';
    const total=units?(water+standing):'';
    lines.push([
      meter.meterNo||'',meter.serial||'',cust.name||'Unassigned',meter.area||'',meter.type||'',
      prev,curr,units,water,standing,total,currentPeriod,
      reading?reading.date:today,
      reading?(reading.source||'manual'):'pending',
      reading?'Read':'Pending'
    ]);
  });

  const csv=lines.map(r=>r.map(v=>JSON.stringify(v===undefined?'':v)).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`Meter_Readings_${currentPeriod}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Reading sheet downloaded','success');
}

function bilCalcPreview(){
  const custId=q('#bil-cust')?.value;
  const prev=parseFloat(q('#bil-prev')?.value)||0;
  const curr=parseFloat(q('#bil-curr')?.value)||0;
  const preview=el('bil-preview');
  if(!preview)return;
  if(!custId||curr<=prev){preview.style.display='none';return;}
  const s=STORE.get('settings')||{};
  const rate=s.rate||150;
  const standing=s.standing||200;
  const vat=s.vat;const vatRate=s.vatRate||16;
  const units=curr-prev;
  const water=units*rate;
  const vatAmt=vat?Math.round(water*vatRate/100):0;
  const total=water+vatAmt+standing;
  preview.style.display='block';
  preview.innerHTML=`
    <div style="background:var(--bg);border-radius:10px;padding:1rem;margin-bottom:.75rem;">
      <div class="invoice-line"><span>Units Consumed</span><strong>${units} m³</strong></div>
      <div class="invoice-line"><span>Previous Reading</span><strong>${prev} m³</strong></div>
      <div class="invoice-line"><span>Current Reading</span><strong>${curr} m³</strong></div>
      <div class="invoice-line"><span>Water Charge (${units} × KES ${rate})</span><strong>${fmtKES(water)}</strong></div>
      ${vat?`<div class="invoice-line"><span>VAT (${vatRate}%)</span><strong>${fmtKES(vatAmt)}</strong></div>`:''}
      <div class="invoice-line"><span>Standing Charge</span><strong>${fmtKES(standing)}</strong></div>
      <div style="display:flex;justify-content:space-between;padding:.75rem 0;font-weight:700;color:var(--accent);font-size:1.1rem;"><span>TOTAL DUE</span><span>${fmtKES(total)}</span></div>
    </div>`;
}

// ── CREDIT HELPER ──
function applyCredit(customer, grossTotal){
  const credit=customer.credit||0;
  const creditUsed=Math.min(credit, grossTotal);
  const creditRemaining=Math.round((credit-creditUsed)*100)/100;
  const netTotal=Math.round((grossTotal-creditUsed)*100)/100;
  return {creditUsed:Math.round(creditUsed*100)/100, creditRemaining, netTotal, netBalance:netTotal};
}

function generateSingleBill(){
  const custId=q('#bil-cust')?.value;
  const period=q('#bil-period')?.value;
  const prev=parseFloat(q('#bil-prev')?.value)||0;
  const curr=parseFloat(q('#bil-curr')?.value)||0;
  if(!custId||!period||curr<=prev){toast('Please fill all fields correctly','error');return;}
  const bills=STORE.get('bills')||[];
  if(bills.find(b=>b.customerId===custId&&b.period===period)){toast('Bill already exists for this period','error');return;}
  const s=STORE.get('settings')||{};
  const rate=s.rate||150;
  const standing=s.standing||200;
  const vat=s.vat;const vatRate=s.vatRate||16;
  const units=curr-prev;
  const water=units*rate;
  const vatAmt=vat?Math.round(water*vatRate/100):0;
  const grossTotal=water+vatAmt+standing;
  const customers=STORE.get('customers')||[];
  const c=customers.find(x=>x.id===custId);
  const {creditUsed,creditRemaining,netTotal,netBalance}=applyCredit(c||{},grossTotal);
  if(c&&creditUsed>0){c.credit=creditRemaining;STORE.set('customers',customers);}
  const invoiceNo=`INV-${String(bills.length+1).padStart(4,'0')}`;
  const today=new Date().toISOString().split('T')[0];
  bills.push({
    id:'b'+uid(),customerId:custId,period,units,water,vatAmt,standing,
    prevBal:0,penalty:0,creditApplied:creditUsed,
    prevReading:prev,currReading:curr,rate,
    grossTotal,total:netTotal,paid:0,balance:netBalance,
    status:netBalance<=0?'paid':'unpaid',invoiceNo,
    dueDate:period+'-15',genDate:today
  });
  STORE.set('bills',bills);
  // Save reading record too
  const meters=STORE.get('meters')||[];
  const meter=meters.find(m=>m.customerId===custId);
  if(meter){
    const readings=STORE.get('readings')||[];
    readings.push({id:'r'+uid(),meterId:meter.id,customerId:custId,prev,curr,units,period,date:today,source:'manual'});
    STORE.set('readings',readings);
    meter.lastReading=curr;meter.lastReadDate=today;
    STORE.set('meters',meters);
  }
  const msg=creditUsed>0?`Bill generated for ${c?.name}. Credit of ${fmtKES(creditUsed)} applied. Net payable: ${fmtKES(netTotal)}`:`Bill generated for ${c?.name} – ${fmtKES(netTotal)}`;
  toast(msg,'success');
  navigateTo('billing');
}

function batchGenerate(){
  const period=q('#batch-period')?.value;
  const s=STORE.get('settings')||{};
  const rate=parseFloat(q('#batch-rate')?.value)||s.rate||150;
  const standing=s.standing||200;
  const vat=s.vat;const vatRate=s.vatRate||16;
  const customers=STORE.get('customers')||[];
  const bills=STORE.get('bills')||[];
  const readings=STORE.get('readings')||[];
  const meters=STORE.get('meters')||[];
  const log=el('batch-log');
  const active=customers.filter(c=>c.status==='active');
  let logHtml='',generated=0;
  const today=new Date().toISOString().split('T')[0];
  active.forEach(c=>{
    if(bills.find(b=>b.customerId===c.id&&b.period===period)){
      logHtml+=`<div style="font-size:.82rem;color:var(--muted);padding:.3rem 0;">⏭ ${c.name} – Bill already exists</div>`;
      return;
    }
    const meter=meters.find(m=>m.customerId===c.id);
    const reading=readings.find(r=>r.customerId===c.id&&r.period===period);
    const prev=reading?reading.prev:(meter?meter.lastReading||0:0);
    const curr=reading?reading.curr:prev;
    const units=reading?reading.units:0;
    const water=units*rate;
    const vatAmt=vat?Math.round(water*vatRate/100):0;
    const grossTotal=water+vatAmt+standing;
    const {creditUsed,creditRemaining,netTotal,netBalance}=applyCredit(c,grossTotal);
    if(creditUsed>0){c.credit=creditRemaining;}
    bills.push({
      id:'b'+uid(),customerId:c.id,period,units,water,vatAmt,standing,prevBal:0,penalty:0,
      creditApplied:creditUsed,prevReading:prev,currReading:curr,rate,
      grossTotal,total:netTotal,paid:0,balance:netBalance,
      status:netBalance<=0?'paid':'unpaid',
      invoiceNo:`INV-${String(bills.length+generated+1).padStart(4,'0')}`,
      dueDate:period+'-15',genDate:today
    });
    generated++;
    logHtml+=`<div style="font-size:.82rem;color:var(--green);padding:.3rem 0;">✅ ${c.name} – ${fmtKES(netTotal)}${creditUsed>0?' <span style="color:var(--accent);">(Credit −'+fmtKES(creditUsed)+')</span>':''}</div>`;
  });
  STORE.set('bills',bills);
  STORE.set('customers',customers);// save credit deductions
  if(log)log.innerHTML=`<div style="padding:.75rem;background:var(--bg);border-radius:8px;"><p style="font-weight:600;margin-bottom:.5rem;color:var(--accent);">${generated} bills generated</p>${logHtml}</div>`;
  toast(`${generated} bills generated for ${period}`,'success');
}

      </div>

        ${edits.length?`<div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;">

function bmTab(tab,billId){
  const vp=el('bm-view-pane'),ep=el('bm-edit-pane');
  const vb=el('bm-view'),eb=el('bm-edit');
  if(!vp||!ep)return;
  if(tab==='view'){vp.style.display='';ep.style.display='none';if(vb)vb.className='btn btn-sm btn-primary';if(eb)eb.className='btn btn-sm btn-outline';}
  else{vp.style.display='none';ep.style.display='';if(vb)vb.className='btn btn-sm btn-outline';if(eb)eb.className='btn btn-sm btn-primary';}
}

function beTab(btn,panelId){
  qa('.be-panel').forEach(p=>p.style.display='none');
  const panel=el(panelId);if(panel)panel.style.display='';
  qa('#be-tabs button').forEach(b=>{b.className='btn btn-sm btn-outline';});
  if(btn)btn.className='btn btn-sm btn-primary';
}

function beCalc(rate){
  const prev=parseFloat(q('#be-prev')?.value)||0;
  const curr=parseFloat(q('#be-curr')?.value)||0;
  const preview=el('be-reading-preview');
  if(!preview)return;
  if(curr>prev){
    const units=curr-prev;
    const s=STORE.get('settings')||{};
    const r=rate||s.rate||150;
    const standing=s.standing||200;
    const water=units*r;
    preview.style.display='';
    preview.innerHTML=`Units: <strong>${units} m3</strong> - Water: <strong>${fmtKES(water)}</strong> - Standing: <strong>${fmtKES(standing)}</strong> - <strong style="color:var(--accent);">New Total: ${fmtKES(water+standing)}</strong>`;
  }else{preview.style.display='none';}
}

function beTotalPreview(){
  const water=parseFloat(q('#be-water')?.value)||0;
  const standing=parseFloat(q('#be-standing')?.value)||0;
  const vat=parseFloat(q('#be-vat')?.value)||0;
  const prevBal=parseFloat(q('#be-prevbal')?.value)||0;
  const penalty=parseFloat(q('#be-penalty')?.value)||0;
  const gross=water+standing+vat+prevBal+penalty;
  const preview=el('be-charges-preview');
  if(preview)preview.innerHTML=`<span style="color:var(--accent);font-weight:700;">New Gross Total: ${fmtKES(gross)}</span>`;
}

function beDiscPreview(){
  const type=q('#be-disc-type')?.value;
  const val=parseFloat(q('#be-disc-val')?.value)||0;
  const lbl=el('be-disc-lbl');
  const preview=el('be-disc-preview');
  if(lbl)lbl.textContent=type==='percent'?'Percentage (%)':'Amount (KES)';
  if(!preview)return;
  preview.innerHTML=type==='fullwaiver'
    ?`<div style="background:rgba(16,185,129,.1);border-radius:8px;padding:.6rem .85rem;color:#10b981;font-weight:700;">Full waiver - entire outstanding balance will be cleared</div>`
    :type==='percent'&&val
    ?`<div style="background:rgba(16,185,129,.1);border-radius:8px;padding:.6rem .85rem;color:#10b981;">${val}% discount will be applied to the current balance</div>`
    :val
    ?`<div style="background:rgba(16,185,129,.1);border-radius:8px;padding:.6rem .85rem;color:#10b981;">${fmtKES(val)} will be deducted from the balance</div>`
    :'';
}

function beLogEntry(bill,type,summary,reason,extra){
  if(!bill.editLog)bill.editLog=[];
  bill.editLog.push({type,summary,reason:reason||'',by:currentUser?.name||'Admin',date:new Date().toISOString().split('T')[0],...(extra||{})});
}

function beSaveReadings(billId){
  const bills=STORE.get('bills')||[];
  const b=bills.find(x=>x.id===billId);
  if(!b){toast('Bill not found','error');return;}
  const prev=parseFloat(q('#be-prev')?.value);
  const curr=parseFloat(q('#be-curr')?.value);
  const reason=q('#be-read-reason')?.value||'Reading correction';
  if(isNaN(prev)||isNaN(curr)||curr<=prev){toast('Enter valid readings (current must exceed previous)','error');return;}
  const s=STORE.get('settings')||{};
  const rate=b.rate||s.rate||150;
  const standing=b.standing||s.standing||200;
  const units=curr-prev;
  const water=units*rate;
  const vatAmt=b.vatAmt?Math.round(water*(s.vatRate||16)/100):0;
  const oldTotal=b.total;
  const gross=water+vatAmt+standing+(b.prevBal||0)+(b.penalty||0)-(b.discount||0)-(b.creditApplied||0);
  b.prevReading=prev;b.currReading=curr;b.units=units;b.water=water;b.vatAmt=vatAmt;
  b.total=Math.max(0,gross);b.balance=Math.max(0,gross-b.paid);
  b.status=b.balance<=0?'paid':'unpaid';
  beLogEntry(b,'Reading Correction',`Readings: ${prev} to ${curr} m3 (${units} units). Total: ${fmtKES(oldTotal)} to ${fmtKES(b.total)}`,reason);
  STORE.set('bills',bills);
  toast('Reading corrected and bill recalculated.','success');
  closeModal(true);navigateTo('billing');
}

function beSaveCharges(billId){
  const bills=STORE.get('bills')||[];
  const b=bills.find(x=>x.id===billId);
  if(!b)return;
  const reason=q('#be-charge-reason')?.value||'Charge adjustment';
  const oldTotal=b.total;
  b.water=parseFloat(q('#be-water')?.value)||0;
  b.standing=parseFloat(q('#be-standing')?.value)||0;
  b.vatAmt=parseFloat(q('#be-vat')?.value)||0;
  b.prevBal=parseFloat(q('#be-prevbal')?.value)||0;
  b.penalty=parseFloat(q('#be-penalty')?.value)||0;
  if(q('#be-due')?.value)b.dueDate=q('#be-due').value;
  const gross=b.water+b.standing+b.vatAmt+b.prevBal+b.penalty-(b.discount||0)-(b.creditApplied||0);
  b.total=Math.max(0,gross);b.balance=Math.max(0,gross-b.paid);
  b.status=b.balance<=0?'paid':'unpaid';
  beLogEntry(b,'Charge Adjustment',`Charges updated. Total: ${fmtKES(oldTotal)} to ${fmtKES(b.total)}`,reason);
  STORE.set('bills',bills);
  toast('Charges updated and bill recalculated.','success');
  closeModal(true);navigateTo('billing');
}

function beSaveDiscount(billId){
  const bills=STORE.get('bills')||[];
  const b=bills.find(x=>x.id===billId);
  if(!b)return;
  const type=q('#be-disc-type')?.value;
  const val=parseFloat(q('#be-disc-val')?.value)||0;
  const reason=q('#be-disc-reason')?.value||'Discount applied';
  const auth=q('#be-disc-auth')?.value||'Admin';
  let discAmt=0;
  if(type==='fullwaiver'){discAmt=b.balance;}
  else if(type==='percent'){discAmt=Math.round(b.balance*val/100);}
  else{discAmt=Math.min(val,b.balance);}
  if(discAmt<=0){toast('Discount amount must be greater than zero','error');return;}
  b.discount=(b.discount||0)+discAmt;
  b.total=Math.max(0,b.total-discAmt);
  b.balance=Math.max(0,b.balance-discAmt);
  b.status=b.balance<=0?'paid':'unpaid';
  beLogEntry(b,'Waiver/Discount',`${type==='fullwaiver'?'Full waiver':type==='percent'?val+'% discount':'Fixed discount of '+fmtKES(discAmt)} applied. New balance: ${fmtKES(b.balance)}`,reason,{auth,discAmt});
  const notifs=STORE.get('notifications')||[];
  notifs.unshift({id:'n'+uid(),type:'info',to:b.customerId,title:`Bill Adjustment - ${b.invoiceNo}`,msg:`A ${type==='fullwaiver'?'full waiver':fmtKES(discAmt)+' discount'} has been applied to your bill for ${fmtPeriod(b.period)}. New balance: ${fmtKES(b.balance)}.`,date:new Date().toISOString().split('T')[0],read:false,priority:'normal'});
  STORE.set('notifications',notifs);
  STORE.set('bills',bills);
  toast(`Discount of ${fmtKES(discAmt)} applied.${b.balance<=0?' Bill fully waived!':' New balance: '+fmtKES(b.balance)}`,'success');
  closeModal(true);navigateTo('billing');
}

function beSavePayAdj(billId){
  const bills=STORE.get('bills')||[];
  const b=bills.find(x=>x.id===billId);
  if(!b)return;
  const type=q('#be-pay-type')?.value;
  const amt=parseFloat(q('#be-pay-amt')?.value)||0;
  const ref=q('#be-pay-ref')?.value||'';
  const date=q('#be-pay-date')?.value||new Date().toISOString().split('T')[0];
  const reason=q('#be-pay-reason')?.value||'Payment adjustment';
  if(type!=='note'&&amt<=0){toast('Enter a valid amount','error');return;}
  let summary='';
  if(type==='credit'){
    b.paid+=amt;b.balance=Math.max(0,b.balance-amt);
    b.status=b.balance<=0?'paid':'unpaid';
    summary=`Payment credit of ${fmtKES(amt)} added. Balance: ${fmtKES(b.balance)}`;
    const payments=STORE.get('payments')||[];
    payments.push({id:'p'+uid(),customerId:b.customerId,billId,amount:amt,method:'Manual Adjustment',reference:ref||'ADJ'+uid().slice(0,6),date,note:reason,receiptNo:'ADJ-'+String(payments.length+1).padStart(4,'0'),approved:true,approvedBy:currentUser?.name||'Admin'});
    STORE.set('payments',payments);
  }else if(type==='debit'){
    if(amt>b.paid){toast('Reversal exceeds amount paid on this bill','error');return;}
    b.paid-=amt;b.balance+=amt;
    b.status=b.balance<=0?'paid':'unpaid';
    summary=`Payment reversal of ${fmtKES(amt)}. Balance: ${fmtKES(b.balance)}`;
  }else{
    summary=`Note: ${reason}`;
  }
  beLogEntry(b,'Payment Adjustment',summary,reason,{ref,adjType:type});
  STORE.set('bills',bills);
  toast('Payment adjustment saved.','success');
  closeModal(true);navigateTo('billing');
}

function bilTariff(){
  const s=STORE.get('settings')||{rate:150,standing:200,vat:false,vatRate:16,penalty:true,penaltyRate:10};
  const sims=[5,10,20,35,60,100];
  return `
  <div class="grid g2">
    <div class="card">
      <div class="card-title">Rate Configuration</div>
      <div class="form-group"><label>Rate per Unit (KES/m³)</label><input type="number" id="t-rate" value="${s.rate||150}" oninput="updateTariffSim()"></div>
      <div class="form-group"><label>Monthly Standing Charge (KES)</label><input type="number" id="t-standing" value="${s.standing||200}" oninput="updateTariffSim()"></div>
      <div class="form-group"><label>Minimum Billable Units (m³)</label><input type="number" id="t-min" value="${s.minUnits||5}"></div>
      <div class="toggle-row"><div><p style="font-size:.88rem;font-weight:600;">Apply VAT</p><p style="font-size:.78rem;color:var(--muted);">Tax on water charge</p></div><label class="toggle"><input type="checkbox" id="t-vat" ${s.vat?'checked':''} onchange="updateTariffSim()"><span class="slider"></span></label></div>
      <div class="form-group" style="margin-top:.5rem;"><label>VAT Rate (%)</label><input type="number" id="t-vatrate" value="${s.vatRate||16}" oninput="updateTariffSim()"></div>
      <div class="toggle-row"><div><p style="font-size:.88rem;font-weight:600;">Late Payment Penalty</p><p style="font-size:.78rem;color:var(--muted);">${s.penaltyRate||10}% after ${s.graceDays||7} days grace</p></div><label class="toggle"><input type="checkbox" id="t-pen" ${s.penalty?'checked':''} onchange="updateTariffSim()"><span class="slider"></span></label></div>
      <div class="form-group" style="margin-top:.5rem;"><label>Penalty Rate (%)</label><input type="number" id="t-penrate" value="${s.penaltyRate||10}"></div>
      <button class="btn btn-primary btn-full" style="margin-top:1rem;" onclick="saveTariff()">Save Tariff Configuration</button>
    </div>
    <div class="card">
      <div class="card-title">Bill Simulator</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Usage (m³)</th><th>Water Charge</th><th>Standing</th><th>Total Bill</th></tr></thead>
        <tbody id="tariffSim">
        ${sims.map(u=>{
          const water=u*s.rate;const total=water+(s.standing||200);
          return `<tr id="sim-${u}"><td>${u} m³</td><td>${fmtKES(water)}</td><td>${fmtKES(s.standing||200)}</td><td style="font-weight:700;color:var(--accent);">${fmtKES(total)}</td></tr>`;
        }).join('')}
        </tbody>
      </table></div>
    </div>
  </div>`;
}

function updateTariffSim(){
  const rate=parseFloat(q('#t-rate')?.value)||150;
  const standing=parseFloat(q('#t-standing')?.value)||200;
  const vat=q('#t-vat')?.checked;
  const vatRate=0.16;
  [5,10,20,35,60,100].forEach(u=>{
    const row=el('sim-'+u);
    if(!row)return;
    let water=u*rate;
    if(vat)water*=(1+vatRate);
    const total=water+standing;
    const cells=row.querySelectorAll('td');
    if(cells[1])cells[1].textContent=fmtKES(Math.round(water));
    if(cells[2])cells[2].textContent=fmtKES(standing);
    if(cells[3]){cells[3].textContent=fmtKES(Math.round(total));}
  });
}

function saveTariff(){
  const s=STORE.get('settings')||{};
  const oldRate=s.rate||150;
  const oldStanding=s.standing||200;
  s.rate=parseFloat(q('#t-rate')?.value)||150;
  s.standing=parseFloat(q('#t-standing')?.value)||200;
  s.minUnits=parseFloat(q('#t-min')?.value)||5;
  s.vat=q('#t-vat')?.checked;
  s.vatRate=parseFloat(q('#t-vatrate')?.value)||16;
  s.penalty=q('#t-pen')?.checked;
  s.penaltyRate=parseFloat(q('#t-penrate')?.value)||10;
  s.tariffEffectiveDate=new Date().toISOString().split('T')[0];
  STORE.set('settings',s);
  updateTariffSim();
  const changed=[];
  if(oldRate!==s.rate)changed.push(`Rate: KES ${oldRate} → KES ${s.rate}/m³`);
  if(oldStanding!==s.standing)changed.push(`Standing: KES ${oldStanding} → KES ${s.standing}`);
  openModal('✅ Tariff Configuration Saved',`
    <div style="text-align:center;padding:.5rem;">
      <div style="font-size:2rem;margin-bottom:.75rem;">⚙️</div>
      <p style="font-weight:700;">New tariff is now active</p>
      <p style="font-size:.82rem;color:var(--muted);margin-top:.4rem;">Effective from: <strong>${fmtDate(s.tariffEffectiveDate)}</strong></p>
      ${changed.length?`<div style="margin-top:.85rem;background:rgba(0,194,255,.08);border-radius:8px;padding:.75rem;text-align:left;">
        ${changed.map(c=>`<div style="font-size:.83rem;padding:.2rem 0;">🔄 ${c}</div>`).join('')}
      </div>`:''}
      <p style="font-size:.78rem;color:var(--yellow);margin-top:.85rem;">⚠️ New rates apply to all bills generated from today. Existing bills are not affected.</p>
    </div>`,
    `<button class="btn btn-primary btn-sm" onclick="closeModal(true)">OK, Got it</button>`
  );
}

function bilPenalties(){
  const bills=STORE.get('bills')||[];
  const customers=STORE.get('customers')||[];
  const s=STORE.get('settings')||{penaltyRate:10};
  const overdue=bills.filter(b=>b.status==='overdue'||b.status==='unpaid'&&new Date(b.dueDate)<new Date());
  return `
  <div class="section-head"><div class="section-title">Overdue Bills – Apply Penalties</div>
    <button class="btn btn-red btn-sm" onclick="applyAllPenalties()">Apply All Penalties</button>
  </div>
  ${overdue.length?`<div class="tbl-wrap"><table>
    <thead><tr><th>Invoice</th><th>Customer</th><th>Balance</th><th>Due Date</th><th>Days Late</th><th>Penalty (${s.penaltyRate||10}%)</th><th>Action</th></tr></thead>
    <tbody>
    ${overdue.map(b=>{
      const c=customers.find(x=>x.id===b.customerId);
      const days=Math.max(0,Math.round((new Date()-new Date(b.dueDate))/86400000));
      const pen=Math.round(b.balance*(s.penaltyRate||10)/100);
      return `<tr>
        <td style="font-family:var(--mono);font-size:.8rem;">${b.invoiceNo}</td>
        <td>${c?c.name:'—'}</td>
        <td style="color:var(--red);">${fmtKES(b.balance)}</td>
        <td>${fmtDate(b.dueDate)}</td>
        <td style="color:var(--red);">${days} days</td>
        <td style="color:var(--yellow);">${fmtKES(pen)}</td>
        <td><button class="btn btn-sm btn-yellow" onclick="applyPenalty('${b.id}',${pen})">Apply</button></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`:`<div class="empty"><span class="icon">✅</span><p>No overdue bills requiring penalties</p></div>`}`;
}

function applyPenalty(billId,pen){
  const bills=STORE.get('bills')||[];
  const b=bills.find(x=>x.id===billId);
  if(b){b.penalty=(b.penalty||0)+pen;b.total+=pen;b.balance+=pen;b.status='overdue';STORE.set('bills',bills);toast('Penalty applied','success');navigateTo('billing');}
}

function applyAllPenalties(){
  const bills=STORE.get('bills')||[];
  const s=STORE.get('settings')||{penaltyRate:10};
  let count=0;
  bills.forEach(b=>{
    if((b.status==='overdue'||b.status==='unpaid')&&new Date(b.dueDate)<new Date()){
      const pen=Math.round(b.balance*(s.penaltyRate||10)/100);
      b.penalty=(b.penalty||0)+pen;b.total+=pen;b.balance+=pen;b.status='overdue';count++;
    }
  });
  STORE.set('bills',bills);toast(`${count} penalties applied`,'success');navigateTo('billing');
}

}

  const custId=el('pay-cust')?.value;

  const custBills=bills.filter(b=>b.customerId===custId&&b.balance>0);
  sel.innerHTML=custBills.length
    ?`<option value="">-- Select Invoice --</option>${custBills.map(b=>`<option value="${b.id}">${b.invoiceNo} – ${fmtPeriod(b.period)} – Bal: ${fmtKES(b.balance)}</option>`).join('')}`
    :`<option value="">No outstanding bills</option>`;
}

function loadBillDetails(){
  const billId=el('pay-bill')?.value;
  const bills=STORE.get('bills')||[];

  const det=el('bill-details');
