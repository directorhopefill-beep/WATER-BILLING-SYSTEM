function calcBalance(){
  const custId=el('pay-cust')?.value;
  const billId=el('pay-bill')?.value;
  const bills=STORE.get('bills')||[];
  const customers=STORE.get('customers')||[];
  const b=bills.find(x=>x.id===billId);
  const c=customers.find(x=>x.id===custId);
  const amount=parseFloat(el('pay-amount')?.value)||0;
  const preview=el('pay-balance-preview');
  if(!b||!preview)return;
  const currentCredit=c?.credit||0;
  const billBalance=b.balance;
  const appliedToBill=Math.min(amount,billBalance);
  const overpaid=Math.max(0,amount-billBalance);
  const newBal=Math.max(0,billBalance-appliedToBill);
  const newCredit=currentCredit+overpaid;
  preview.style.display='block';
  preview.innerHTML=`
    <div style="background:rgba(0,194,255,.08);border:1px solid rgba(0,194,255,.2);border-radius:8px;padding:.85rem;font-size:.85rem;margin-bottom:.75rem;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.3rem .75rem;">
        <div style="color:var(--muted);">Bill Balance</div><div style="font-weight:600;">${fmtKES(billBalance)}</div>
        <div style="color:var(--muted);">Amount Paying</div><div style="font-weight:600;color:var(--accent);">${fmtKES(amount)}</div>
        <div style="color:var(--muted);">Applied to Bill</div><div style="font-weight:600;color:var(--green);">${fmtKES(appliedToBill)}</div>
        <div style="color:var(--muted);">Remaining Balance</div>
        <div style="font-weight:700;color:${newBal>0?'var(--red)':'var(--green)'};">${fmtKES(newBal)} ${newBal===0?'✓ PAID':''}</div>
        ${overpaid>0?`
        <div style="color:var(--muted);">Overpayment / Credit</div><div style="font-weight:700;color:var(--accent);">${fmtKES(overpaid)}</div>
        <div style="color:var(--muted);">New Credit Balance</div><div style="font-weight:700;color:var(--accent);">${fmtKES(newCredit)}</div>
        `:''}
        ${currentCredit>0&&overpaid===0?`<div style="color:var(--muted);">Existing Credit</div><div style="color:var(--accent);">${fmtKES(currentCredit)}</div>`:''}
      </div>
      ${overpaid>0?`<div style="margin-top:.6rem;padding-top:.6rem;border-top:1px solid rgba(0,194,255,.2);font-size:.78rem;color:var(--accent);">💡 Overpayment of ${fmtKES(overpaid)} will be saved as credit and auto-deducted from next bill.</div>`:''}
    </div>`;
}

function submitPayment(){
  const custId=el('pay-cust')?.value;
  const billId=el('pay-bill')?.value;
  const amount=parseFloat(el('pay-amount')?.value)||0;
  const method=el('pay-method')?.value;
  if(!custId||!billId||!amount){toast('Please fill all required fields','error');return;}
  const bills=STORE.get('bills')||[];
  const b=bills.find(x=>x.id===billId);
  if(!b){toast('Bill not found','error');return;}
  if(amount<=0){toast('Enter a valid amount','error');return;}

  const customers=STORE.get('customers')||[];
  const c=customers.find(x=>x.id===custId);
  if(!c){toast('Customer not found','error');return;}

  // --- Overpayment logic ---
  const prevCredit=c.credit||0;
  const billBalance=b.balance;
  const totalAvailable=amount; // what the customer is paying now
  let appliedToBill=Math.min(amount,billBalance);
  let overpaid=Math.max(0,amount-billBalance);

  b.paid+=appliedToBill;
  b.balance=Math.max(0,b.balance-appliedToBill);
  if(b.balance<=0){b.balance=0;b.status='paid';}
  STORE.set('bills',bills);

  // Store new credit balance on customer
  const newCredit=prevCredit+overpaid;
  c.credit=Math.round(newCredit*100)/100;
  STORE.set('customers',customers);

  const ref=el('pay-ref')?.value||'PMT'+Math.random().toString().slice(2,8).toUpperCase();
  const payments=STORE.get('payments')||[];
  const payDate=new Date().toISOString().split('T')[0];
  const receiptNo='RCT-'+String(payments.length+1).padStart(4,'0');
  const payId='p'+uid();
  payments.push({
    id:payId,customerId:custId,billId,amount,
    appliedToBill,overpaid,creditAfter:newCredit,
    method,reference:ref,
    date:payDate,note:el('pay-note')?.value||'',
    receiptNo,approved:true,approvedBy:currentUser?.name||'Admin'
  });
  STORE.set('payments',payments);

  // Notification message
  let notifMsg=`${fmtKES(amount)} received via ${method}. Receipt No: ${receiptNo}.`;
  if(overpaid>0) notifMsg+=` Overpayment of ${fmtKES(overpaid)} credited to account.`;

  const notifs=STORE.get('notifications')||[];
  notifs.unshift({
    id:'n'+uid(),type:'payment',to:custId,
    title:`Payment Approved – ${c?.name}`,
    msg:notifMsg,date:payDate,read:false,priority:'normal'
  });
  STORE.set('notifications',notifs);

  // Build receipt panel
  const receipt=el('pay-receipt');
  if(receipt){
    receipt.style.display='block';
    receipt.innerHTML=`
    <div style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:1.25rem;">
      <p style="color:var(--green);font-weight:700;font-size:1rem;">✅ Payment Posted & Approved</p>
      <div style="margin:.75rem 0;display:grid;grid-template-columns:1fr 1fr;gap:.4rem .75rem;font-size:.83rem;">
        <div style="color:var(--muted);">Amount Paid</div><div style="font-weight:700;">${fmtKES(amount)}</div>
        <div style="color:var(--muted);">Applied to Bill</div><div style="font-weight:700;color:var(--green);">${fmtKES(appliedToBill)}</div>
        ${overpaid>0?`<div style="color:var(--muted);">Overpayment / Credit</div><div style="font-weight:700;color:var(--accent);">${fmtKES(overpaid)}</div>`:''}
        ${newCredit>0?`<div style="color:var(--muted);">Total Credit Balance</div><div style="font-weight:700;color:var(--accent);">${fmtKES(newCredit)}</div>`:''}
        <div style="color:var(--muted);">Method</div><div>${method}</div>
        <div style="color:var(--muted);">Reference</div><div style="font-family:var(--mono);font-size:.8rem;">${ref}</div>
        <div style="color:var(--muted);">Receipt No.</div><div style="font-family:var(--mono);font-size:.8rem;">${receiptNo}</div>
      </div>
      ${overpaid>0?`<div style="background:rgba(0,194,255,.1);border:1px solid rgba(0,194,255,.25);border-radius:8px;padding:.65rem .85rem;font-size:.8rem;color:var(--accent);margin-bottom:.75rem;">
        💡 <strong>Credit of ${fmtKES(overpaid)} recorded.</strong> It will automatically reduce ${c?.name}'s next bill.
      </div>`:''}
      <div style="display:flex;gap:.65rem;flex-wrap:wrap;">
        <button class="btn btn-sm btn-primary" onclick="printReceipt('${payId}')">🖨️ Print Receipt</button>
        <button class="btn btn-sm btn-outline" onclick="downloadReceiptPDF('${payId}')">⬇️ Download Receipt</button>
      </div>
    </div>`;
  }
  toast(overpaid>0
    ? `${fmtKES(amount)} posted. ${fmtKES(overpaid)} credited to account.`
    : `Payment of ${fmtKES(amount)} posted! Receipt: ${receiptNo}`
  ,'success');
}

function filterReceipts(val){
  const v=val.toLowerCase();
  qa('.receipt-card').forEach(card=>{
    card.style.display=card.dataset.search.includes(v)?'':'none';
  });
}

// ── RECEIPT ENGINE ──
function buildReceiptHTML(payId,mode){
  const payments=STORE.get('payments')||[];
  const customers=STORE.get('customers')||[];
  const bills=STORE.get('bills')||[];
  const readings=STORE.get('readings')||[];
  const settings=STORE.get('settings')||{};
  const p=payments.find(x=>x.id===payId);
  if(!p)return null;
  const c=customers.find(x=>x.id===p.customerId)||{};
  const b=bills.find(x=>x.id===p.billId)||{};

  // Get reading for this bill's period
  const meters=STORE.get('meters')||[];
  const meter=meters.find(m=>m.customerId===c.id)||{};
  const reading=readings.find(r=>r.customerId===c.id&&r.period===b.period)||null;

  const prevReading=b.prevReading!==undefined?b.prevReading:(reading?reading.prev:'—');
  const currReading=b.currReading!==undefined?b.currReading:(reading?reading.curr:'—');
  const units=b.units!==undefined?b.units:(reading?reading.units:'—');
  const rate=b.rate||settings.rate||150;
  const standing=b.standing!==undefined?b.standing:(settings.standing||200);
  const water=b.water!==undefined?b.water:(typeof units==='number'?units*rate:0);
  const vatAmt=b.vatAmt||0;
  const penalty=b.penalty||0;
  const prevBal=b.prevBal||0;

  const rNo=p.receiptNo||('RCT-'+p.id.slice(-4).toUpperCase());
  const company=settings.company||'H2O Water Limited';
  const tagline=settings.tagline||'Clean Water for Every Home';
  const address=settings.address||'Nairobi, Kenya';
  const phone=settings.phone||'';
  const email=settings.email||'';
  const paybill=settings.paybill||'';

  const isPrint=mode==='print';
  const bg=isPrint?'#fff':'#0f1117';
  const text=isPrint?'#111':'#e2e8f0';
  const muted=isPrint?'#555':'#94a3b8';
  const accent=isPrint?'#0070f3':'#00c2ff';
  const green=isPrint?'#16a34a':'#22c55e';
  const border=isPrint?'#e5e7eb':'#1e2535';
  const cardBg=isPrint?'#f8fafc':'#161b27';
  const sectionBg=isPrint?'#f0f7ff':'rgba(0,194,255,.06)';

  return `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Receipt ${rNo}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:${bg};color:${text};padding:2rem;}
    .receipt{max-width:520px;margin:0 auto;background:${cardBg};border:1px solid ${border};border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12);}
    .header{background:${isPrint?'#0070f3':'linear-gradient(135deg,#0070f3,#00c2ff)'};color:#fff;padding:1.5rem 1.75rem;text-align:center;}
    .header h1{font-size:1.4rem;font-weight:800;letter-spacing:.02em;}
    .header p{font-size:.8rem;opacity:.85;margin-top:.2rem;}
    .header .rno{display:inline-block;background:rgba(255,255,255,.2);padding:.3rem .9rem;border-radius:20px;font-size:.8rem;margin-top:.7rem;font-weight:700;letter-spacing:.06em;}
    .stamp{display:flex;align-items:center;justify-content:center;gap:1rem;padding:1.25rem 1.75rem;border-bottom:2px dashed ${border};background:${isPrint?'#f0fff4':'rgba(34,197,94,.06)'};}
    .stamp .amount{font-size:2rem;font-weight:800;color:${green};}
    .stamp .approved{font-size:.78rem;color:${green};font-weight:700;text-align:center;}
    .section{padding:1.1rem 1.75rem;border-bottom:1px solid ${border};}
    .section-title{font-size:.7rem;font-weight:700;letter-spacing:.1em;color:${accent};margin-bottom:.65rem;text-transform:uppercase;}
    .row{display:flex;justify-content:space-between;align-items:center;padding:.32rem 0;font-size:.83rem;}
    .row .lbl{color:${muted};}
    .row .val{font-weight:600;text-align:right;}
    .row .val.mono{font-family:monospace;font-size:.82rem;color:${accent};}
    .reading-box{background:${sectionBg};border:1px solid ${border};border-radius:8px;padding:.85rem;margin:.4rem 0;}
    .reading-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;text-align:center;}
    .reading-grid .rg-label{font-size:.68rem;color:${muted};margin-bottom:.2rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
    .reading-grid .rg-val{font-size:1.1rem;font-weight:800;font-family:monospace;color:${text};}
    .reading-grid .rg-val.highlight{color:${accent};}
    .divider{height:1px;background:${border};margin:.2rem 0;}
    .charge-row{display:flex;justify-content:space-between;align-items:center;padding:.3rem 0;font-size:.83rem;}
    .charge-row .lbl{color:${muted};}
    .charge-row .val{font-weight:600;}
    .total-row{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;font-size:1rem;font-weight:800;color:${accent};border-top:2px solid ${border};margin-top:.3rem;}
    .paid-row{display:flex;justify-content:space-between;padding:.35rem 0;font-size:.85rem;color:${green};font-weight:700;}
    .balance-row{display:flex;justify-content:space-between;padding:.35rem 0;font-size:.85rem;font-weight:700;}
    .footer{background:${isPrint?'#f8fafc':'rgba(0,194,255,.04)'};padding:1rem 1.75rem;text-align:center;}
    .footer .logo{font-weight:800;color:${accent};font-size:.9rem;}
    .footer p{font-size:.73rem;color:${muted};line-height:1.7;margin-top:.2rem;}
    @media print{body{padding:0;}@page{margin:.5cm;}}</style>
  </head><body>
  <div class="receipt">

    <!-- HEADER -->
    <div class="header">
      <h1>${company}</h1>
      <p>${tagline}</p>
      <div class="rno">RECEIPT # ${rNo}</div>
    </div>

    <!-- PAYMENT STAMP -->
    <div class="stamp">
      <div>
        <div class="amount">${fmtKES(p.amount)}</div>
        <div class="approved">✅ Payment Approved & Confirmed</div>
      </div>
    </div>

    <!-- CUSTOMER DETAILS -->
    <div class="section">
      <div class="section-title">Customer Details</div>
      <div class="row"><span class="lbl">Name</span><span class="val">${c.name||'—'}</span></div>
      <div class="row"><span class="lbl">Meter Number</span><span class="val mono">${c.meter||'—'}</span></div>
      <div class="row"><span class="lbl">Phone</span><span class="val">${c.phone||'—'}</span></div>
      <div class="row"><span class="lbl">Area / Zone</span><span class="val">${c.area||'—'}</span></div>
      <div class="row"><span class="lbl">Customer Type</span><span class="val">${c.type||'Residential'}</span></div>
    </div>

    <!-- METER READINGS -->
    <div class="section">
      <div class="section-title">Meter Readings — ${b.period?fmtPeriod(b.period):'—'}</div>
      <div class="reading-box">
        <div class="reading-grid">
          <div>
            <div class="rg-label">Previous</div>
            <div class="rg-val">${prevReading!=='—'?prevReading+' m³':'—'}</div>
          </div>
          <div>
            <div class="rg-label">Current</div>
            <div class="rg-val highlight">${currReading!=='—'?currReading+' m³':'—'}</div>
          </div>
          <div>
            <div class="rg-label">Units Used</div>
            <div class="rg-val highlight">${units!=='—'?units+' m³':'—'}</div>
          </div>
        </div>
      </div>
      ${reading?.source==='estimated'||b.estimated?`<p style="font-size:.72rem;color:#f59e0b;margin-top:.4rem;">⚠️ Usage estimated from consumption trend — meter not read this period</p>`:''}
    </div>

    <!-- BILL BREAKDOWN -->
    <div class="section">
      <div class="section-title">Bill Breakdown</div>
      <div class="charge-row"><span class="lbl">Water Charge (${units!=='—'?units:'?'} m³ × KES ${rate}/m³)</span><span class="val">${fmtKES(water)}</span></div>
      <div class="charge-row"><span class="lbl">Monthly Standing Charge</span><span class="val">${fmtKES(standing)}</span></div>
      ${vatAmt?`<div class="charge-row"><span class="lbl">VAT (${settings.vatRate||16}%)</span><span class="val">${fmtKES(vatAmt)}</span></div>`:''}
      ${prevBal?`<div class="charge-row"><span class="lbl">Previous Balance</span><span class="val" style="color:#ef4444;">${fmtKES(prevBal)}</span></div>`:''}
      ${penalty?`<div class="charge-row"><span class="lbl">Late Payment Penalty</span><span class="val" style="color:#f59e0b;">${fmtKES(penalty)}</span></div>`:''}
      ${b.grossTotal&&b.creditApplied?`<div class="charge-row"><span class="lbl">Gross Total</span><span class="val">${fmtKES(b.grossTotal)}</span></div>`:''}
      ${b.creditApplied?`<div class="charge-row"><span class="lbl" style="color:${accent};">Credit Applied</span><span class="val" style="color:${accent};">− ${fmtKES(b.creditApplied)}</span></div>`:''}
      <div class="total-row"><span>TOTAL BILLED</span><span>${fmtKES(b.total||0)}</span></div>
    </div>

    <!-- PAYMENT SUMMARY -->
    <div class="section">
      <div class="section-title">Payment Details</div>
      <div class="row"><span class="lbl">Invoice No.</span><span class="val mono">${b.invoiceNo||'—'}</span></div>
      <div class="row"><span class="lbl">Billing Period</span><span class="val">${b.period?fmtPeriod(b.period):'—'}</span></div>
      <div class="row"><span class="lbl">Due Date</span><span class="val">${fmtDate(b.dueDate)}</span></div>
      <div class="row"><span class="lbl">Payment Date</span><span class="val">${fmtDate(p.date)}</span></div>
      <div class="row"><span class="lbl">Payment Method</span><span class="val">${p.method}</span></div>
      <div class="row"><span class="lbl">Transaction Ref.</span><span class="val mono">${p.reference}</span></div>
      <div class="row"><span class="lbl">Approved By</span><span class="val">${p.approvedBy||'Admin'}</span></div>
      <div class="divider"></div>
      <div class="paid-row"><span>Amount Paid</span><span>${fmtKES(p.amount)}</span></div>
      <div class="balance-row" style="color:${Math.max(0,(b.total||0)-(b.paid||0))>0?'#ef4444':green};">
        <span>Remaining Balance</span><span>${fmtKES(Math.max(0,(b.total||0)-(b.paid||0)))}</span>
      </div>
      ${p.note?`<div class="row"><span class="lbl">Note</span><span class="val">${p.note}</span></div>`:''}
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="logo">${company}</div>
      <p>${address}${phone?' · '+phone:''}</p>
      ${email?`<p>${email}</p>`:''}
      ${paybill?`<p>M-Pesa Paybill: <strong>${paybill}</strong></p>`:''}
      <p>Thank you for your payment. Please retain this receipt.<br>Generated: ${new Date().toLocaleString('en-KE')}</p>
    </div>
  </div>
  </body></html>`;
}

function printReceipt(payId){
  const html=buildReceiptHTML(payId,'print');
  if(!html){toast('Payment not found','error');return;}
  const w=window.open('','_blank','width=560,height=700');
  w.document.write(html);
  w.document.close();
  w.onload=()=>{w.print();};
}

function downloadReceiptPDF(payId){
  const html=buildReceiptHTML(payId,'dark');
  if(!html){toast('Payment not found','error');return;}
  const payments=STORE.get('payments')||[];
  const p=payments.find(x=>x.id===payId);
  const rNo=p?.receiptNo||payId;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`Receipt_${rNo}.html`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Receipt ${rNo} downloaded`,'success');
}

function payStatement(){
  const customers=STORE.get('customers')||[];
  return `
  <div class="section-head"><div class="section-title">Customer Statement</div></div>
  <div class="form-group" style="max-width:360px;">
    <label>Select Customer</label>
    <select id="stmt-cust" onchange="loadStatement()">
      <option value="">-- Select Customer --</option>
      ${customers.map(c=>`<option value="${c.id}">${c.name} (${c.meter})</option>`).join('')}
    </select>
  </div>
  <div id="stmt-content"></div>`;
}

function loadStatement(){
  const custId=el('stmt-cust')?.value;
  const content=el('stmt-content');
  if(!custId||!content){if(content)content.innerHTML='';return;}
  const bills=STORE.get('bills')||[];
  const payments=STORE.get('payments')||[];
  const customers=STORE.get('customers')||[];
  const c=customers.find(x=>x.id===custId);
  const custBills=bills.filter(b=>b.customerId===custId);
  const custPays=payments.filter(p=>p.customerId===custId);
  const totalBilled=custBills.reduce((s,b)=>s+b.total,0);
  const totalPaid=custBills.reduce((s,b)=>s+b.paid,0);
  const balance=custBills.reduce((s,b)=>s+b.balance,0);

  let events=[];
  custBills.forEach(b=>events.push({date:b.genDate,type:'bill',label:`Invoice ${b.invoiceNo} – ${fmtPeriod(b.period)}`,amount:-b.total}));
  custPays.forEach(p=>events.push({date:p.date,type:'payment',label:`Payment – ${p.method} (${p.reference})`,amount:p.amount}));
  events.sort((a,b)=>a.date.localeCompare(b.date));
  let running=0;

  content.innerHTML=`
  <div class="cust-banner" style="margin-top:1rem;">
    <div class="avatar">${(c?.name||'U')[0]}</div>
    <div><h3>${c?.name}</h3><p style="font-size:.85rem;color:rgba(255,255,255,.7);">${c?.meter} · ${c?.area}</p></div>
    <div style="margin-left:auto;display:flex;gap:2rem;">
      <div style="text-align:center;"><p style="font-size:.75rem;color:rgba(255,255,255,.6);">Total Billed</p><p style="font-weight:700;">${fmtKES(totalBilled)}</p></div>
      <div style="text-align:center;"><p style="font-size:.75rem;color:rgba(255,255,255,.6);">Total Paid</p><p style="font-weight:700;color:var(--green);">${fmtKES(totalPaid)}</p></div>
      <div style="text-align:center;"><p style="font-size:.75rem;color:rgba(255,255,255,.6);">Balance Due</p><p style="font-weight:700;color:${balance?'var(--red)':'var(--green)'};">${fmtKES(balance)}</p></div>
    </div>
  </div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Date</th><th>Description</th><th>Debit (Bill)</th><th>Credit (Payment)</th><th>Running Balance</th></tr></thead>
    <tbody>
    ${events.map(e=>{
      running+=(e.type==='bill'?e.amount:e.amount);
      const isPayment=e.type==='payment';
      return `<tr style="background:${isPayment?'rgba(34,197,94,.05)':''};">
        <td style="font-size:.8rem;">${fmtDate(e.date)}</td>
        <td>${e.label}</td>
        <td style="color:var(--red);">${!isPayment?fmtKES(-e.amount):'—'}</td>
        <td style="color:var(--green);">${isPayment?fmtKES(e.amount):'—'}</td>
        <td style="font-weight:600;color:${running>-0.01?'var(--green)':'var(--red)'};">${fmtKES(Math.abs(running))}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}

function paySummary(){
  const payments=STORE.get('payments')||[];
  const bills=STORE.get('bills')||[];
  const totalBilled=bills.reduce((s,b)=>s+b.total,0);
  const totalCollected=payments.reduce((s,p)=>s+p.amount,0);
  const outstanding=bills.reduce((s,b)=>s+b.balance,0);
  const rate=totalBilled?Math.round(totalCollected/totalBilled*100):0;
  const methods={};
  payments.forEach(p=>{methods[p.method]=(methods[p.method]||0)+p.amount;});
  const rateColor=rate>=90?'var(--green)':rate>=70?'var(--yellow)':'var(--red)';
  return `
  <div class="grid g3" style="margin-bottom:1.5rem;">
    <div class="kpi" style="border-top:3px solid var(--accent);"><div class="kpi-label">Total Billed</div><div class="kpi-val" style="color:var(--accent);">${fmtKES(totalBilled)}</div></div>
    <div class="kpi" style="border-top:3px solid var(--green);"><div class="kpi-label">Total Collected</div><div class="kpi-val" style="color:var(--green);">${fmtKES(totalCollected)}</div></div>
    <div class="kpi" style="border-top:3px solid var(--red);"><div class="kpi-label">Outstanding</div><div class="kpi-val" style="color:var(--red);">${fmtKES(outstanding)}</div></div>
  </div>
  <div class="grid g2">
    <div class="card">
      <div class="card-title">Revenue by Payment Method</div>
      ${Object.entries(methods).map(([m,v])=>{const pct=Math.round(v/totalCollected*100)||0;return `<div style="margin-bottom:.75rem;"><div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.3rem;"><span>${m}</span><strong>${fmtKES(v)} (${pct}%)</strong></div><div class="progress"><div class="progress-fill progress-blue" style="width:${pct}%"></div></div></div>`;}).join('')}
    </div>
    <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div class="card-title" style="text-align:center;width:100%;">Collection Rate</div>
      <div style="font-size:4rem;font-weight:700;color:${rateColor};">${rate}%</div>
      <p style="color:var(--muted);font-size:.85rem;">of total billed amount</p>
      <div class="progress" style="width:100%;margin-top:1rem;height:12px;"><div class="progress-fill" style="width:${rate}%;background:${rateColor};"></div></div>
      <p style="font-size:.78rem;color:var(--muted);margin-top:.5rem;">${rate>=90?'🟢 Excellent':'rate>=70'?'🟡 Good':'🔴 Needs attention'}</p>
    </div>
  </div>`;
}

function custDirectory(){

  return `

      const stBadge=c.status==='active'?'badge-green':'badge-gray';
      return `<tr>
        <td><div style="display:flex;align-items:center;gap:.65rem;"><div class="avatar" style="width:32px;height:32px;font-size:.8rem;">${c.name[0]}</div><div><p style="font-weight:600;font-size:.88rem;">${c.name}</p><p style="font-size:.72rem;color:var(--muted);">${c.email}</p></div></div></td>
        <td style="font-family:var(--mono);color:var(--accent);font-size:.85rem;">${c.meter}</td>
        <td><span class="badge badge-blue">${c.type}</span></td>
        <td>${c.area}</td>
        <td style="font-size:.85rem;">${c.phone}</td>
        <td style="font-weight:700;color:${bal?'var(--red)':'var(--green)'};">${fmtKES(bal)}</td>
        <td><span class="badge ${stBadge}">${c.status}</span></td>

function filterCustomers(val){
  qa('#custTbody tr').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(val.toLowerCase())?'':'none';});
}
function filterCustStatus(val){
  qa('#custTbody tr').forEach(r=>{r.style.display=!val||r.textContent.toLowerCase().includes(val)?'':'none';});
}
function filterCustType(val){
  qa('#custTbody tr').forEach(r=>{r.style.display=!val||r.textContent.toLowerCase().includes(val)?'':'none';});
}
function toggleCustStatus(id){
  const customers=STORE.get('customers')||[];
  const c=customers.find(x=>x.id===id);
  if(c){c.status=c.status==='active'?'inactive':'active';STORE.set('customers',customers);toast(`Customer ${c.status}`,'success');navigateTo('customers');}
}

function viewCustProfile(id){
  // Switch to profile tab and load that customer
  mTab(q('[onclick*="cust-prof-admin"]'),'cust-prof-admin');
  setTimeout(()=>{
    const sel=el('cpAdmin-cust');
    if(sel){sel.value=id;loadCustProfileAdmin();}
  },50);
}

function custProfileAdmin(){

  return `

function loadCustProfileAdmin(){

    <div class="kpi"><div class="kpi-label">Balance Due</div><div class="kpi-val" style="font-size:1.4rem;color:${balance?'var(--red)':'var(--green)'};">${fmtKES(balance)}</div></div>
    <div class="kpi"><div class="kpi-label">Collection Rate</div><div class="kpi-val" style="font-size:1.4rem;color:${rateColor};">${collRate}%</div></div>

function ncMeterChange(val){
  const wrap=q('#nc-manual-wrap');
  const display=q('#nc-uname-display');
  if(val==='__manual__'){
    if(wrap)wrap.style.display='';
    if(display)display.value='';
  } else {
    if(wrap)wrap.style.display='none';
    if(display)display.value=val||'';
    // auto-fill area from meter data
    if(val){
      const meters=STORE.get('meters')||[];
      const m=meters.find(x=>x.meterNo===val);
      if(m){
        const areaEl=q('#nc-area');
        const typeEl=q('#nc-type');
        if(areaEl&&!areaEl.value)areaEl.value=m.area||'';
        if(typeEl&&m.type){
          [...typeEl.options].forEach(o=>{if(o.value===m.type)o.selected=true;});
        }
      }
    }
  }
}

function ncAutoPass(){
  const phone=q('#nc-phone')?.value.trim()||'';
  const passEl=q('#nc-pass');
  if(passEl&&phone.length>=4&&!passEl._userEdited){
    passEl.value=phone.slice(-4)+'water';
  }
}

function ncGenPass(){
  const chars='abcdefghjkmnpqrstuvwxyz23456789';
  let p='';for(let i=0;i<8;i++)p+=chars[Math.floor(Math.random()*chars.length)];
  const passEl=q('#nc-pass');
  if(passEl){passEl.value=p;passEl._userEdited=true;}
}

  navigateTo('customers');

  },80);
}

function saveNewCustomer(){
  const name=q('#nc-name')?.value.trim();
  const phone=q('#nc-phone')?.value.trim();
  const meterSel=q('#nc-meter')?.value;
  const meterManual=q('#nc-meter-manual')?.value.trim();
  const meter=meterSel==='__manual__'?meterManual:meterSel;
  const pass=q('#nc-pass')?.value.trim();

  if(!name){toast('Full name is required','error');return;}
  if(!meter){toast('Please assign a meter number','error');return;}
  if(!pass){toast('Password is required','error');return;}

  const customers=STORE.get('customers')||[];
  if(customers.find(c=>c.meter===meter)){toast('That meter number is already assigned to another customer','error');return;}

  const id='c'+uid();
  customers.push({
    id,name,meter,
    email:q('#nc-email')?.value.trim(),
    phone,
    idNo:q('#nc-idno')?.value.trim(),
    area:q('#nc-area')?.value.trim(),
    address:q('#nc-addr')?.value.trim(),
    type:q('#nc-type')?.value||'Residential',
    status:'active',
    joinDate:q('#nc-date')?.value,
    password:pass,
    notes:[]
  });
  STORE.set('customers',customers);

  // Link meter to customer if it exists in meters table
  const meters=STORE.get('meters')||[];
  const mi=meters.findIndex(m=>m.meterNo===meter);
  if(mi>-1){meters[mi].customerId=id;STORE.set('meters',meters);}

  // Show success card
  q('#nc-form-card').style.display='none';
  const sc=q('#nc-success-card');
  sc.style.display='';
  q('#nc-success-subtitle').textContent=`${name} has been added to the system.`;
  q('#nc-cred-user').textContent=meter;
  q('#nc-cred-pass').textContent=pass;
  q('#nc-cred-name').textContent=name;
  q('#nc-cred-phone').textContent=phone||'—';

  // Notification
  const notifs=STORE.get('notifications')||[];
  notifs.unshift({id:'n'+uid(),type:'info',to:'admin',title:`New Customer Registered – ${name}`,
    msg:`${name} (${meter}) has been registered. Portal login created.`,
    date:new Date().toISOString().split('T')[0],read:false,priority:'normal'});
  STORE.set('notifications',notifs);
  toast(`${name} registered successfully!`,'success');
}

function custBulk(){
  const customers=STORE.get('customers')||[];
  const csvData=customers.map(c=>`${c.name},${c.meter},${c.area},${c.phone},${c.email},${c.status},${c.type},${c.joinDate}`).join('\n');
  return `

    <p style="color:var(--muted);font-size:.88rem;margin-bottom:1.25rem;">Perform bulk actions on filtered customer groups.</p>
    <div class="form-row">
      <div class="form-group"><label>Filter by Area</label><input id="bulk-area" placeholder="e.g. Westlands"></div>
      <div class="form-group"><label>Filter by Status</label><select id="bulk-status"><option value="">All</option><option>active</option><option>inactive</option></select></div>
    </div>
    <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-top:.5rem;">
      <button class="btn btn-sm btn-green" onclick="bulkActivate()">Activate Filtered ✅</button>
      <button class="btn btn-sm btn-red" onclick="bulkDeactivate()">Deactivate Filtered 🚫</button>
      <button class="btn btn-sm btn-outline" onclick="exportCSV()">Export to CSV 📥</button>
    </div>
    <div id="bulk-result" style="margin-top:1rem;"></div>
  </div>`;
}

function getBulkFiltered(){
  const customers=STORE.get('customers')||[];
  const area=q('#bulk-area')?.value?.toLowerCase();
  const status=q('#bulk-status')?.value;
  return customers.filter(c=>
    (!area||c.area.toLowerCase().includes(area))&&(!status||c.status===status)
  );
}

function bulkActivate(){
  const customers=STORE.get('customers')||[];
  const filtered=getBulkFiltered();
  filtered.forEach(f=>{const c=customers.find(x=>x.id===f.id);if(c)c.status='active';});
  STORE.set('customers',customers);
  el('bulk-result').innerHTML=`<div class="badge badge-green">${filtered.length} customers activated</div>`;
  toast(`${filtered.length} customers activated`,'success');
}

function bulkDeactivate(){
  const customers=STORE.get('customers')||[];
  const filtered=getBulkFiltered();
  filtered.forEach(f=>{const c=customers.find(x=>x.id===f.id);if(c)c.status='inactive';});
  STORE.set('customers',customers);
  el('bulk-result').innerHTML=`<div class="badge badge-yellow">${filtered.length} customers deactivated</div>`;
  toast(`${filtered.length} customers deactivated`,'warning');
}

function exportCSV(){
  const customers=STORE.get('customers')||[];
  const header='Name,Meter,Area,Phone,Email,Status,Type,JoinDate';
  const rows=customers.map(c=>`${c.name},${c.meter},${c.area},${c.phone},${c.email},${c.status},${c.type},${c.joinDate}`);
  const blob=new Blob([header+'\n'+rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='h2o_customers.csv';a.click();
  toast('CSV exported!','success');
}

function repOverview(){
  const bills=STORE.get('bills')||[];
  const payments=STORE.get('payments')||[];
  const customers=STORE.get('customers')||[];
  const meters=STORE.get('meters')||[];
  const totalBilled=bills.reduce((s,b)=>s+b.total,0);
  const totalRev=payments.reduce((s,p)=>s+p.amount,0);
  const outstanding=bills.reduce((s,b)=>s+b.balance,0);
  const totalUnits=bills.reduce((s,b)=>s+b.units,0);
  const paid=bills.filter(b=>b.status==='paid').length;
  const unpaid=bills.filter(b=>b.status==='unpaid').length;
  const overdue=bills.filter(b=>b.status==='overdue').length;

  const avgPerCust=customers.length?Math.round(totalRev/customers.length):0;
  const faultyM=meters.filter(m=>m.status==='faulty').length;

  return `
  <div class="grid g4" style="margin-bottom:1.5rem;">
    <div class="kpi"><div class="kpi-icon">💰</div><div class="kpi-label">Total Revenue</div><div class="kpi-val" style="color:var(--accent);">${fmtKES(totalRev)}</div></div>
    <div class="kpi"><div class="kpi-icon">🧾</div><div class="kpi-label">Total Billed</div><div class="kpi-val">${fmtKES(totalBilled)}</div></div>
    <div class="kpi"><div class="kpi-icon">⚠️</div><div class="kpi-label">Outstanding</div><div class="kpi-val" style="color:var(--red);">${fmtKES(outstanding)}</div></div>
    <div class="kpi"><div class="kpi-icon">💧</div><div class="kpi-label">Total Units Sold</div><div class="kpi-val">${totalUnits} m³</div></div>
    <div class="kpi"><div class="kpi-icon">📈</div><div class="kpi-label">Collection Rate</div><div class="kpi-val" style="color:${collRate>=80?'var(--green)':'var(--red)'};">${collRate}%</div></div>
    <div class="kpi"><div class="kpi-icon">👤</div><div class="kpi-label">Avg per Customer</div><div class="kpi-val" style="font-size:1.4rem;">${fmtKES(avgPerCust)}</div></div>
    <div class="kpi"><div class="kpi-icon">✅</div><div class="kpi-label">Paid Bills</div><div class="kpi-val" style="color:var(--green);">${paid}</div></div>
    <div class="kpi"><div class="kpi-icon">🔧</div><div class="kpi-label">Meter Uptime</div><div class="kpi-val" style="color:${meterUptime>=90?'var(--green)':'var(--yellow)'};">${meterUptime}%</div></div>
  </div>
  <div class="grid g3">
    <div class="card" style="text-align:center;">
      <div class="card-title">Bill Status</div>
      <div style="font-size:3rem;font-weight:700;color:var(--green);">${paid}</div><p style="color:var(--muted);">Paid</p>
      <div style="display:flex;gap:1rem;justify-content:center;margin-top:1rem;">
        <div><div style="font-size:1.5rem;font-weight:700;color:var(--yellow);">${unpaid}</div><p style="font-size:.8rem;color:var(--muted);">Unpaid</p></div>
        <div><div style="font-size:1.5rem;font-weight:700;color:var(--red);">${overdue}</div><p style="font-size:.8rem;color:var(--muted);">Overdue</p></div>
      </div>
    </div>
    <div class="card" style="text-align:center;">
      <div class="card-title">Collection Rate</div>
      <div style="font-size:3.5rem;font-weight:700;color:${collRate>=80?'var(--green)':collRate>=60?'var(--yellow)':'var(--red)'};">${collRate}%</div>
      <div class="progress" style="margin-top:1rem;"><div class="progress-fill" style="width:${collRate}%;background:${collRate>=80?'var(--green)':collRate>=60?'var(--yellow)':'var(--red)'}"></div></div>
      <p style="font-size:.8rem;color:var(--muted);margin-top:.5rem;">${collRate>=80?'Excellent performance 🟢':collRate>=60?'Needs improvement 🟡':'Critical – take action 🔴'}</p>
    </div>
    <div class="card" style="text-align:center;">
      <div class="card-title">Meter Health</div>
      <div style="font-size:3.5rem;font-weight:700;color:${meterUptime>=90?'var(--green)':'var(--yellow)'};">${meterUptime}%</div>
      <p style="color:var(--muted);font-size:.85rem;">Uptime</p>

function repMonthly(){
  const bills=STORE.get('bills')||[];
  const periods=[...new Set(bills.map(b=>b.period))].sort().reverse().slice(0,6);
  return `
  <div class="card">
    <div class="card-title">Monthly Performance</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Period</th><th>Bills Generated</th><th>Total Billed</th><th>Collected</th><th>Outstanding</th><th>Collection Rate</th></tr></thead>
      <tbody>
      ${periods.map(p=>{
        const pb=bills.filter(b=>b.period===p);
        const billed=pb.reduce((s,b)=>s+b.total,0);
        const collected=pb.reduce((s,b)=>s+b.paid,0);
        const outstanding=pb.reduce((s,b)=>s+b.balance,0);
        const rate=billed?Math.round(collected/billed*100):0;
        const rateColor=rate>=80?'var(--green)':rate>=60?'var(--yellow)':'var(--red)';
        return `<tr>
          <td style="font-weight:600;">${fmtPeriod(p)}</td>
          <td>${pb.length}</td>
          <td>${fmtKES(billed)}</td>
          <td style="color:var(--green);">${fmtKES(collected)}</td>
          <td style="color:var(--red);">${fmtKES(outstanding)}</td>
          <td><div style="display:flex;align-items:center;gap:.5rem;"><div class="progress" style="flex:1;"><div class="progress-fill" style="width:${rate}%;background:${rateColor};"></div></div><span style="color:${rateColor};font-size:.82rem;font-weight:700;">${rate}%</span></div></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>
  </div>`;
}

function repCustomers(){
  const customers=STORE.get('customers')||[];
  const bills=STORE.get('bills')||[];
  const custStats=customers.map(c=>{
    const cb=bills.filter(b=>b.customerId===c.id);
    return {
      ...c,
      totalBilled:cb.reduce((s,b)=>s+b.total,0),
      totalPaid:cb.reduce((s,b)=>s+b.paid,0),
      balance:cb.reduce((s,b)=>s+b.balance,0),
      units:cb.reduce((s,b)=>s+b.units,0),
      bills:cb.length,
      overdue:cb.filter(b=>b.status==='overdue').length
    };
  });
  const topConsumers=[...custStats].sort((a,b)=>b.units-a.units).slice(0,5);
  const topDebtors=[...custStats].sort((a,b)=>b.balance-a.balance).filter(c=>c.balance>0).slice(0,5);
  const maxUnits=topConsumers[0]?.units||1;
  return `
  <div class="grid g2" style="margin-bottom:1.5rem;">
    <div class="card">
      <div class="card-title">Top Consumers 💧</div>
      ${topConsumers.map((c,i)=>`
        <div style="margin-bottom:.75rem;">
          <div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.3rem;">
            <span>${i+1}. ${c.name}</span><strong>${c.units} m³</strong>
          </div>
          <div class="progress"><div class="progress-fill progress-blue" style="width:${Math.round(c.units/maxUnits*100)}%"></div></div>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="card-title">Highest Outstanding Debt ⚠️</div>
      ${topDebtors.length?topDebtors.map((c,i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border);">
          <div><p style="font-size:.88rem;font-weight:600;">${i+1}. ${c.name}</p><p style="font-size:.72rem;color:var(--muted);">${c.meter}</p></div>
          <span style="color:var(--red);font-weight:700;">${fmtKES(c.balance)}</span>
        </div>`).join(''):`<div class="empty" style="padding:1rem;"><span class="icon">✅</span><p>No outstanding debt</p></div>`}
    </div>
  </div>
  <div class="card">
    <div class="card-title">All Customers Performance</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Customer</th><th>Meter</th><th>Bills</th><th>Units</th><th>Billed</th><th>Paid</th><th>Balance</th><th>Overdue</th></tr></thead>
      <tbody>
      ${custStats.map(c=>`<tr>
        <td>${c.name}</td>
        <td style="font-family:var(--mono);font-size:.8rem;">${c.meter}</td>
        <td>${c.bills}</td><td>${c.units} m³</td>
        <td>${fmtKES(c.totalBilled)}</td>
        <td style="color:var(--green);">${fmtKES(c.totalPaid)}</td>
        <td style="color:${c.balance?'var(--red)':'var(--green)'};">${fmtKES(c.balance)}</td>
        <td>${c.overdue?`<span class="badge badge-red">${c.overdue}</span>`:'-'}</td>
      </tr>`).join('')}
      </tbody>
    </table></div>
  </div>`;
}

function repAreas(){
  const customers=STORE.get('customers')||[];
  const bills=STORE.get('bills')||[];
  const areas=[...new Set(customers.map(c=>c.area))];
  const areaData=areas.map(area=>{
    const custIds=customers.filter(c=>c.area===area).map(c=>c.id);
    const ab=bills.filter(b=>custIds.includes(b.customerId));
    const billed=ab.reduce((s,b)=>s+b.total,0);
    const collected=ab.reduce((s,b)=>s+b.paid,0);
    const units=ab.reduce((s,b)=>s+b.units,0);
    const overdue=ab.filter(b=>b.status==='overdue').length;
    const rate=billed?Math.round(collected/billed*100):100;
    return {area,customers:custIds.length,billed,collected,units,overdue,rate};
  });
  return `
  <div class="tbl-wrap">
    <table><thead><tr><th>Area</th><th>Customers</th><th>Units Sold</th><th>Total Billed</th><th>Collected</th><th>Overdue Bills</th><th>Collection Rate</th></tr></thead>
    <tbody>
    ${areaData.map(a=>{
      const rc=a.rate>=80?'var(--green)':a.rate>=60?'var(--yellow)':'var(--red)';
      return `<tr>
        <td style="font-weight:700;">${a.area}</td>
        <td>${a.customers}</td><td>${a.units} m³</td>
        <td>${fmtKES(a.billed)}</td>
        <td style="color:var(--green);">${fmtKES(a.collected)}</td>
        <td>${a.overdue?`<span class="badge badge-red">${a.overdue}</span>`:'-'}</td>
        <td><div style="display:flex;align-items:center;gap:.5rem;"><div class="progress" style="flex:1;width:80px;"><div class="progress-fill" style="width:${a.rate}%;background:${rc};"></div></div><strong style="color:${rc};">${a.rate}%</strong></div></td>
      </tr>`;
    }).join('')}
    </tbody></table>
  </div>`;
}

function repAging(){
  const bills=STORE.get('bills')||[];
  const customers=STORE.get('customers')||[];
  const now=new Date();
  const buckets={'Current':[],'1-30 days':[],'31-60 days':[],'60+ days':[]};
  bills.filter(b=>b.balance>0).forEach(b=>{
    const days=Math.max(0,Math.round((now-new Date(b.dueDate))/86400000));
    if(days<=0)buckets['Current'].push({...b,days});
    else if(days<=30)buckets['1-30 days'].push({...b,days});
    else if(days<=60)buckets['31-60 days'].push({...b,days});
    else buckets['60+ days'].push({...b,days});
  });
  const bColors={'Current':'var(--green)','1-30 days':'var(--yellow)','31-60 days':'var(--red)','60+ days':'var(--red)'};
  return `
  <div class="grid g4" style="margin-bottom:1.5rem;">
    ${Object.entries(buckets).map(([label,items])=>{
      const total=items.reduce((s,b)=>s+b.balance,0);
      return `<div class="kpi" style="border-top:3px solid ${bColors[label]};"><div class="kpi-label">${label}</div><div class="kpi-val" style="color:${bColors[label]};font-size:1.4rem;">${fmtKES(total)}</div><div class="kpi-sub">${items.length} bill(s)</div></div>`;
    }).join('')}
  </div>
  <div class="card">
    <div class="card-title">Accounts Receivable Aging Table</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Invoice</th><th>Customer</th><th>Period</th><th>Due Date</th><th>Days Late</th><th>Balance</th><th>Bucket</th></tr></thead>
      <tbody>
      ${bills.filter(b=>b.balance>0).map(b=>{
        const c=customers.find(x=>x.id===b.customerId);
        const days=Math.max(0,Math.round((now-new Date(b.dueDate))/86400000));
        const bucket=days<=0?'Current':days<=30?'1-30 days':days<=60?'31-60 days':'60+ days';
        return `<tr>
          <td style="font-family:var(--mono);font-size:.8rem;">${b.invoiceNo}</td>
          <td>${c?c.name:'—'}</td>
          <td>${fmtPeriod(b.period)}</td>
          <td>${fmtDate(b.dueDate)}</td>
          <td style="color:${days>0?'var(--red)':'var(--muted)'};">${days}</td>
          <td style="font-weight:700;color:var(--red);">${fmtKES(b.balance)}</td>
          <td><span class="badge" style="background:rgba(0,0,0,.2);color:${bColors[bucket]};">${bucket}</span></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>
  </div>`;
}

function renderNotifications(){
  return `
  <div class="mod-tabs">

    <button class="mod-tab" onclick="mTab(this,'notif-compose')">✉️ Compose</button>

  </div>

    <div class="mod-panel active" id="notif-inbox">${notifInbox()}</div>
    <div class="mod-panel" id="notif-compose">${notifCompose()}</div>
    <div class="mod-panel" id="notif-alerts">${notifAlerts()}</div>

}

function notifInbox(){
  const notifs=STORE.get('notifications')||[];
  const total=notifs.length, unread=notifs.filter(n=>!n.read).length;
  const typeColors={overdue:'overdue-n',payment:'payment-n',bill:'info-n',meter:'overdue-n',system:'info-n',info:'info-n'};
  const typeIcons={overdue:'⚠️',payment:'✅',bill:'🧾',meter:'🔧',system:'⚙️',info:'ℹ️'};
  return `
  <div class="stats-row" style="margin-bottom:1rem;">
    <div class="stat-chip"><span>Total: </span><strong>${total}</strong></div>
    <div class="stat-chip"><span>Unread: </span><strong style="color:var(--accent);">${unread}</strong></div>
    <div style="margin-left:auto;display:flex;gap:.5rem;">
      <button class="btn btn-sm btn-outline" onclick="markAllRead()">Mark All Read ✓</button>
    </div>
  </div>
  ${notifs.length?notifs.map(n=>`
    <div class="notif-item ${typeColors[n.type]||'info-n'} ${!n.read?'unread':''}">
      <div class="notif-icon">${typeIcons[n.type]||'ℹ️'}</div>
      <div class="notif-body" style="flex:1;">
        <p>${n.title} ${n.priority==='high'?'<span class="badge badge-red" style="font-size:.65rem;">HIGH</span>':''}</p>
        <span>${n.msg}</span>
        <p style="font-size:.72rem;color:var(--muted);margin-top:.3rem;">${fmtDate(n.date)}</p>
      </div>
      ${!n.read?`<button class="btn-icon" onclick="markNotifRead('${n.id}')">✓</button>`:''}
    </div>`).join(''):`<div class="empty"><span class="icon">📭</span><p>No notifications</p></div>`}`;
}

function markAllRead(){
  const notifs=STORE.get('notifications')||[];
  notifs.forEach(n=>n.read=true);
  STORE.set('notifications',notifs);
  toast('All marked as read','success');
  navigateTo('notifications');
}

function markNotifRead(id){
  const notifs=STORE.get('notifications')||[];
  const n=notifs.find(x=>x.id===id);
  if(n){n.read=true;STORE.set('notifications',notifs);navigateTo('notifications');}
}

function notifCompose(){
  const customers=STORE.get('customers')||[];
  return `
  <div class="grid g2">
    <div class="card">
      <div class="card-title">Compose Notification</div>

        <p style="font-weight:600;margin-bottom:.4rem;">Notification Title</p>
        <p style="font-size:.85rem;color:var(--muted);">Your message will appear here...</p>
        <p style="font-size:.72rem;color:var(--muted);margin-top:.5rem;">${fmtDate(new Date().toISOString().split('T')[0])}</p>
      </div>

function ncPreview(){
  const title=q('#nc-title')?.value||'Notification Title';
  const msg=q('#nc-msg')?.value||'Your message will appear here...';
  const priority=q('#nc-priority')?.value;
  const typeColors={info:'var(--accent)',overdue:'var(--red)',payment:'var(--green)',bill:'var(--purple)',meter:'var(--yellow)',system:'var(--muted)'};
  const type=q('#nc-type')?.value||'info';
  const prev=el('nc-preview-card');
  if(prev)prev.innerHTML=`
    <p style="font-weight:600;margin-bottom:.4rem;">${title} ${priority==='high'?'<span class="badge badge-red" style="font-size:.65rem;">HIGH</span>':''}</p>
    <p style="font-size:.85rem;color:var(--muted);">${msg}</p>
    <p style="font-size:.72rem;color:var(--muted);margin-top:.5rem;">${fmtDate(new Date().toISOString().split('T')[0])}</p>`;
  if(prev)prev.style.borderLeftColor=typeColors[type]||'var(--accent)';
}

function sendNotification(){
  const title=q('#nc-title')?.value?.trim();
  const msg=q('#nc-msg')?.value?.trim();
  if(!title||!msg){toast('Enter title and message','error');return;}
  const notifs=STORE.get('notifications')||[];
  notifs.unshift({
    id:'n'+uid(),type:q('#nc-type')?.value||'info',to:q('#nc-to')?.value||'all',
    title,msg,date:new Date().toISOString().split('T')[0],read:false,
    priority:q('#nc-priority')?.value||'normal'
  });
  STORE.set('notifications',notifs);
  toast('Notification sent!','success');
  navigateTo('notifications');
}

function notifAlerts(){
  const bills=STORE.get('bills')||[];
  const customers=STORE.get('customers')||[];
  const meters=STORE.get('meters')||[];

    <button class="btn btn-primary btn-sm" onclick="sendAllAlerts()">Send All Alerts 🚀</button>
  </div>
  ${overdueBills.map(b=>{
    const c=customers.find(x=>x.id===b.customerId);
    return `<div class="notif-item overdue-n">
      <div class="notif-icon">⚠️</div>
      <div class="notif-body" style="flex:1;"><p>${c?.name} – Overdue Bill (${b.invoiceNo})</p><span>Balance: ${fmtKES(b.balance)} for ${fmtPeriod(b.period)}</span></div>

      <div class="notif-icon">🔧</div>

    </div>`;
  }).join('')}

function sendAlert(type,to,title,msg){
  const notifs=STORE.get('notifications')||[];
  notifs.unshift({id:'n'+uid(),type,to,title,msg,date:new Date().toISOString().split('T')[0],read:false,priority:'high'});
  STORE.set('notifications',notifs);
  toast('Alert sent!','success');
}

function sendAllAlerts(){
  const bills=STORE.get('bills')||[];
  const customers=STORE.get('customers')||[];
  const meters=STORE.get('meters')||[];
  const notifs=STORE.get('notifications')||[];
  bills.filter(b=>b.status==='overdue').forEach(b=>{
    const c=customers.find(x=>x.id===b.customerId);
    notifs.unshift({id:'n'+uid(),type:'overdue',to:b.customerId,title:`Overdue Bill – ${c?.name}`,msg:`Your bill ${b.invoiceNo} of ${fmtKES(b.balance)} is overdue.`,date:new Date().toISOString().split('T')[0],read:false,priority:'high'});
  });
  meters.filter(m=>m.status==='faulty').forEach(m=>{
    notifs.unshift({id:'n'+uid(),type:'meter',to:m.customerId||'admin',title:`Faulty Meter – ${m.meterNo}`,msg:`Meter ${m.meterNo} has been flagged as faulty.`,date:new Date().toISOString().split('T')[0],read:false,priority:'high'});
  });
  STORE.set('notifications',notifs);
  toast('All alerts sent!','success');
  navigateTo('notifications');
}

function notifTemplates(){
  const templates=[
    {icon:'⚠️',title:'Overdue Reminder',msg:'Dear Customer, your water bill of [AMOUNT] for [PERIOD] is overdue. Please pay immediately to avoid service disconnection.'},
    {icon:'✅',title:'Payment Confirmed',msg:'Dear Customer, we have received your payment of [AMOUNT] via [METHOD]. Reference: [REF]. Thank you!'},
    {icon:'🧾',title:'New Bill Ready',msg:'Dear Customer, your bill for [PERIOD] is ready. Amount due: [AMOUNT]. Due date: [DATE]. Pay via M-Pesa Paybill 891234.'},
    {icon:'🔧',title:'Meter Maintenance',msg:'Dear Customer, our technician will visit your premises on [DATE] for meter maintenance. Kindly be available.'},
    {icon:'💧',title:'Service Interruption',msg:'Dear Customer, water supply in your area will be interrupted on [DATE] from [TIME] to [TIME] for maintenance work. We apologize for the inconvenience.'},
    {icon:'👋',title:'Welcome New Customer',msg:'Welcome to H2O Water Limited! Your meter number is [METER]. Access your billing portal at our website. For queries, call 0700 123 456.'},
    {icon:'📢',title:'Rate Change Notice',msg:'Dear Customer, please note that our water tariff will change from [DATE]. New rate: KES [RATE] per m³. Contact us for more information.'},
    {icon:'🌿',title:'Conservation Alert',msg:'Dear Customer, your water usage this month is [X]% above average. We encourage water conservation. Report any leaks immediately.'},
  ];
  window._notifTemplates = templates;
  return `
  <div class="grid g2">
    ${templates.map((t,i)=>`
      <div class="card" style="cursor:pointer;" onclick="useTemplate(${i})" title="Click to use this template">
        <div style="font-size:1.5rem;margin-bottom:.5rem;">${t.icon}</div>
        <p style="font-weight:700;margin-bottom:.5rem;">${t.title}</p>
        <p style="font-size:.82rem;color:var(--muted);line-height:1.5;">${t.msg.substring(0,100)}…</p>
        <div style="margin-top:.75rem;"><button class="btn btn-sm btn-outline">Use Template →</button></div>
      </div>`).join('')}
  </div>`;
}

function useTemplate(i){
  const t=window._notifTemplates&&window._notifTemplates[i];
  if(!t)return;
  const title=t.title,msg=t.msg;
  mTab(q('[onclick*="notif-compose"]'),'notif-compose');
  setTimeout(()=>{
    const ti=el('nc-title'),mi=el('nc-msg');
    if(ti)ti.value=title;
    if(mi)mi.value=msg;
    ncPreview();
  },50);
}

function createBackup(){
  const data={customers:STORE.get('customers'),bills:STORE.get('bills'),payments:STORE.get('payments'),meters:STORE.get('meters'),settings:STORE.get('settings'),backupDate:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`h2o_backup_${new Date().toISOString().split('T')[0]}.json`;a.click();
  toast('Backup created and downloaded!','success');
}

function restoreBackup(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.customers)STORE.set('customers',data.customers);
      if(data.bills)STORE.set('bills',data.bills);
      if(data.payments)STORE.set('payments',data.payments);
      if(data.meters)STORE.set('meters',data.meters);
      if(data.settings)STORE.set('settings',data.settings);
      el('backup-result').innerHTML=`<div class="badge badge-green" style="margin-top:.75rem;">✅ Backup restored successfully</div>`;
      toast('Data restored from backup!','success');
    }catch(err){toast('Invalid backup file','error');}
  };
  reader.readAsText(file);
}

function renderCustUsage(){
  const bills=STORE.get('bills')||[];
  const custBills=bills.filter(b=>b.customerId===currentUser.id).sort((a,b)=>a.period.localeCompare(b.period));
  if(!custBills.length)return`<div class="empty"><span class="icon">📈</span><p>No usage data available yet</p></div>`;
  const units=custBills.map(b=>b.units);
  const totalUnits=units.reduce((s,u)=>s+u,0);
  const avgUnits=Math.round(totalUnits/units.length);
  const maxUnits=Math.max(...units);
  const minUnits=Math.min(...units);
  const maxMonth=custBills[units.indexOf(maxUnits)];
  const minMonth=custBills[units.indexOf(minUnits)];
  const latest=custBills[custBills.length-1];
  const prev=custBills[custBills.length-2];
  const trend=prev?((latest.units-prev.units)/prev.units*100).toFixed(1):null;
  return `
  <div class="grid g4" style="margin-bottom:1.5rem;">
    <div class="kpi"><div class="kpi-icon">💧</div><div class="kpi-label">Total Consumed</div><div class="kpi-val">${totalUnits} m³</div></div>
    <div class="kpi"><div class="kpi-icon">📊</div><div class="kpi-label">Monthly Average</div><div class="kpi-val">${avgUnits} m³</div></div>
    <div class="kpi"><div class="kpi-icon">🔝</div><div class="kpi-label">Highest Month</div><div class="kpi-val" style="color:var(--red);">${maxUnits} m³</div><div class="kpi-sub">${fmtPeriod(maxMonth?.period)}</div></div>
    <div class="kpi"><div class="kpi-icon">📉</div><div class="kpi-label">Lowest Month</div><div class="kpi-val" style="color:var(--green);">${minUnits} m³</div><div class="kpi-sub">${fmtPeriod(minMonth?.period)}</div></div>
  </div>
  ${trend!==null?`<div style="padding:.75rem 1rem;border-radius:10px;margin-bottom:1rem;background:rgba(${parseFloat(trend)>0?'239,68,68':'34,197,94'},.1);border:1px solid rgba(${parseFloat(trend)>0?'239,68,68':'34,197,94'},.25);">
    <span style="color:${parseFloat(trend)>0?'var(--red)':'var(--green)'};font-weight:600;">${parseFloat(trend)>0?'📈':'📉'} ${Math.abs(parseFloat(trend))}% ${parseFloat(trend)>0?'increase':'decrease'}</span> compared to last month
  </div>`:''}
  <div class="card" style="margin-bottom:1rem;">
    <div class="card-title">Monthly Consumption</div>
    <div style="padding-bottom:28px;">
      <div class="bar-chart">
        ${custBills.slice(-8).map(b=>{
          const h=Math.max(8,Math.round(b.units/maxUnits*90));
          const color=b.units===maxUnits?'var(--red)':b.units===minUnits?'var(--green)':'var(--accent2)';
          return `<div class="bar" style="height:${h}px;background:${color};"><span class="bar-val" style="font-size:.62rem;">${b.units}</span><span class="bar-label">${b.period.slice(0,7)}</span></div>`;
        }).join('')}
      </div>
    </div>
  </div>
  <div class="tbl-wrap">
    <table><thead><tr><th>Period</th><th>Units (m³)</th><th>Bill Amount</th><th>vs. Average</th><th>Status</th></tr></thead>
    <tbody>
    ${custBills.map(b=>{
      const diff=b.units-avgUnits;
      const stBadge={paid:'badge-green',unpaid:'badge-yellow',overdue:'badge-red'}[b.status]||'badge-gray';
      return `<tr>
        <td>${fmtPeriod(b.period)}</td>
        <td style="font-weight:700;">${b.units} m³</td>
        <td>${fmtKES(b.total)}</td>
        <td style="color:${diff>0?'var(--red)':'var(--green)'};font-size:.85rem;">${diff>0?'+':''}${diff} m³</td>
        <td><span class="badge ${stBadge}">${b.status}</span></td>
      </tr>`;
    }).join('')}
    </tbody></table>
  </div>`;
}

function changeCustPass(){
  const curr=q('#pr-curr')?.value;
  const newP=q('#pr-new')?.value;
  const conf=q('#pr-conf')?.value;
  if(curr!==currentUser.password){toast('Current password incorrect','error');return;}
  if(newP!==conf){toast('Passwords do not match','error');return;}
  if(!newP||newP.length<6){toast('Password must be at least 6 characters','error');return;}
  const customers=STORE.get('customers')||[];
  const c=customers.find(x=>x.id===currentUser.id);
  if(c){c.password=newP;STORE.set('customers',customers);currentUser.password=newP;}
  toast('Password changed successfully!','success');
}

function mTab(btn,panelId){
  // Find all tabs in the same container
  const tabsContainer=btn.closest('.mod-tabs');
  if(tabsContainer){qa('.mod-tab',tabsContainer).forEach(t=>t.classList.remove('active'));btn.classList.add('active');}
  // Find all panels (siblings of the tab container, or in the next element)
  const contentDiv=tabsContainer?.nextElementSibling;
  if(contentDiv){qa('.mod-panel',contentDiv).forEach(p=>p.classList.remove('active'));}
  const panel=el(panelId);
  if(panel)panel.classList.add('active');
}

      el('loginPage').classList.remove('hidden');
    },400);
  },1800);
});
