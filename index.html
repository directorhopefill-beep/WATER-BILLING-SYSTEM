const UserDash = ({ user, store, onLogout }) => {
  const { bills, payments, setPayments, setBills } = store;
  const [page, setPage] = useState("overview");
  const [payModal, setPayModal] = useState(null);
  const [payForm, setPayForm] = useState({ method:"M-Pesa", ref:"", amount:"" });
  const [toast, setToast] = useState(null);
  const [sideOpen, setSideOpen] = useState(false);

  const showToast = (msg,type="success") => { setToast({msg,type}); setTimeout(()=>setToast(null),3000); };

  const myBills = useMemo(()=> bills.filter(b=>b.userId===user.id).sort((a,b)=>b.year!==a.year?b.year-a.year:b.month-a.month), [bills, user.id]);
  const myPayments = payments.filter(p=>p.userId===user.id);
  const totalBilled = myBills.reduce((s,b)=>s+b.amount,0);
  const totalPaid = myPayments.reduce((s,p)=>s+p.amount,0);
  const balance = totalBilled - totalPaid;
  const lastBill = myBills[0];

  const billPayments = bid => myPayments.filter(p=>p.billId===bid);
  const billPaid = bid => billPayments(bid).reduce((s,p)=>s+p.amount,0);

  const submitPayment = (bill) => {
    const amt = Number(payForm.amount||bill.amount);
    const np = { id:uid(), userId:user.id, billId:bill.id, amount:amt, date:today(), method:payForm.method, ref:payForm.ref||`REF-${uid().toUpperCase()}` };
    const newPayments = [...payments, np];
    setPayments(newPayments);
    const paid = newPayments.filter(p=>p.billId===bill.id).reduce((s,p)=>s+p.amount,0);
    if (paid>=bill.amount) setBills(bills.map(b=>b.id===bill.id?{...b,status:"paid"}:b));
    showToast("Payment recorded! Thank you.");
    setPayModal(null);
  };

  // Consumption trend data
  const trendData = myBills.slice(0,6).reverse().map(b=>({ lbl:MONTHS[b.month-1], val:b.units }));

  const navItems = [
    { id:"overview",       icon:"home",  label:"Overview"         },
    { id:"bills",          icon:"bill",  label:"My Bills"         },
    { id:"payments",       icon:"pay",   label:"Payments"         },
    { id:"usage",          icon:"chart", label:"Usage"            },
    { id:"meter",          icon:"meter", label:"My Meter"         },
    { id:"notifications",  icon:"bell",  label:"Notifications"    },
    { id:"profile",        icon:"edit",  label:"My Profile"       },
    { id:"support",        icon:"bell",  label:"Help & Support"   },
  ];

  const Sidebar = () => (
    <div style={{ width:220, background:"linear-gradient(180deg,#0a2540 0%,#0d3a60 100%)", minHeight:"100vh", display:"flex", flexDirection:"column" }}>
      <div style={{ padding:"28px 20px 20px", borderBottom:"1px solid rgba(255,255,255,0.08)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ background:"rgba(0,180,216,0.25)", borderRadius:10, width:36, height:36, display:"flex", alignItems:"center", justifyContent:"center" }}>
            <Icon name="drop" size={18} color="#00b4d8"/>
          </div>
          <div>
            <div style={{ color:"#fff", fontWeight:800, fontSize:15, fontFamily:"'Playfair Display',serif" }}>AquaFlow</div>
            <div style={{ color:"rgba(255,255,255,0.45)", fontSize:11 }}>My Account</div>
          </div>
        </div>
        {/* Profile */}
        <div style={{ marginTop:20, background:"rgba(255,255,255,0.07)", borderRadius:12, padding:14 }}>
          <div style={{ width:40, height:40, background:"linear-gradient(135deg,#0077b6,#00b4d8)", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:17, marginBottom:8 }}>
            {user.name.charAt(0)}
          </div>
          <div style={{ color:"#fff", fontWeight:700, fontSize:14 }}>{user.name}</div>
          <div style={{ color:"rgba(255,255,255,0.5)", fontSize:12, fontFamily:"monospace" }}>{user.meterNo}</div>
          <div style={{ color:"rgba(255,255,255,0.4)", fontSize:11, marginTop:2 }}>{user.area}</div>
        </div>
      </div>
      <nav style={{ flex:1, padding:"16px 12px" }}>
        {navItems.map(n=>(
          <button key={n.id} onClick={()=>{ setPage(n.id); setSideOpen(false); }}
            style={{ width:"100%", display:"flex", alignItems:"center", gap:12, padding:"11px 14px", borderRadius:12, border:"none", cursor:"pointer", marginBottom:4, fontWeight:600, fontSize:13, transition:"all .2s",
              background: page===n.id ? "rgba(0,180,216,0.2)" : "transparent",
              color: page===n.id ? "#00b4d8" : "rgba(255,255,255,0.6)", textAlign:"left" }}>
            <Icon name={n.icon} size={18} color={page===n.id?"#00b4d8":"rgba(255,255,255,0.5)"}/>
            {n.label}
          </button>
        ))}
      </nav>
      <div style={{ padding:"16px 12px", borderTop:"1px solid rgba(255,255,255,0.08)" }}>
        <button onClick={onLogout} style={{ width:"100%", display:"flex", alignItems:"center", gap:12, padding:"11px 14px", borderRadius:12, border:"none", cursor:"pointer", background:"rgba(239,68,68,0.15)", color:"#fca5a5", fontWeight:600, fontSize:13 }}>
          <Icon name="logout" size={18} color="#fca5a5"/>Logout
        </button>
      </div>
    </div>
  );

  const renderPage = () => {
    if (page==="overview") return (
      <div>
        <h2 style={h2style}>My Overview</h2>
        {/* Account summary */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:16, marginBottom:24 }}>
          <StatCard icon="bill"  label="Total Billed"    value={fmtKES(totalBilled)} sub="All time" color="#0077b6" accent="#dbeafe"/>
          <StatCard icon="check" label="Total Paid"      value={fmtKES(totalPaid)}   sub="All time" color="#059669" accent="#d1fae5"/>
          <StatCard icon="warn"  label="Balance Due"     value={fmtKES(balance)}     sub={balance>0?"Outstanding":"All clear"} color={balance>0?"#dc2626":"#059669"} accent="#fee2e2"/>
          <StatCard icon="meter" label="Last Reading"    value={lastBill?`${lastBill.currReading} m³`:"—"} sub={lastBill?`${MONTHS[lastBill.month-1]} ${lastBill.year}`:"—"} color="#7c3aed" accent="#ede9fe"/>
        </div>

        {/* Current bill highlight */}
        {lastBill && lastBill.status!=="paid" && (
          <div style={{ background: lastBill.status==="overdue" ? "linear-gradient(135deg,#7f1d1d,#dc2626)" : "linear-gradient(135deg,#0a2540,#0077b6)", borderRadius:20, padding:24, color:"#fff", marginBottom:24, position:"relative", overflow:"hidden" }}>
            <div style={{ position:"absolute", right:-20, top:-20, width:120, height:120, background:"rgba(255,255,255,0.07)", borderRadius:"50%" }}/>
            <div style={{ position:"absolute", right:30, bottom:-30, width:80, height:80, background:"rgba(255,255,255,0.05)", borderRadius:"50%" }}/>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:16 }}>
              <div>
                {lastBill.status==="overdue" && <div style={{ background:"rgba(255,255,255,0.2)", borderRadius:20, padding:"4px 12px", fontSize:12, fontWeight:700, display:"inline-block", marginBottom:8 }}>⚠️ OVERDUE</div>}
                <div style={{ fontSize:14, opacity:0.8, marginBottom:6 }}>Current Bill — {MONTHS[lastBill.month-1]} {lastBill.year}</div>
                <div style={{ fontSize:38, fontWeight:800, lineHeight:1 }}>{fmtKES(lastBill.amount)}</div>
                <div style={{ marginTop:10, fontSize:13, opacity:0.7 }}>
                  <span>{lastBill.units} m³ used</span> · <span>Due: {lastBill.dueDate}</span> · <span>Rate: KES {RATE_PER_UNIT}/m³</span>
                </div>
              </div>
              <button onClick={()=>{ setPayForm({method:"M-Pesa",ref:"",amount:lastBill.amount}); setPayModal(lastBill); }}
                style={{ background:"#fff", color:"#0a2540", border:"none", borderRadius:14, padding:"12px 24px", fontWeight:800, fontSize:15, cursor:"pointer", whiteSpace:"nowrap" }}>
                Pay Now →
              </button>
            </div>
          </div>
        )}
        {lastBill && lastBill.status==="paid" && (
          <div style={{ background:"linear-gradient(135deg,#065f46,#059669)", borderRadius:20, padding:20, color:"#fff", marginBottom:24, display:"flex", alignItems:"center", gap:16 }}>
            <div style={{ background:"rgba(255,255,255,0.15)", borderRadius:"50%", width:48, height:48, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <Icon name="check" size={24} color="#fff"/>
            </div>
            <div>
              <div style={{ fontWeight:800, fontSize:16 }}>All Paid Up! ✓</div>
              <div style={{ opacity:0.8, fontSize:13 }}>Your {MONTHS[lastBill.month-1]} {lastBill.year} bill of {fmtKES(lastBill.amount)} is fully paid.</div>
            </div>
          </div>
        )}

        {/* Consumption trend */}
        <div style={{ background:"#fff", borderRadius:18, padding:22, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" }}>
          <h3 style={{ margin:"0 0 16px", fontSize:15, color:"#0a2540", fontWeight:700 }}>My Consumption Trend (m³)</h3>
          <MiniBar data={trendData} color="#0077b6"/>
          {trendData.length>1 && (() => {
            const last2 = trendData.slice(-2);
            const diff = last2[1].val - last2[0].val;
            const pct = last2[0].val ? Math.abs(Math.round((diff/last2[0].val)*100)) : 0;
            return (
              <p style={{ margin:"12px 0 0", fontSize:13, color: diff>0?"#dc2626":"#059669" }}>
                {diff>0 ? `⬆ ${pct}% more than last month` : diff<0 ? `⬇ ${pct}% less than last month` : "Same as last month"}
              </p>
            );
          })()}
        </div>
      </div>
    );

    if (page==="bills") return (
      <div>
        <h2 style={h2style}>My Bills</h2>
        <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
          {myBills.length===0 && <div style={{ textAlign:"center", color:"#94a8b8", padding:40 }}>No bills yet.</div>}
          {myBills.map(b=>{
            const paid = billPaid(b.id);
            const remaining = b.amount - paid;
            const pct = Math.min(100, Math.round((paid/b.amount)*100));
            return (
              <div key={b.id} style={{ background:"#fff", borderRadius:18, padding:20, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border: b.status==="overdue"?"1.5px solid #fca5a5":"1px solid #e8f4fd" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:12, marginBottom:14 }}>
                  <div>
                    <div style={{ fontWeight:800, color:"#0a2540", fontSize:17 }}>{MONTHS[b.month-1]} {b.year}</div>
                    <div style={{ fontSize:13, color:"#94a8b8", marginTop:4 }}>
                      Meter: {b.prevReading} → {b.currReading} m³ · {b.units} units used · Due: {b.dueDate}
                    </div>
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontWeight:800, fontSize:22, color:"#0a2540" }}>{fmtKES(b.amount)}</div>
                    <Badge status={b.status}/>
                  </div>
                </div>
                {/* Calculation breakdown */}
                <div style={{ background:"#f8fbff", borderRadius:12, padding:14, fontSize:13, marginBottom:14 }}>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8, textAlign:"center" }}>
                    <div><div style={{ color:"#94a8b8", fontSize:11, fontWeight:600 }}>UNITS</div><div style={{ fontWeight:800, color:"#0077b6" }}>{b.units} m³</div></div>
                    <div><div style={{ color:"#94a8b8", fontSize:11, fontWeight:600 }}>RATE</div><div style={{ fontWeight:800, color:"#0a2540" }}>×{RATE_PER_UNIT}</div></div>
                    <div><div style={{ color:"#94a8b8", fontSize:11, fontWeight:600 }}>TOTAL</div><div style={{ fontWeight:800, color:"#059669" }}>{fmtKES(b.amount)}</div></div>
                  </div>
                </div>
                {/* Payment progress */}
                <div style={{ marginBottom:b.status!=="paid"?14:0 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:6 }}>
                    <span style={{ color:"#5b8fa8", fontWeight:600 }}>Paid: {fmtKES(paid)}</span>
                    <span style={{ color: remaining>0?"#dc2626":"#059669", fontWeight:700 }}>{remaining>0?`Remaining: ${fmtKES(remaining)}`:"Fully Paid ✓"}</span>
                  </div>
                  <div style={{ background:"#e8f4fd", borderRadius:8, height:8 }}>
                    <div style={{ background: pct>=100?"#059669":"linear-gradient(90deg,#0077b6,#00b4d8)", borderRadius:8, height:8, width:`${pct}%`, transition:"width .5s" }}/>
                  </div>
                </div>
                {b.status!=="paid" && (
                  <button onClick={()=>{ setPayForm({method:"M-Pesa",ref:"",amount:remaining}); setPayModal(b); }}
                    style={btnPrimary}>
                    <Icon name="pay" size={15} color="#fff"/> Pay {fmtKES(remaining)}
                  </button>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );

    if (page==="payments") return (
      <div>
        <h2 style={h2style}>Payment History</h2>
        {myPayments.length===0 ? (
          <div style={{ textAlign:"center", color:"#94a8b8", padding:40 }}>No payments yet.</div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
            {[...myPayments].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{
              const b=bills.find(x=>x.id===p.billId);
              return (
                <div key={p.id} style={{ background:"#fff", borderRadius:16, padding:18, boxShadow:"0 2px 12px rgba(10,37,64,0.06)", border:"1px solid #e8f4fd", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:12 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:14 }}>
                    <div style={{ background:"#d1fae5", borderRadius:12, width:44, height:44, display:"flex", alignItems:"center", justifyContent:"center" }}>
                      <Icon name="check" size={20} color="#059669"/>
                    </div>
                    <div>
                      <div style={{ fontWeight:700, color:"#0a2540" }}>{b ? `${MONTHS[b.month-1]} ${b.year} Bill` : "Payment"}</div>
                      <div style={{ fontSize:12, color:"#94a8b8" }}>{p.date} · {p.method} · <span style={{ fontFamily:"monospace", color:"#059669" }}>{p.ref}</span></div>
                    </div>
                  </div>
                  <div style={{ fontWeight:800, fontSize:18, color:"#059669" }}>{fmtKES(p.amount)}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );

    // ── PAGE: NOTIFICATIONS ─────────────────────────────────────────────────
    if (page==="notifications") {
      return <NotificationsModule store={store} showToast={showToast} currentUser={user}/>;
    }

    // ── PAGE: USAGE ANALYTICS ───────────────────────────────────────────────
    if (page==="usage") {
      const totalUnits  = myBills.reduce((s,b)=>s+b.units,0);
      const avgUnits    = myBills.length ? Math.round(totalUnits/myBills.length) : 0;
      const maxBill     = myBills.reduce((mx,b)=>b.units>mx.units?b:mx, myBills[0]||{units:0});
      const minBill     = myBills.filter(b=>b.units>0).reduce((mn,b)=>b.units<mn.units?b:mn, myBills.find(b=>b.units>0)||{units:0});
      const lastMonth   = myBills[0];
      const prevMonth   = myBills[1];
      const trend       = lastMonth && prevMonth ? lastMonth.units - prevMonth.units : 0;
      const trendPct    = prevMonth?.units ? Math.abs(Math.round((trend/prevMonth.units)*100)) : 0;

      // Bar chart helper
      const BarRow = ({ label, units, maxU, amount, month }) => {
        const pct = maxU > 0 ? Math.round((units/maxU)*100) : 0;
        const isHighest = units === maxBill?.units;
        const isLowest  = units === minBill?.units && units > 0;
        return (
          <div style={{ marginBottom:14 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:5 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <span style={{ fontWeight:700, color:"#0a2540", fontSize:13, minWidth:36 }}>{label}</span>
                {isHighest && <span style={{ background:"#fee2e2", color:"#dc2626", borderRadius:6, padding:"1px 7px", fontSize:11, fontWeight:700 }}>Highest</span>}
                {isLowest  && <span style={{ background:"#d1fae5", color:"#059669", borderRadius:6, padding:"1px 7px", fontSize:11, fontWeight:700 }}>Lowest</span>}
              </div>
              <div style={{ textAlign:"right" }}>
                <span style={{ fontWeight:800, color:"#0077b6", fontSize:14 }}>{units} m³</span>
                <span style={{ color:"#94a8b8", fontSize:12, marginLeft:8 }}>{fmtKES(amount)}</span>
              </div>
            </div>
            <div style={{ background:"#e8f4fd", borderRadius:8, height:10, overflow:"hidden" }}>
              <div style={{ background: isHighest?"linear-gradient(90deg,#dc2626,#f87171)":isLowest?"linear-gradient(90deg,#059669,#34d399)":"linear-gradient(90deg,#0077b6,#00b4d8)",
                height:10, borderRadius:8, width:`${pct}%`, transition:"width .6s ease" }}/>
            </div>
          </div>
        );
      };

      // Savings tips based on consumption
      const tips = [
        avgUnits > 40 && { icon:"💧", tip:"Your usage is above average. Check for running taps or leaking pipes at night." },
        avgUnits > 30 && { icon:"🚿", tip:"Consider shorter showers — a 5-minute shower uses about 50 litres." },
        trend > 5     && { icon:"📈", tip:`Your usage jumped ${trendPct}% this month. Look for a new leak or seasonal use.` },
        trend < -5    && { icon:"🌟", tip:`Great work! You reduced usage by ${trendPct}% compared to last month.` },
        avgUnits <= 25 && { icon:"✅", tip:"You're a water-efficient household. Keep it up!" },
        { icon:"🪣", tip:"Collect rainwater for watering plants to cut outdoor usage." },
        { icon:"🔧", tip:"A dripping tap wastes up to 20 litres a day — fix it promptly." },
      ].filter(Boolean).slice(0,3);

      const maxU = Math.max(...myBills.map(b=>b.units), 1);

      return (
        <div>
          <h2 style={h2style}>Usage Analytics</h2>

          {/* Summary KPI cards */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))", gap:14, marginBottom:24 }}>
            {[
              { label:"Total Consumed", value:`${totalUnits} m³`,        sub:"all time",             color:"#7c3aed", bg:"#ede9fe" },
              { label:"Monthly Avg",    value:`${avgUnits} m³`,          sub:"per month",             color:"#0077b6", bg:"#dbeafe" },
              { label:"Highest Month",  value:`${maxBill?.units||0} m³`, sub:maxBill?`${MONTHS[maxBill.month-1]} ${maxBill.year}`:"—", color:"#dc2626", bg:"#fee2e2" },
              { label:"Lowest Month",   value:`${minBill?.units||0} m³`, sub:minBill?`${MONTHS[minBill.month-1]} ${minBill.year}`:"—", color:"#059669", bg:"#d1fae5" },
            ].map(s=>(
              <div key={s.label} style={{ background:s.bg, borderRadius:16, padding:18 }}>
                <div style={{ fontSize:11, color:s.color, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:6 }}>{s.label}</div>
                <div style={{ fontWeight:800, color:"#0a2540", fontSize:22, lineHeight:1 }}>{s.value}</div>
                <div style={{ fontSize:11, color:"#94a8b8", marginTop:4 }}>{s.sub}</div>
              </div>
            ))}
          </div>

          {/* Trend alert banner */}
          {lastMonth && prevMonth && (
            <div style={{ background: trend>5?"linear-gradient(135deg,#7f1d1d,#dc2626)":trend<-5?"linear-gradient(135deg,#065f46,#059669)":"linear-gradient(135deg,#0a2540,#0077b6)",
              borderRadius:16, padding:"16px 22px", color:"#fff", marginBottom:22, display:"flex", alignItems:"center", gap:14 }}>
              <div style={{ fontSize:28 }}>{trend>5?"📈":trend<-5?"📉":"📊"}</div>
              <div>
                <div style={{ fontWeight:800, fontSize:15 }}>
                  {trend>5 ? `Usage up ${trendPct}% vs last month` : trend<-5 ? `Usage down ${trendPct}% vs last month` : "Usage is stable compared to last month"}
                </div>
                <div style={{ opacity:0.8, fontSize:13, marginTop:3 }}>
                  {MONTHS[prevMonth.month-1]}: {prevMonth.units} m³ → {MONTHS[lastMonth.month-1]}: {lastMonth.units} m³
                  {trend!==0 && ` (${trend>0?"+":""}${trend} m³)`}
                </div>
              </div>
            </div>
          )}

          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))", gap:16, marginBottom:16 }}>

            {/* Monthly consumption bar chart */}
            <div style={{ background:"#fff", borderRadius:18, padding:22, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" }}>
              <h3 style={{ margin:"0 0 18px", fontSize:15, color:"#0a2540", fontWeight:800 }}>📊 Monthly Consumption (m³)</h3>
              {myBills.length===0 ? (
                <div style={{ textAlign:"center", color:"#94a8b8", padding:24 }}>No data yet.</div>
              ) : (
                myBills.slice(0,8).map(b=>(
                  <BarRow key={b.id} label={MONTHS[b.month-1]} units={b.units} maxU={maxU}
                    amount={b.amount||b.totalAmount||0} month={b.month}/>
                ))
              )}
            </div>

            {/* Bill cost breakdown per month */}
            <div style={{ background:"#fff", borderRadius:18, padding:22, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" }}>
              <h3 style={{ margin:"0 0 18px", fontSize:15, color:"#0a2540", fontWeight:800 }}>💰 Monthly Bill Breakdown</h3>
              {myBills.length===0 ? (
                <div style={{ textAlign:"center", color:"#94a8b8", padding:24 }}>No data yet.</div>
              ) : (
                <>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(100px,1fr))", gap:10, marginBottom:18 }}>
                    {myBills.slice(0,6).map(b=>(
                      <div key={b.id} style={{ background:"#f8fbff", borderRadius:12, padding:"12px 10px", textAlign:"center" }}>
                        <div style={{ fontSize:11, color:"#94a8b8", fontWeight:600, marginBottom:4 }}>{MONTHS[b.month-1]}</div>
                        <div style={{ fontWeight:800, color:"#0077b6", fontSize:18, lineHeight:1 }}>{b.units}</div>
                        <div style={{ fontSize:10, color:"#94a8b8", marginBottom:6 }}>m³</div>
                        <div style={{ fontWeight:700, color:"#059669", fontSize:12 }}>{fmtKES(b.amount||b.totalAmount||0)}</div>
                        <Badge status={b.status}/>
                      </div>
                    ))}
                  </div>
                  {/* Cost formula reminder */}
                  <div style={{ background:"#f0f7ff", borderRadius:10, padding:"10px 14px", fontSize:13 }}>
                    <div style={{ color:"#5b8fa8", fontWeight:700, marginBottom:4 }}>How your bill is calculated</div>
                    <div style={{ color:"#0a2540" }}>
                      Units × <b style={{ color:"#0077b6" }}>KES {RATE_PER_UNIT}</b> + <b style={{ color:"#0077b6" }}>KES 200</b> standing charge
                    </div>
                  </div>
                </>
              )}
            </div>
          </div>

          {/* Water usage comparison ring */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))", gap:16, marginBottom:16 }}>

            <div style={{ background:"#fff", borderRadius:18, padding:22, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" }}>
              <h3 style={{ margin:"0 0 16px", fontSize:15, color:"#0a2540", fontWeight:800 }}>📐 Usage vs Benchmarks</h3>
              {[
                { label:"Your avg monthly usage", value:avgUnits,   max:100, color:"#0077b6" },
                { label:"WHO rec. (50 l/day/person)", value:Math.round(50*30/1000*10)/10, max:100, color:"#059669", note:"50 L/day" },
                { label:"Kenyan avg household",    value:35,         max:100, color:"#f59e0b", note:"~35 m³" },
              ].map((b,i)=>(
                <div key={i} style={{ marginBottom:14 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:5 }}>
                    <span style={{ color:"#5b8fa8", fontWeight:600 }}>{b.label}</span>
                    <b style={{ color:b.color }}>{b.value} m³ {b.note||""}</b>
                  </div>
                  <div style={{ background:"#e8f4fd", borderRadius:8, height:10 }}>
                    <div style={{ background:b.color, borderRadius:8, height:10, width:`${Math.min((b.value/b.max)*100,100)}%`, transition:"width .6s" }}/>
                  </div>
                </div>
              ))}
              <div style={{ background:"#f8fbff", borderRadius:10, padding:"10px 14px", fontSize:12, color:"#5b8fa8", marginTop:8 }}>
                {avgUnits > 50 ? "⚠ Your usage is above the WHO recommendation. Look for ways to reduce." :
                 avgUnits > 35 ? "ℹ Your usage is above the Kenyan average household." :
                 "✅ Your usage is within healthy benchmarks."}
              </div>
            </div>

            {/* Water savings tips */}
            <div style={{ background:"linear-gradient(135deg,#0a2540,#0d3a60)", borderRadius:18, padding:22, color:"#fff" }}>
              <h3 style={{ margin:"0 0 16px", fontSize:15, fontWeight:800, opacity:0.9 }}>💡 Personalised Water Saving Tips</h3>
              {tips.map((t,i)=>(
                <div key={i} style={{ display:"flex", gap:12, marginBottom:14, padding:"12px 14px", background:"rgba(255,255,255,0.07)", borderRadius:12 }}>
                  <span style={{ fontSize:22, flexShrink:0 }}>{t.icon}</span>
                  <span style={{ fontSize:13, lineHeight:1.6, opacity:0.85 }}>{t.tip}</span>
                </div>
              ))}
              <div style={{ marginTop:16, padding:"12px 14px", background:"rgba(0,180,216,0.15)", borderRadius:12, fontSize:12, color:"rgba(255,255,255,0.6)" }}>
                💬 Need help reducing your bill? Contact us via <b style={{ color:"#00b4d8" }}>Help & Support</b>.
              </div>
            </div>
          </div>

          {/* Detailed monthly table */}
          <div style={{ background:"#fff", borderRadius:18, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd", overflow:"hidden" }}>
            <div style={{ padding:"18px 22px 14px", borderBottom:"1px solid #f0f7ff" }}>
              <h3 style={{ margin:0, fontSize:15, color:"#0a2540", fontWeight:800 }}>📋 Full Consumption History</h3>
            </div>
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                <thead>
                  <tr style={{ background:"#f8fbff" }}>
                    {["Month","Prev Reading","Curr Reading","Units Used","Bill Amount","Status","vs Avg"].map(h=>(
                      <th key={h} style={{ padding:"11px 14px", textAlign:"left", color:"#5b8fa8", fontWeight:700, fontSize:11, textTransform:"uppercase", letterSpacing:"0.05em", borderBottom:"1px solid #e8f4fd", whiteSpace:"nowrap" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {myBills.length===0 && <tr><td colSpan={7} style={{ textAlign:"center", padding:40, color:"#94a8b8" }}>No billing history yet.</td></tr>}
                  {myBills.map((b,i)=>{
                    const vsAvg  = avgUnits > 0 ? b.units - avgUnits : 0;
                    const vsSign = vsAvg > 0 ? "+" : "";
                    return (
                      <tr key={b.id} style={{ borderBottom:"1px solid #f0f7ff", background:i%2===0?"#fff":"#fafcff" }}>
                        <td style={{ padding:"11px 14px", fontWeight:800, color:"#0a2540" }}>{MONTHS[b.month-1]} {b.year}</td>
                        <td style={{ padding:"11px 14px", color:"#6b7280" }}>{b.prevReading} m³</td>
                        <td style={{ padding:"11px 14px" }}><b>{b.currReading} m³</b></td>
                        <td style={{ padding:"11px 14px" }}>
                          <span style={{ background:"#dbeafe", color:"#0077b6", borderRadius:6, padding:"2px 8px", fontWeight:700 }}>{b.units} m³</span>
                        </td>
                        <td style={{ padding:"11px 14px" }}><b style={{ color:"#0a2540" }}>{fmtKES(b.amount||b.totalAmount||0)}</b></td>
                        <td style={{ padding:"11px 14px" }}><Badge status={b.status}/></td>
                        <td style={{ padding:"11px 14px" }}>
                          <span style={{ fontWeight:700, color: vsAvg>5?"#dc2626":vsAvg<-5?"#059669":"#94a8b8", fontSize:12 }}>
                            {avgUnits > 0 ? `${vsSign}${vsAvg} m³` : "—"}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
                {myBills.length > 0 && (
                  <tfoot>
                    <tr style={{ background:"#f0f7ff", borderTop:"2px solid #e8f4fd" }}>
                      <td style={{ padding:"11px 14px", fontWeight:800, color:"#0a2540" }}>TOTAL / AVG</td>
                      <td style={{ padding:"11px 14px" }}>—</td>
                      <td style={{ padding:"11px 14px" }}>—</td>
                      <td style={{ padding:"11px 14px" }}><b style={{ color:"#7c3aed" }}>{totalUnits} m³ total · {avgUnits} avg</b></td>
                      <td style={{ padding:"11px 14px" }}><b style={{ color:"#059669" }}>{fmtKES(myBills.reduce((s,b)=>s+(b.amount||b.totalAmount||0),0))}</b></td>
                      <td style={{ padding:"11px 14px" }}>—</td>
                      <td style={{ padding:"11px 14px" }}>—</td>
                    </tr>
                  </tfoot>
                )}
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ── PAGE: MY METER ──────────────────────────────────────────────────────
    if (page==="meter") {
      const myMeter = store.meters.find(m => m.customerId === user.id);
      const statusColors = { active:"#059669", faulty:"#dc2626", replaced:"#9ca3af", disconnected:"#f59e0b", pending:"#7c3aed" };
      const statusBgs    = { active:"#d1fae5", faulty:"#fee2e2", replaced:"#f3f4f6", disconnected:"#fef3c7", pending:"#ede9fe" };
      return (
        <div>
          <h2 style={h2style}>My Meter</h2>
          {!myMeter ? (
            <div style={{ background:"#fff", borderRadius:18, padding:40, textAlign:"center", border:"1px solid #e8f4fd" }}>
              <Icon name="meter" size={48} color="#94a8b8"/>
              <div style={{ color:"#94a8b8", marginTop:12, fontWeight:600 }}>No meter assigned to your account yet.</div>
              <div style={{ color:"#94a8b8", fontSize:13, marginTop:6 }}>Please contact H2O Water Limited support.</div>
            </div>
          ) : (
            <>
              {/* Meter identity card */}
              <div style={{ background:"linear-gradient(135deg,#0a2540,#0077b6)", borderRadius:22, padding:28, color:"#fff", marginBottom:20, position:"relative", overflow:"hidden" }}>
                <div style={{ position:"absolute", right:-30, top:-30, width:160, height:160, background:"rgba(255,255,255,0.05)", borderRadius:"50%" }}/>
                <div style={{ position:"absolute", right:40, bottom:-40, width:100, height:100, background:"rgba(255,255,255,0.04)", borderRadius:"50%" }}/>
                <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", flexWrap:"wrap", gap:16 }}>
                  <div>
                    <div style={{ fontSize:12, opacity:0.6, letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:8 }}>Meter Number</div>
                    <div style={{ fontFamily:"monospace", fontSize:32, fontWeight:800, letterSpacing:"0.05em" }}>{myMeter.meterNo}</div>
                    <div style={{ marginTop:10, fontSize:13, opacity:0.7 }}>Serial: {myMeter.serialNo} · {myMeter.type} · {myMeter.brand}</div>
                    <div style={{ marginTop:4, fontSize:13, opacity:0.7 }}>📍 {myMeter.address}, {myMeter.area}</div>
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ background: statusBgs[myMeter.status]||"#f3f4f6", color: statusColors[myMeter.status]||"#6b7280", borderRadius:20, padding:"5px 14px", fontWeight:800, fontSize:13, display:"inline-block" }}>
                      ● {myMeter.status.charAt(0).toUpperCase()+myMeter.status.slice(1)}
                    </div>
                    <div style={{ marginTop:12, fontSize:13, opacity:0.7 }}>Installed: {myMeter.installDate}</div>
                  </div>
                </div>
              </div>

              {/* Current reading highlight */}
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:14, marginBottom:20 }}>
                {[
                  { label:"Current Reading",  value:`${myMeter.currentReading} m³`,          color:"#0077b6", bg:"#dbeafe"  },
                  { label:"Last Captured",     value:myMeter.lastReadingDate||"Not yet",       color:"#059669", bg:"#d1fae5"  },
                  { label:"Meter Type",        value:myMeter.type,                             color:"#7c3aed", bg:"#ede9fe"  },
                  { label:"Brand",             value:myMeter.brand,                            color:"#f59e0b", bg:"#fef3c7"  },
                ].map(s=>(
                  <div key={s.label} style={{ background:s.bg, borderRadius:16, padding:18 }}>
                    <div style={{ fontSize:11, color:s.color, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:6 }}>{s.label}</div>
                    <div style={{ fontWeight:800, color:"#0a2540", fontSize:17 }}>{s.value}</div>
                  </div>
                ))}
              </div>

              {/* Faulty warning */}
              {myMeter.status==="faulty" && (
                <div style={{ background:"#fff7ed", border:"1px solid #fed7aa", borderRadius:16, padding:"16px 20px", marginBottom:20, display:"flex", alignItems:"center", gap:14 }}>
                  <Icon name="warn" size={28} color="#f97316"/>
                  <div>
                    <div style={{ fontWeight:800, color:"#92400e", fontSize:15 }}>Your meter has been flagged as faulty</div>
                    <div style={{ fontSize:13, color:"#b45309", marginTop:4 }}>A technician has been notified. Please use the Help & Support tab to follow up.</div>
                    {myMeter.notes && <div style={{ fontSize:12, color:"#c2410c", marginTop:6, fontStyle:"italic" }}>Note: {myMeter.notes}</div>}
                  </div>
                </div>
              )}

              {/* Reading history table */}
              <div style={{ background:"#fff", borderRadius:18, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd", overflow:"hidden" }}>
                <div style={{ padding:"18px 22px 14px", borderBottom:"1px solid #f0f7ff", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <h3 style={{ margin:0, fontSize:15, color:"#0a2540", fontWeight:800 }}>📈 Reading History</h3>
                  <span style={{ fontSize:12, color:"#94a8b8" }}>{myBills.length} readings</span>
                </div>
                {myBills.length===0 ? (
                  <div style={{ textAlign:"center", color:"#94a8b8", padding:40 }}>No readings yet.</div>
                ) : (
                  <>
                    <div style={{ padding:"16px 22px 8px" }}>
                      <MiniBar data={myBills.slice(0,8).reverse().map(b=>({ lbl:MONTHS[b.month-1], val:b.units }))} color="#0077b6"/>
                    </div>
                    <div style={{ overflowX:"auto" }}>
                      <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                        <thead><tr style={{ background:"#f8fbff" }}>
                          {["Period","Prev (m³)","Current (m³)","Units Used","Bill Amount","Status"].map(h=>(
                            <th key={h} style={{ padding:"10px 14px", textAlign:"left", color:"#5b8fa8", fontWeight:700, fontSize:11, textTransform:"uppercase", borderBottom:"1px solid #e8f4fd", whiteSpace:"nowrap" }}>{h}</th>
                          ))}
                        </tr></thead>
                        <tbody>
                          {myBills.map((b,i)=>(
                            <tr key={b.id} style={{ borderBottom:"1px solid #f0f7ff", background:i%2===0?"#fff":"#fafcff" }}>
                              <td style={{ padding:"11px 14px", fontWeight:700, color:"#0a2540" }}>{MONTHS[b.month-1]} {b.year}</td>
                              <td style={{ padding:"11px 14px", color:"#374151" }}>{b.prevReading}</td>
                              <td style={{ padding:"11px 14px" }}><b>{b.currReading}</b></td>
                              <td style={{ padding:"11px 14px" }}><span style={{ background:"#dbeafe", color:"#0077b6", borderRadius:6, padding:"2px 8px", fontWeight:700 }}>{b.units} m³</span></td>
                              <td style={{ padding:"11px 14px" }}><b style={{ color:"#0a2540" }}>{fmtKES(b.amount)}</b></td>
                              <td style={{ padding:"11px 14px" }}><Badge status={b.status}/></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </>
                )}
              </div>
            </>
          )}
        </div>
      );
    }

    // ── PAGE: MY PROFILE ────────────────────────────────────────────────────
    if (page==="profile") {
      return <ProfilePage user={user} store={store} showToast={showToast} myBills={myBills} totalPaid={totalPaid} balance={balance}/>;
    }

      return (
        <div>
          <h2 style={h2style}>My Profile</h2>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))", gap:20 }}>

            {/* Account details card */}
            <div style={{ background:"#fff", borderRadius:18, padding:24, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" }}>
              {/* Avatar */}
              <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:22, paddingBottom:20, borderBottom:"1px solid #f0f7ff" }}>
                <div style={{ width:64, height:64, background:"linear-gradient(135deg,#0077b6,#00b4d8)", borderRadius:18, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:28, flexShrink:0 }}>
                  {user.name.charAt(0)}
                </div>
                <div>
                  <div style={{ fontWeight:800, color:"#0a2540", fontSize:18 }}>{user.name}</div>
                  <div style={{ fontSize:13, color:"#94a8b8", marginTop:2 }}>{user.area} · {user.type||"Residential"}</div>
                  <div style={{ marginTop:6, display:"flex", gap:8 }}>
                    <span style={{ background:"#d1fae5", color:"#065f46", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>● Active</span>
                    <span style={{ background:"#dbeafe", color:"#1e40af", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>Since {user.joinDate}</span>
                  </div>
                </div>
              </div>

              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
                <h3 style={{ margin:0, fontSize:15, color:"#0a2540", fontWeight:800 }}>Account Details</h3>
                <button onClick={()=>setEditing(!editing)} style={{ background: editing?"#fee2e2":"#f0f7ff", color: editing?"#dc2626":"#0077b6", border:"none", borderRadius:8, padding:"6px 14px", fontWeight:700, fontSize:12, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>
                  <Icon name={editing?"x":"edit"} size={13} color={editing?"#dc2626":"#0077b6"}/> {editing?"Cancel":"Edit"}
                </button>
              </div>

              {[
                { label:"Full Name",    key:"name",    type:"text"  },
                { label:"Phone",        key:"phone",   type:"tel"   },
                { label:"Email",        key:"email",   type:"email" },
                { label:"Address",      key:"address", type:"text"  },
              ].map(f=>(
                <div key={f.key} style={{ marginBottom:14 }}>
                  <label style={labelSt}>{f.label}</label>
                  <input type={f.type} value={profForm[f.key]} disabled={!editing}
                    onChange={e=>setProfForm(p=>({...p,[f.key]:e.target.value}))}
                    style={fieldSt}/>
                </div>
              ))}

              {/* Read-only fields */}
              {[
                { label:"Meter Number", value:user.meterNo },
                { label:"Area",         value:user.area    },
              ].map(f=>(
                <div key={f.label} style={{ marginBottom:14 }}>
                  <label style={labelSt}>{f.label}</label>
                  <input type="text" value={f.value} disabled style={{ ...fieldSt, background:"#f4f8fb", color:"#94a8b8" }}/>
                </div>
              ))}

              {editing && (
                <button onClick={saveProfile} style={{ width:"100%", padding:"11px", background:"linear-gradient(135deg,#0077b6,#00b4d8)", color:"#fff", border:"none", borderRadius:12, fontWeight:700, fontSize:14, cursor:"pointer", marginTop:4, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
                  <Icon name="check" size={16} color="#fff"/> Save Changes
                </button>
              )}
            </div>

            {/* Right column */}
            <div style={{ display:"flex", flexDirection:"column", gap:20 }}>

              {/* Change password */}
              <div style={{ background:"#fff", borderRadius:18, padding:24, boxShadow:"0 2px 16px rgba(10,37,64,0.07)", border:"1px solid #e8f4fd" }}>
                <h3 style={{ margin:"0 0 18px", fontSize:15, color:"#0a2540", fontWeight:800 }}>🔒 Change Password</h3>
                {["current","next","confirm"].map((k,i)=>(
                  <div key={k} style={{ marginBottom:14 }}>
                    <label style={labelSt}>{["Current Password","New Password","Confirm New Password"][i]}</label>
                    <input type="password" value={pwForm[k]} onChange={e=>setPwForm(p=>({...p,[k]:e.target.value}))}
                      placeholder="••••••••" style={{ ...fieldSt, background:"#f8fbff" }}/>
                  </div>
                ))}
                {pwErr     && <div style={{ background:"#fee2e2", color:"#991b1b", padding:"10px 14px", borderRadius:10, fontSize:13, marginBottom:12 }}>{pwErr}</div>}
                {pwSuccess && <div style={{ background:"#d1fae5", color:"#065f46", padding:"10px 14px", borderRadius:10, fontSize:13, fontWeight:700, marginBottom:12 }}>✓ Password changed successfully!</div>}
                <button onClick={changePassword} style={{ width:"100%", padding:"10px", background:"linear-gradient(135deg,#7c3aed,#a78bfa)", color:"#fff", border:"none", borderRadius:12, fontWeight:700, fontSize:14, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
                  <Icon name="check" size={15} color="#fff"/> Update Password
                </button>
              </div>

  return (
    <div style={{ display:"flex", minHeight:"100vh", fontFamily:"'DM Sans',sans-serif", background:"#f4f8fb" }}>
      <div className="desktop-sidebar"><Sidebar/></div>
      {sideOpen && (
        <div style={{ position:"fixed", inset:0, zIndex:200 }}>
          <div style={{ position:"absolute", inset:0, background:"rgba(0,0,0,0.5)" }} onClick={()=>setSideOpen(false)}/>
          <div style={{ position:"relative", width:220, height:"100%" }}><Sidebar/></div>
        </div>
      )}
      <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
        <div style={{ background:"#fff", borderBottom:"1px solid #e8f4fd", padding:"14px 20px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ display:"flex", alignItems:"center", gap:12 }}>
            <button onClick={()=>setSideOpen(true)} className="mobile-menu" style={{ background:"none", border:"none", cursor:"pointer", display:"none", padding:4 }}>
              <Icon name="menu" size={22} color="#0a2540"/>
            </button>
            <div>
              <div style={{ fontWeight:800, color:"#0a2540", fontSize:16, fontFamily:"'Playfair Display',serif" }}>
                {navItems.find(n=>n.id===page)?.label}
              </div>
              <div style={{ fontSize:12, color:"#94a8b8" }}>Welcome, {user.name.split(" ")[0]}</div>
            </div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            {balance>0 && <span style={{ background:"#fee2e2", color:"#991b1b", borderRadius:8, padding:"4px 10px", fontSize:12, fontWeight:700 }}>{fmtKES(balance)} due</span>}
            <div style={{ background:"linear-gradient(135deg,#0077b6,#00b4d8)", borderRadius:10, width:36, height:36, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:700, fontSize:14 }}>
              {user.name.charAt(0)}
            </div>
          </div>
        </div>
        <div style={{ flex:1, overflowY:"auto", padding:"24px 20px" }}>
          {renderPage()}
        </div>
      </div>

      {/* Payment Modal */}
      {payModal && (
        <Modal title={`Pay Bill — ${MONTHS[payModal.month-1]} ${payModal.year}`} onClose={()=>setPayModal(null)}>
          <div style={{ background:"#f8fbff", borderRadius:12, padding:16, marginBottom:16 }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
              <span style={{ color:"#5b8fa8", fontSize:13 }}>Bill Amount</span>
              <b style={{ color:"#0a2540" }}>{fmtKES(payModal.amount)}</b>
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
              <span style={{ color:"#5b8fa8", fontSize:13 }}>Already Paid</span>
              <b style={{ color:"#059669" }}>{fmtKES(billPaid(payModal.id))}</b>
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", borderTop:"1px solid #dde8f0", paddingTop:8 }}>
              <span style={{ color:"#5b8fa8", fontSize:13, fontWeight:700 }}>Remaining</span>
              <b style={{ color:"#dc2626", fontSize:16 }}>{fmtKES(payModal.amount-billPaid(payModal.id))}</b>
            </div>
          </div>
          <Input label="Amount to Pay (KES)" type="number" value={payForm.amount} onChange={e=>setPayForm(f=>({...f,amount:e.target.value}))} placeholder={`${payModal.amount-billPaid(payModal.id)}`}/>
          <Input label="Payment Method" as="select" value={payForm.method} onChange={e=>setPayForm(f=>({...f,method:e.target.value}))}>
            {["M-Pesa","Bank Transfer","Cash","Cheque","PesaLink"].map(m=><option key={m}>{m}</option>)}
          </Input>
          <Input label="M-Pesa / Transaction Reference" type="text" placeholder="e.g. QWE123456" value={payForm.ref} onChange={e=>setPayForm(f=>({...f,ref:e.target.value}))}/>
          <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:8 }}>
            <button onClick={()=>setPayModal(null)} style={btnSecondary}>Cancel</button>
            <button onClick={()=>submitPayment(payModal)} style={btnPrimary}><Icon name="check" size={16} color="#fff"/> Confirm Payment</button>
          </div>
        </Modal>
      )}

      {toast && (
        <div style={{ position:"fixed", bottom:24, right:24, background: toast.type==="error"?"#dc2626":"#059669", color:"#fff", padding:"14px 22px", borderRadius:14, fontWeight:700, fontSize:14, boxShadow:"0 8px 30px rgba(0,0,0,0.25)", zIndex:9999, display:"flex", alignItems:"center", gap:10 }}>
          <Icon name={toast.type==="error"?"x":"check"} size={18} color="#fff"/>
          {toast.msg}
        </div>
      )}
      <style>{`.desktop-sidebar{display:flex!important} @media(max-width:767px){.desktop-sidebar{display:none!important}.mobile-menu{display:flex!important}}`}</style>
    </div>
  );
};

// ── Shared styles
const h2style = { fontFamily:"'Playfair Display',serif", color:"#0a2540", fontSize:22, fontWeight:800, marginBottom:20 };
const td = { padding:"12px 16px", color:"#374151", verticalAlign:"middle" };
const btnPrimary = { background:"linear-gradient(135deg,#0077b6,#00b4d8)", color:"#fff", border:"none", borderRadius:10, padding:"10px 18px", fontWeight:700, fontSize:13, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:7, whiteSpace:"nowrap" };
const btnSecondary = { background:"#f0f7ff", color:"#0077b6", border:"1.5px solid #dde8f0", borderRadius:10, padding:"10px 18px", fontWeight:700, fontSize:13, cursor:"pointer" };
const btnIcon = { background:"#f0f7ff", border:"none", borderRadius:8, width:32, height:32, cursor:"pointer", display:"inline-flex", alignItems:"center", justifyContent:"center" };

// ════════════════════════════════════════════════════════════════════════════
//  ROOT APP
// ════════════════════════════════════════════════════════════════════════════
function App() {
  const store = useStore();
  const [session, setSession] = useState(null);

  return (
    <>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif}input:focus,select:focus{border-color:#0077b6!important;box-shadow:0 0 0 3px rgba(0,119,182,0.15);outline:none}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#f0f7ff}::-webkit-scrollbar-thumb{background:#aacfe0;border-radius:4px}`}</style>
      {!session && <LoginPage onLogin={setSession} users={store.users}/>}
      {session?.role==="admin" && <AdminDash store={store} onLogout={()=>setSession(null)}/>}
      {session?.role==="user"  && <UserDash  user={session} store={store} onLogout={()=>setSession(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(App)
);

  </script>

  <script>
    // Hide loading splash after React mounts
    (function hideSplash() {
      var attempts = 0;
      var timer = setInterval(function() {
        var root = document.getElementById('root');
        var loading = document.getElementById('loading');
        if (!loading) { clearInterval(timer); return; }
        // Hide once React has rendered something into #root
        if (root && root.children.length > 0) {
          loading.style.opacity = '0';
          setTimeout(function(){ if(loading) loading.remove(); }, 500);
          clearInterval(timer);
        }
        if (++attempts > 40) { // 4s timeout fallback
          loading.style.opacity = '0';
          setTimeout(function(){ if(loading) loading.remove(); }, 500);
          clearInterval(timer);
        }
      }, 100);
    })();
  </script>

</body>
</html>
